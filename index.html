            VFX.spawnSmokePoof(this.x, this.y - 70, 5);
            VFX.spawnSmokePoof(this.shadowClones[0].x, this.y - 70, 5);
            VFX.spawnSmokePoof(this.shadowClones[1].x, this.y - 165, 5);
            AUDIO.sfxClonePoof();
          }

          if (this.stateTimer >= 6 && this.stateTimer < spec.startup + spec.active) {
            this.x = Math.max(CONFIG.STAGE_LEFT + 10, this.cloneTargetX - 82 + Math.sin(this.stateTimer * 0.6) * 20);
            this.facing = opponent.x >= this.x ? 1 : -1;
            if (this.shadowClones.length >= 2) {
              this.shadowClones[0].x = Math.min(CONFIG.STAGE_RIGHT - 10, this.cloneTargetX + 82 - Math.sin(this.stateTimer * 0.6) * 20);
              this.shadowClones[0].facing = opponent.x >= this.shadowClones[0].x ? 1 : -1;
              this.shadowClones[1].x = this.cloneTargetX + Math.cos(this.stateTimer * 0.7) * 32;
              this.shadowClones[1].y = CONFIG.GROUND_Y - 95 - Math.abs(Math.sin(this.stateTimer * 0.45)) * 45;
              this.shadowClones[1].facing = this.facing;
            }

            spec.hitBeats.forEach((beat, idx) => {
              if (this.stateTimer === beat && !this.beatTriggered.has(idx)) {
                this.beatTriggered.add(idx);
                const isFinal = idx === spec.hitBeats.length - 1;
                VFX.spawnSlashArc({
                  x: this.cloneTargetX + (idx % 2 === 0 ? -25 : 25),
                  y: CONFIG.GROUND_Y - 85,
                  radius: isFinal ? 105 : 82,
                  startAngle: -1.2 + idx * 0.3,
                  endAngle: 1.0 - idx * 0.25,
                  facing: idx % 2 === 0 ? 1 : -1,
                  color: isFinal ? '#fde047' : '#c084fc',
                  lineWidth: isFinal ? 20 : 14
                });
                AUDIO.sfxSwordSlash();

                const zoneBox = {
                  x: this.cloneTargetX - 105,
                  y: CONFIG.GROUND_Y - 165,
                  width: 210,
                  height: 165
                };
                if (opponent.state !== 'KO' && opponent.invulnTimer <= 0 &&
                    COMBAT_ENGINE.rectsOverlap(zoneBox, opponent.getHurtbox())) {
                  COMBAT_ENGINE.applyHit(this, opponent, {
                    damage: isFinal ? spec.finalDamage : spec.damagePerHit,
                    isSkill: true,
                    rageGain: 12,
                    ultGainAttacker: 0,
                    ultGainDefender: spec.ultGainDefender,
                    hitstun: spec.hitstun,
                    blockstun: 12,
                    knockbackX: isFinal ? spec.knockbackX : 2.5,
                    knockbackY: isFinal ? spec.knockbackY : -2.2,
                    knockdown: isFinal,
                    guardBreak: false,
                    hitstop: isFinal ? 8 : 2,
                    shake: isFinal ? 18 : 8,
                    direction: this.facing,
                    sourceX: this.cloneTargetX,
                    isHeavy: isFinal
                  });
                }
                if (opponent.getBannerHurtbox() && COMBAT_ENGINE.rectsOverlap(zoneBox, opponent.getBannerHurtbox())) {
                  COMBAT_ENGINE.damageBanner(opponent, isFinal ? spec.finalDamage : spec.damagePerHit);
                }
                COMBAT_ENGINE.damageGhostsInArea(this, zoneBox, isFinal ? spec.finalDamage : spec.damagePerHit);
              }
            });
          } else if (this.stateTimer === spec.startup + spec.active) {
            if (this.shadowClones.length > 0) {
              this.shadowClones.forEach((sc) => VFX.spawnSmokePoof(sc.x, sc.y - 60, 5));
              this.shadowClones = [];
              AUDIO.sfxClonePoof();
            }
          }
        } else if (spec.ultStyle === 'SONG_METEOR_DUNK') {
          if (this.stateTimer < 16) {
            this.vy = -28;
            this.vx = 0;
            if (this.stateTimer % 2 === 0) VFX.spawnAfterimage(this, '#fb923c');
          } else if (this.stateTimer < 30) {
            this.y = -75;
            this.vy = 0;
            const tx = Math.max(CONFIG.STAGE_LEFT + 60, Math.min(CONFIG.STAGE_RIGHT - 60, opponent.x));
            this.x += (tx - this.x) * 0.28;
            this.ultTargetX = this.x;
          } else if (this.stateTimer === 30) {
            this.y = -25;
            this.vy = 48;
            this.vx = 0;
          } else if (this.stateTimer > 30 && !this.isGrounded() && !this.ultImpactDone) {
            this.vy = 48;
            if (this.stateTimer % 2 === 0) VFX.spawnAfterimage(this, '#fb923c');
          }
          if (this.stateTimer >= 31 && this.isGrounded() && !this.ultImpactDone) {
            this.ultImpactDone = true;
            this.stateTimer = spec.startup;
            this.vy = 0;
            VFX.spawnGroundSlam(this.x, CONFIG.GROUND_Y, '#fb923c', 1.85);
            VFX.spawnHitSparks(this.x, CONFIG.GROUND_Y - 24, '#fde047', 26, 1.4);
            VFX.triggerScreenFlash('#fb923c', 0.45);
            VFX.triggerShake(22);
            AUDIO.sfxGroundSlam();
          }
        } else if (this.attackType === 'ULTIMATE' && spec.beamWidth) {
          // Classic Stickman Hyper Beam (UNTOUCHED)
          if (this.stateTimer === spec.startup) {
            VFX.triggerShake(18);
            AUDIO.sfxUltimateBeam();
          }
          const beamBox = this.getUltimateBeamBox();
          if (beamBox) {
            this.ultimateTickTimer++;
            if (this.ultimateTickTimer % spec.tickInterval === 1) {
              const isFinalTick = this.stateTimer >= spec.startup + spec.active - spec.tickInterval;
              if (opponent.state !== 'KO' && opponent.invulnTimer <= 0 &&
                  COMBAT_ENGINE.rectsOverlap(beamBox, opponent.getHurtbox())) {
                COMBAT_ENGINE.applyHit(this, opponent, {
                  damage: spec.damagePerTick,
                  isSkill: true,
                  rageGain: 14,
                  ultGainAttacker: 0,
                  ultGainDefender: 4,
                  hitstun: spec.hitstun,
                  blockstun: 12,
                  knockbackX: isFinalTick ? spec.knockbackX : 3.2,
                  knockbackY: isFinalTick ? spec.knockbackY : -2.0,
                  knockdown: isFinalTick,
                  guardBreak: spec.guardBreak,
                  hitstop: isFinalTick ? 8 : 2,
                  shake: 14,
                  direction: this.facing,
                  sourceX: this.x,
                  isHeavy: true
                });
              }
              if (opponent.getBannerHurtbox() && COMBAT_ENGINE.rectsOverlap(beamBox, opponent.getBannerHurtbox())) {
                COMBAT_ENGINE.damageBanner(opponent, spec.damagePerTick);
              }
              COMBAT_ENGINE.damageGhostsInArea(this, beamBox, spec.damagePerTick);
            }
          }
        } else {
          this.vx *= 0.86;
        }

        if (this.jobId === 'GAMBLER' && this.gambleCopyActive) {
          if (this.gambleCopySlot === 'SKILL1') this.cooldowns.SKILL1 = 0;
          if (this.stateTimer === frames.startup + 1) this.cooldowns.SKILL2 = this.job.attacks.SKILL2.cooldown;
        }

        // 4. End of Attack -> Return to Neutral
        const totalFrames = frames.startup + frames.active + frames.recovery;
        if (this.stateTimer >= totalFrames) {
          if (this.attackType === 'KICK' || this.attackType === 'SWORD_WAVE_SLASH' || this.attackType === 'AXE_SLAM' || this.attackType === 'SHURIKEN_DASH_SLASH' || this.attackType === 'FAN_WIND_GUST' || this.attackType === 'KNIGHT_SHIELD_BASH' || this.attackType === 'PIRATE_UPPER_SLASH' || this.attackType === 'REAPER_SLASH3' || this.attackType === 'WOLF_HUMAN_UPPER' || this.attackType === 'WOLF_CLAW3' || this.attackType === 'BASKET_THROW' || this.attackType === 'TKD_KICK' || this.attackType === 'TKD_ROUNDHOUSE1' || this.attackType === 'TKD_ROUNDHOUSE2' || this.attackType === 'TKD_DASH_DOUBLE_KICK' || this.attackType === 'TKD_BACK_SPIN_KICK' || this.attackType === 'TKD_JUMP_SIDE_KICK') {
            this.normalChainCooldown = 12;
          }
          this.iaidoLineBox = null;
          this.shadowClones = [];
          if (this.jobId === 'GAMBLER' && this.gambleCopyActive) {
            this.attacks = this.job.attacks;
            if (this.gambleCopySlot === 'SKILL1') this.cooldowns.SKILL1 = 0;
            this.gambleCopyActive = false;
          }
          this.attackType = null;
          this.attackHasHit = false;
          this.bannerHasHit = false;
          this.state = this.isGrounded() ? 'IDLE' : 'JUMP';
          this.stateTimer = 0;
        }
      }

      applyGravityAndBounds() {
        const skipGravity = this.state === 'ATTACK' && (
          this.attackType === 'ULTIMATE' ||
          (this.attacks[this.attackType] && this.attacks[this.attackType].skillStyle === 'SAMURAI_DANCE') ||
          (this.attacks[this.attackType] && this.attacks[this.attackType].skillStyle === 'TKD_JUMP_SIDE' && this.stateTimer < 14)
        );
        if (!this.isGrounded() || this.vy < 0) {
          if (!skipGravity) {
            this.vy += CONFIG.GRAVITY;
          }
          this.y += this.vy;
        }

        if (this.y >= CONFIG.GROUND_Y) {
          const wasAirborne = this.vy > 4;
          this.y = CONFIG.GROUND_Y;
          this.vy = 0;
          if (wasAirborne && this.state === 'JUMP') {
            this.state = 'IDLE';
            this.stateTimer = 0;
            VFX.spawnDust(this.x, CONFIG.GROUND_Y, 0);
          }
        }

        this.x += this.vx;
        this.x = Math.max(CONFIG.STAGE_LEFT, Math.min(CONFIG.STAGE_RIGHT, this.x));
      }

      updateHeadband() {
        if (!this.headbandNodes || this.headbandNodes.length === 0) return;
        const anchorX = this.x - this.facing * 8;
        const anchorY = this.y - 124;

        this.headbandNodes[0].x = anchorX;
        this.headbandNodes[0].y = anchorY;

        for (let i = 1; i < this.headbandNodes.length; i++) {
          const prev = this.headbandNodes[i - 1];
          const curr = this.headbandNodes[i];
          const windX = -this.facing * 9 - this.vx * 0.45;
          const waveY = Math.sin(this.animTick * 0.22 + i * 1.1) * 2.2 - this.vy * 0.15;

          const targetX = prev.x + windX;
          const targetY = prev.y + 2 + waveY;

          curr.x += (targetX - curr.x) * 0.45;
          curr.y += (targetY - curr.y) * 0.45;
        }
      }
    }

    // =========================================================================
    // 7. AI_CONTROLLER: Difficulty-Scaled Fighting Game CPU Opponent
    // =========================================================================
    const AI_CONTROLLER = {
      difficulty: 'NORMAL', // EASY | NORMAL | HARD
      thinkTimer: 0,
      intent: 'APPROACH',

      PARAMS: {
        EASY:   { reactionFrames: 20, blockChance: 0.24, comboChance: 0.30, skillChance: 0.22, ultChance: 0.45, dashChance: 0.12 },
        NORMAL: { reactionFrames: 11, blockChance: 0.56, comboChance: 0.68, skillChance: 0.50, ultChance: 0.78, dashChance: 0.30 },
        HARD:   { reactionFrames: 5,  blockChance: 0.84, comboChance: 0.92, skillChance: 0.76, ultChance: 0.96, dashChance: 0.48 }
      },

      setDifficulty(diff) {
        this.difficulty = diff;
      },

      cycleDifficulty() {
        const order = ['EASY', 'NORMAL', 'HARD'];
        const next = order[(order.indexOf(this.difficulty) + 1) % order.length];
        this.difficulty = next;
        return next;
      },

      getDifficultyLabel() {
        if (this.difficulty === 'EASY') return '쉬움';
        if (this.difficulty === 'HARD') return '어려움';
        return '보통';
      },

      update(ai, player, projectiles) {
        const p = this.PARAMS[this.difficulty];
        const dist = Math.abs(player.x - ai.x);
        const dirToPlayer = player.x >= ai.x ? 1 : -1;

        this.thinkTimer--;
        if (this.thinkTimer <= 0) {
          this.thinkTimer = p.reactionFrames + Math.floor(Math.random() * 6);
          this.chooseIntent(ai, player, projectiles, dist, p);
        }

        // 1. Reactive Block vs Incoming Attack or Projectile
        const incomingProj = projectiles.find(
          (pr) => pr.active && pr.owner === player && Math.abs(pr.x - ai.x) < 175
        );
        const playerAttackingClose = player.state === 'ATTACK' && dist < 165;

        if ((incomingProj || playerAttackingClose) && ai.canMoveOrAct()) {
          if (Math.random() < p.blockChance) {
            if (incomingProj && ai.isGrounded() && Math.random() < 0.38) {
              ai.vy = CONFIG.JUMP_VELOCITY;
              ai.y -= 2;
              ai.state = 'JUMP';
              VFX.spawnDust(ai.x, CONFIG.GROUND_Y, 0);
              return;
            }
            ai.vx = -dirToPlayer * ai.backWalkSpeed * 0.7;
            ai.state = 'WALK';
            return;
          }
        }

        // 2. Combo Follow-up Cancels while Attacking
        if (ai.state === 'ATTACK' && ai.attackType) {
          const spec = ai.attacks[ai.attackType];
          const frames = ai.getEffectiveFrames(spec);
          if (spec.canCancelInto &&
              ai.stateTimer >= frames.startup + 1 &&
              ai.stateTimer <= frames.startup + frames.active + 5) {
            if (ai.attackHasHit && Math.random() < p.comboChance) {
              if (ai.ult >= CONFIG.MAX_ULT && spec.canCancelInto.includes('ULTIMATE') && Math.random() < 0.5) {
                ai.startAttack('ULTIMATE', projectiles);
                return;
              }
              if (ai.cooldowns.SKILL2 <= 0 && spec.canCancelInto.includes('SKILL2') && dist < 150 && Math.random() < 0.45) {
                ai.startAttack('SKILL2', projectiles);
                return;
              }
              if (ai.isPirateGunActive() && spec.canCancelInto.includes('PIRATE_GUN_SHOT')) {
                ai.startAttack('PIRATE_GUN_SHOT', projectiles);
                return;
              }
              if (spec.nextNormal && spec.canCancelInto.includes(spec.nextNormal)) {
                ai.startAttack(spec.nextNormal, projectiles);
                return;
              }
            }
          }
          return;
        }

        if (!ai.canMoveOrAct()) return;

        // 3. Ultimate Trigger
        if (ai.ult >= CONFIG.MAX_ULT && Math.random() < p.ultChance) {
          const ultStyle = ai.attacks.ULTIMATE.ultStyle;
          if (ultStyle === 'TKD_PROMOTE') {
            ai.startAttack('ULTIMATE', projectiles);
            return;
          }
          if (ultStyle === 'WEREWOLF_ULT') {
            if (!ai.isWerewolf && (dist < 220 || ai.hp < ai.maxHp * 0.55)) {
              ai.startAttack('ULTIMATE', projectiles);
              return;
            }
          } else if (ultStyle === 'POSEIDON_JUDGMENT' && ai.poseidonJudgmentTimer <= 0 && dist < 440) {
            ai.startAttack('ULTIMATE', projectiles);
            return;
          } else if (ultStyle === 'AI_EVOLVE' || ultStyle === 'SAMURAI_AWAKEN' || ultStyle === 'TAOIST_RAIN' || ultStyle === 'KNIGHT_BANNER' || ultStyle === 'PIRATE_SHIP_BOMBARD') {
            ai.startAttack('ULTIMATE', projectiles);
            return;
          } else if (ultStyle === 'REAPER_EXECUTE') {
            if (dist < 175 && (player.hp <= player.maxHp * 0.16 || player.hp <= 220)) {
              ai.startAttack('ULTIMATE', projectiles);
              return;
            }
          } else if (ultStyle === 'VIKING_RAGNAROK' || ultStyle === 'NINJA_CLONES' || ultStyle === 'SONG_METEOR_DUNK') {
            if (dist < 520) {
              ai.startAttack('ULTIMATE', projectiles);
              return;
            }
          } else if (dist < 680 && Math.abs(player.y - ai.y) < 110) {
            ai.startAttack('ULTIMATE', projectiles);
            return;
          }
        }

        // 4. Job-Aware Offensive & Defensive Actions
        const isTaekwondo = ai.jobId === 'TAEKWONDO';
        const isSongMaster = ai.jobId === 'SONG_MASTER';
        const isWerewolf = ai.jobId === 'WEREWOLF';
        const isReaper = ai.jobId === 'REAPER';
        const isPirate = ai.jobId === 'PIRATE';
        const isKnight = ai.jobId === 'KNIGHT';
        const isTaoist = ai.jobId === 'TAOIST';
        const isSamurai = ai.jobId === 'SAMURAI';
        const isViking = ai.jobId === 'VIKING';
        const isNinja = ai.jobId === 'NINJA';
        const isDragonKnight = ai.jobId === 'DRAGON_KNIGHT';
        let meleeRange = 104;
        if (isDragonKnight) meleeRange = ai.dragonFormTimer > 0 ? 155 : 138;
        else if (isSamurai) meleeRange = 132;
        else if (isViking) meleeRange = 125;
        else if (isTaoist) meleeRange = 115;
        else if (isKnight) meleeRange = 110;
        else if (isPirate) meleeRange = 114;
        else if (isReaper) meleeRange = 128;
        else if (isWerewolf && ai.isWerewolf) meleeRange = 122;
        else if (isTaekwondo) meleeRange = ai.tkdRangeTimer > 0 ? 120 : 108;

        if (isDragonKnight) {
          if (ai.dragonFormTimer>0) {
            if (ai.cooldowns.SKILL1<=0 && dist>90 && dist<430 && Math.random()<p.skillChance*.58) { ai.startAttack('SKILL1',projectiles);return; }
            if (ai.cooldowns.SKILL2<=0 && dist>150 && dist<560 && Math.random()<p.skillChance*.48) { ai.startAttack('SKILL2',projectiles);return; }
          } else {
            if (ai.cooldowns.SKILL1<=0 && dist>175 && dist<540 && Math.random()<p.skillChance*.58) { ai.startAttack('SKILL1',projectiles);return; }
            if (ai.cooldowns.SKILL2<=0 && dist<245 && Math.random()<p.skillChance*.52) { ai.startAttack('SKILL2',projectiles);return; }
          }
        }
        if (ai.jobId === 'POSEIDON') {
          if (ai.cooldowns.SKILL1 <= 0 && (incomingProj || dist < 155) && Math.random() < p.skillChance * 0.75) {
            ai.startAttack('SKILL1',projectiles);return;
          }
          if (ai.cooldowns.SKILL2 <= 0 && dist >= 140 && dist < 540 && Math.random() < p.skillChance * 0.65) {
            ai.startAttack('SKILL2',projectiles);return;
          }
        }
        // Taekwondo Specific AI
        if (isTaekwondo) {
          if (ai.cooldowns.SKILL1 <= 0 && dist > 160 && Math.random() < p.skillChance * 0.45) {
            ai.startAttack('SKILL1', projectiles);
            return;
          }
          if (ai.cooldowns.SKILL2 <= 0 && ai.tkdDefTimer <= 0 && dist < 240 && Math.random() < p.skillChance * 0.65) {
            ai.startAttack('SKILL2', projectiles);
            return;
          }
          // Blue belt+ jump side kick
          if (ai.beltRank >= 2 && !ai.isGrounded() && dist < 150 && Math.random() < 0.4) {
            ai.startAttack('TKD_JUMP_SIDE_KICK', projectiles);
            return;
          }
          // Forward dash double-kick
          if (ai.isGrounded() && dist >= 135 && dist <= 260 && Math.random() < p.skillChance * 0.42) {
            ai.startAttack('TKD_DASH_DOUBLE_KICK', projectiles);
            return;
          }
          // Yellow belt+ back spin kick when opponent rushes in
          if (ai.beltRank >= 1 && ai.isGrounded() && dist < 120 && player.state === 'ATTACK' && Math.random() < p.skillChance * 0.45) {
            ai.startAttack('TKD_BACK_SPIN_KICK', projectiles);
            return;
          }
        }

        // Song Master AI
        if (isSongMaster) {
          if (ai.cooldowns.SKILL2 <= 0 && ai.songDodgeTimer <= 0 && dist < 260 && Math.random() < p.skillChance * 0.5) {
            ai.startAttack('SKILL2', projectiles);
            return;
          }
          if (ai.cooldowns.SKILL1 <= 0 && dist > 140 && dist < 520 && Math.random() < p.skillChance * 0.6) {
            ai.startAttack('SKILL1', projectiles);
            return;
          }
          if (dist > 150 && ai.normalChainCooldown <= 0 && Math.random() < 0.25) {
            ai.startAttack('BASKET_THROW', projectiles);
            return;
          }
        }

        // Werewolf AI
        if (isWerewolf) {
          if (ai.isWerewolf) {
            if (ai.cooldowns.SKILL2 <= 0 && dist < 125 && Math.random() < p.skillChance * 0.72) {
              ai.startAttack('SKILL2', projectiles);
              return;
            }
            if (ai.cooldowns.SKILL1 <= 0 && dist >= 120 && dist < 340 && Math.random() < p.skillChance * 0.68) {
              ai.startAttack('SKILL1', projectiles);
              return;
            }
          } else {
            // Human Werewolf: Parry incoming attacks with Skill 2, or short-dash in with Skill 1
            if (ai.cooldowns.SKILL2 <= 0 && (playerAttackingClose || incomingProj) && Math.random() < p.blockChance * 0.65) {
              ai.startAttack('SKILL2', projectiles);
              return;
            }
            if (ai.cooldowns.SKILL1 <= 0 && dist >= 130 && dist < 240 && Math.random() < p.skillChance * 0.5) {
              ai.startAttack('SKILL1', projectiles);
              return;
            }
          }
        }

        // Reaper AI: Boomerang Scythe, Summon Ghosts, 3-hit Scythe Lifesteal
        if (isReaper) {
          if (ai.cooldowns.SKILL2 <= 0 && ai.soulCount >= 1 && (ai.soulCount >= 2 || dist > 220) && Math.random() < p.skillChance * 0.65) {
            ai.startAttack('SKILL2', projectiles);
            return;
          }
          if (ai.cooldowns.SKILL1 <= 0 && !ai.hasActiveBoomerang() && dist > 140 && dist < 560 && Math.random() < p.skillChance * 0.65) {
            ai.startAttack('SKILL1', projectiles);
            return;
          }
        }

        // Pirate AI: Flag Buff, Gun Mode Switch & Rapid Shooting, 4-hit Cutlass Uppercut
        if (isPirate) {
          if (ai.cooldowns.SKILL2 <= 0 && ai.pirateBuffTimer <= 0 && dist > 170 && Math.random() < p.skillChance * 0.55) {
            ai.startAttack('SKILL2', projectiles);
            return;
          }
          if (ai.isPirateGunActive() && dist > 110 && ai.normalChainCooldown <= 0 && Math.random() < 0.35) {
            ai.startAttack('PIRATE_GUN_SHOT', projectiles);
            return;
          }
          if (ai.cooldowns.SKILL1 <= 0 && !ai.isPirateGunActive() && dist > 210 && Math.random() < p.skillChance * 0.55) {
            ai.startAttack('SKILL1', projectiles);
            return;
          }
        }

        // Knight AI: Shield Guard, Giant Sword Buff Slam, Sword & Shield Combo
        if (isKnight) {
          if (ai.cooldowns.SKILL1 <= 0 && ai.knightShieldTimer <= 0 && (playerAttackingClose || incomingProj || dist < 170) && Math.random() < p.skillChance * 0.58) {
            ai.startAttack('SKILL1', projectiles);
            return;
          }
          if (ai.cooldowns.SKILL2 <= 0 && dist < 175 && Math.random() < p.skillChance * 0.6) {
            ai.startAttack('SKILL2', projectiles);
            return;
          }
        }

        if (dist < meleeRange) {
          if (isViking && ai.cooldowns.SKILL1 <= 0 && ai.shieldHp <= 0 && Math.random() < p.skillChance * 0.45) {
            ai.startAttack('SKILL1', projectiles);
            return;
          }
          if (isTaoist && ai.cooldowns.SKILL1 <= 0 && Math.random() < p.skillChance * 0.45) {
            ai.startAttack('SKILL1', projectiles);
            return;
          }
          if (ai.cooldowns.SKILL2 <= 0 && !isKnight && !isPirate && !isReaper && !isWerewolf && !isSongMaster && !isTaekwondo && Math.random() < p.skillChance * 0.45) {
            ai.startAttack('SKILL2', projectiles);
            return;
          }
          if (isSamurai && ai.cooldowns.SKILL1 <= 0 && Math.random() < p.skillChance * 0.4) {
            ai.startAttack('SKILL1', projectiles);
            return;
          }
          if (ai.normalChainCooldown <= 0 && Math.random() < 0.28) {
            ai.startAttack(ai.isPirateGunActive() ? 'PIRATE_GUN_SHOT' : ai.firstNormal, projectiles);
            return;
          }
        }

        // Mid/Long-Range Special Skills
        if (dist >= 165 && dist < 440) {
          if (isSamurai && ai.cooldowns.SKILL2 <= 0 && Math.random() < p.skillChance * 0.42) {
            ai.startAttack('SKILL2', projectiles);
            return;
          }
          if (isNinja && ai.cooldowns.SKILL2 <= 0 && Math.random() < p.skillChance * 0.45) {
            ai.startAttack('SKILL2', projectiles);
            return;
          }
          if (isTaoist && ai.cooldowns.SKILL1 <= 0 && Math.random() < p.skillChance * 0.5) {
            ai.startAttack('SKILL1', projectiles);
            return;
          }
          if (isTaoist && ai.cooldowns.SKILL2 <= 0 && Math.random() < p.skillChance * 0.45) {
            ai.startAttack('SKILL2', projectiles);
            return;
          }
        }

        if (dist > 220 && ai.cooldowns.SKILL1 <= 0 && Math.random() < p.skillChance * 0.14) {
          if (ai.jobId === 'STICKMAN') {
            const hasProj = projectiles.some((pr) => pr.owner === ai && pr.active);
            if (!hasProj) {
              ai.startAttack('SKILL1', projectiles);
              return;
            }
          } else if (isNinja || isViking) {
            ai.startAttack('SKILL1', projectiles);
            return;
          }
        }

        // Ninja long-range shuriken poke
        if (isNinja && dist > 180 && dist < 540 && ai.normalChainCooldown <= 0 && Math.random() < 0.14) {
          ai.startAttack('SHURIKEN_THROW1', projectiles);
          return;
        }

        // 5. Movement Execution
        if (this.intent === 'APPROACH') {
          if (dist > 270 && ai.isGrounded() && Math.random() < p.dashChance * 0.08) {
            ai.startDash(dirToPlayer);
            return;
          }
          if (dist > meleeRange - 12) {
            ai.vx = dirToPlayer * ai.walkSpeed * ai.getSpeedMultiplier();
            if (ai.isGrounded()) ai.state = 'WALK';
          } else {
            ai.vx = 0;
            if (ai.isGrounded()) ai.state = 'IDLE';
          }
        } else if (this.intent === 'RETREAT') {
          if (dist < 190 && ai.isGrounded() && Math.random() < p.dashChance * 0.06) {
            ai.startDash(-dirToPlayer);
            return;
          }
          ai.vx = -dirToPlayer * ai.backWalkSpeed * ai.getSpeedMultiplier();
          if (ai.isGrounded()) ai.state = 'WALK';
        } else {
          ai.vx *= 0.7;
          if (ai.isGrounded()) ai.state = 'IDLE';
        }
      },

      chooseIntent(ai, player, projectiles, dist, p) {
        if (ai.hp < 240 && dist < 180 && Math.random() < 0.45) {
          this.intent = 'RETREAT';
        } else if (dist > 130) {
          this.intent = 'APPROACH';
        } else {
          const r = Math.random();
          if (r < 0.55) this.intent = 'APPROACH';
          else if (r < 0.8) this.intent = 'HOLD';
          else this.intent = 'RETREAT';
        }
      }
    };

    // =========================================================================
    // 8. COMBAT_ENGINE: Hitboxes, Pushboxes, Shield/Guard/Dodge & Damage Resolution
    // =========================================================================
    const COMBAT_ENGINE = {
      rectsOverlap(a, b) {
        if (!a || !b) return false;
        return (
          a.x < b.x + b.width &&
          a.x + a.width > b.x &&
          a.y < b.y + b.height &&
          a.y + a.height > b.y
        );
      },

      resolvePushboxes(p1, p2) {
        if (p1.state === 'KO' || p2.state === 'KO') return;
        const b1 = p1.getHurtbox();
        const b2 = p2.getHurtbox();

        if (!this.rectsOverlap(b1, b2)) return;

        const overlapX = Math.min(b1.x + b1.width, b2.x + b2.width) - Math.max(b1.x, b2.x);
        if (overlapX > 0) {
          const push = overlapX * 0.5;
          if (p1.x <= p2.x) {
            p1.x -= push;
            p2.x += push;
          } else {
            p1.x += push;
            p2.x -= push;
          }
          p1.x = Math.max(CONFIG.STAGE_LEFT, Math.min(CONFIG.STAGE_RIGHT, p1.x));
          p2.x = Math.max(CONFIG.STAGE_LEFT, Math.min(CONFIG.STAGE_RIGHT, p2.x));
        }
      },

      canDefenderGuard(defender, isGuardBreak = false) {
        if (isGuardBreak) return false;
        if (!defender.isGrounded()) return false;
        if (!['IDLE', 'WALK', 'CROUCH'].includes(defender.state)) return false;
        return defender.isHoldingGuardInput();
      },

      damageBanner(owner, rawDamage) {
        if (!owner || !owner.hasActiveBanner()) return;
        if (owner.banner.hitCooldown > 0) return;
        const dmg = Math.max(1, Math.round(rawDamage));
        owner.banner.hp = Math.max(0, owner.banner.hp - dmg);
        owner.banner.hitCooldown = 6;
        VFX.spawnHitSparks(owner.banner.x, owner.banner.y - 78, '#fbbf24', 10, 0.8);
        VFX.spawnFloatingText(owner.banner.x, owner.banner.y - 148, `깃발 -${dmg}`, '#fbbf24');
        AUDIO.sfxGuard();
      },

      damageGhostsInArea(attacker, box, rawDamage, hitSet = null) {
        if (!GAME.reaperGhosts || !box) return;
        for (const g of GAME.reaperGhosts) {
          if (!g.active || g.owner === attacker) continue;
          if (hitSet && hitSet.has(g.uid)) continue;
          const gBox = { x: g.x - 24, y: g.y - 44, width: 48, height: 56 };
          if (this.rectsOverlap(box, gBox)) {
            if (hitSet) hitSet.add(g.uid);
            const dmg = Math.max(1, Math.round(rawDamage));
            g.hp = Math.max(0, g.hp - dmg);
            g.hitFlash = 7;
            VFX.spawnHitSparks(g.x, g.y - 14, '#c084fc', 10, 0.75);
            if (g.hp <= 0) {
              g.active = false;
              VFX.spawnSmokePoof(g.x, g.y - 14, 5, 'rgba(192, 132, 252, 0.55)');
              VFX.spawnFloatingText(g.x, g.y - 44, '유령 소멸!', '#c084fc');
              AUDIO.sfxClonePoof();
            } else {
              VFX.spawnFloatingText(g.x, g.y - 44, `-${dmg}`, '#e9d5ff');
              AUDIO.sfxHitLight();
            }
          }
        }
      },

      resolveCombat(p1, p2, projectiles, boomerangScythes = []) {
        this.checkMeleeHit(p1, p2);
        this.checkMeleeHit(p2, p1);
        this.checkBoomerangs(p1, p2, boomerangScythes);
        this.checkProjectiles(p1, p2, projectiles);
      },

      checkBoomerangs(p1, p2, boomerangScythes) {
        for (const sc of boomerangScythes) {
          if (!sc.active) continue;
          const defender = sc.owner === p1 ? p2 : p1;
          const scBox = sc.getHitbox();
          const isOut = sc.phase === 'OUT';
          const alreadyHit = isOut ? sc.hitOut : sc.hitReturn;

          if (!alreadyHit && defender.state !== 'KO' && defender.invulnTimer <= 0) {
            if (this.rectsOverlap(scBox, defender.getHurtbox())) {
              if (isOut) sc.hitOut = true;
              else sc.hitReturn = true;

              const rawDmg = isOut ? sc.spec.scytheDamageOut : sc.spec.scytheDamageReturn;
              const dmg = Math.round(rawDmg * sc.owner.getDamageMultiplier());
              const dir = sc.vx >= 0 ? 1 : -1;

              const res = this.applyHit(sc.owner, defender, {
                damage: dmg,
                isSkill: true,
                rageGain: 15,
                ultGainAttacker: 6,
                ultGainDefender: 4,
                hitstun: sc.spec.hitstun,
                blockstun: sc.spec.blockstun,
                knockbackX: sc.spec.knockbackX,
                knockbackY: sc.spec.knockbackY,
                hitstop: sc.spec.hitstop,
                shake: sc.spec.shake,
                direction: dir,
                sourceX: sc.x,
                isHeavy: true
              });

              if (res && res.connected && !res.guarded && sc.spec.healOnHit && sc.owner.state !== 'KO') {
                const prevHp = sc.owner.hp;
                sc.owner.hp = Math.min(sc.owner.maxHp, sc.owner.hp + sc.spec.healOnHit);
                const healed = Math.round(sc.owner.hp - prevHp);
                if (healed > 0) {
                  VFX.spawnFloatingText(sc.owner.x, sc.owner.y - 165, `+${healed} HP (흡혈)`, '#4ade80');
                  VFX.spawnHitSparks(sc.owner.x, sc.owner.y - 84, '#4ade80', 10, 0.75);
                }
              }
            }
          }

          const bannerAlreadyHit = isOut ? sc.hitBannerOut : sc.hitBannerReturn;
          if (!bannerAlreadyHit && defender.getBannerHurtbox() && this.rectsOverlap(scBox, defender.getBannerHurtbox())) {
            if (isOut) sc.hitBannerOut = true;
            else sc.hitBannerReturn = true;
            const rawDmg = isOut ? sc.spec.scytheDamageOut : sc.spec.scytheDamageReturn;
            this.damageBanner(defender, Math.round(rawDmg * sc.owner.getDamageMultiplier()));
          }

          const ghostSet = isOut ? sc.hitGhostsOut : sc.hitGhostsReturn;
          const rawGhostDmg = isOut ? sc.spec.scytheDamageOut : sc.spec.scytheDamageReturn;
          this.damageGhostsInArea(sc.owner, scBox, Math.round(rawGhostDmg * sc.owner.getDamageMultiplier()), ghostSet);
        }
      },

      checkMeleeHit(attacker, defender) {
        const hitbox = attacker.getActiveHitbox();
        if (!hitbox) return;

        const spec = attacker.attacks[attacker.attackType];
        const dmgMult = attacker.getDamageMultiplier();

        let baseDamage = spec.damage;
        let kbX = spec.knockbackX;
        let kbY = spec.knockbackY || 0;
        let isFinalBeat = false;

        if (spec.skillStyle === 'TKD_DASH_DOUBLE') {
          isFinalBeat = attacker.activeBeatIndex === (spec.kickBeats.length - 1);
          baseDamage = isFinalBeat ? spec.finalDamage : spec.damage;
          kbX = isFinalBeat ? spec.finalKnockbackX : spec.knockbackX;
          kbY = isFinalBeat ? (spec.finalKnockbackY || -16.8) : (spec.knockbackY || 0);
        } else if (spec.skillStyle === 'SAMURAI_DANCE') {
          isFinalBeat = attacker.activeBeatIndex === (spec.slashBeats.length - 1);
          baseDamage = isFinalBeat ? spec.finalDamage : spec.damage;
          kbX = isFinalBeat ? spec.finalKnockbackX : spec.knockbackX;
          kbY = isFinalBeat ? (spec.finalKnockbackY || 0) : 0;
        } else if (spec.skillStyle === 'NINJA_LONG_DASH') {
          isFinalBeat = attacker.activeBeatIndex === (spec.hitBeats.length - 1);
          baseDamage = isFinalBeat ? spec.finalDamage : spec.damage;
          kbX = isFinalBeat ? spec.finalKnockbackX : spec.knockbackX;
          kbY = isFinalBeat ? (spec.finalKnockbackY || 0) : 0;
        } else if (spec.ultStyle === 'VIKING_RAGNAROK') {
          baseDamage = spec.slamDamage;
          isFinalBeat = true;
        }

        const totalDamage = Math.round(baseDamage * dmgMult);

        if (!attacker.bannerHasHit && defender.getBannerHurtbox() && this.rectsOverlap(hitbox, defender.getBannerHurtbox())) {
          attacker.bannerHasHit = true;
          this.damageBanner(defender, totalDamage);
        }

        if (!attacker.ghostHitMap) attacker.ghostHitMap = new Map();
        const atkKey = `${attacker.id}_${attacker.attackInstanceId || 0}`;
        if (!attacker.ghostHitMap.has(atkKey)) {
          if (attacker.ghostHitMap.size > 6) attacker.ghostHitMap.clear();
          attacker.ghostHitMap.set(atkKey, new Set());
        }
        this.damageGhostsInArea(attacker, hitbox, totalDamage, attacker.ghostHitMap.get(atkKey));

        if (attacker.attackHasHit) return;
        if (defender.state === 'KO' || defender.invulnTimer > 0) return;

        if (!this.rectsOverlap(hitbox, defender.getHurtbox())) return;

        attacker.attackHasHit = true;

        // Reaper Execution Ultimate check: instant kill if target HP < 16%
        let executeInstantKill = false;
        if (spec.ultStyle === 'REAPER_EXECUTE' && defender.hp < defender.maxHp * (spec.executeThreshold || 0.16)) {
          executeInstantKill = true;
        }

        const hitInfo = {
          damage: executeInstantKill ? defender.hp + 999 : totalDamage,
          isSkill: !attacker.isNormalAttackType(attacker.attackType),
          rageGain: attacker.isNormalAttackType(attacker.attackType) ? 10 : 18,
          isExecute: executeInstantKill,
          rootDuration: spec.rootDuration || 0,
          ultGainAttacker: spec.ultGainAttacker || 0,
          ultGainDefender: spec.ultGainDefender || 0,
          hitstun: spec.hitstun,
          blockstun: spec.blockstun,
          knockbackX: kbX,
          knockbackY: kbY,
          knockdown: Boolean(spec.knockdown && (spec.skillStyle !== 'SAMURAI_DANCE' || isFinalBeat) && (spec.skillStyle !== 'TKD_DASH_DOUBLE' || isFinalBeat)),
          guardBreak: Boolean(spec.guardBreak || executeInstantKill),
          hitstop: executeInstantKill ? 18 : spec.hitstop,
          shake: executeInstantKill ? 24 : spec.shake,
          direction: attacker.facing,
          sourceX: attacker.x,
          isHeavy: executeInstantKill || isFinalBeat || ['KICK', 'SWORD_WAVE_SLASH', 'AXE_SLAM', 'SHURIKEN_DASH_SLASH', 'FAN_WIND_GUST', 'KNIGHT_SHIELD_BASH', 'PIRATE_UPPER_SLASH', 'REAPER_SLASH3', 'WOLF_HUMAN_UPPER', 'WOLF_CLAW3', 'SKILL2', 'ULTIMATE', 'TKD_BACK_SPIN_KICK', 'TKD_JUMP_SIDE_KICK'].includes(attacker.attackType)
        };

        const res = this.applyHit(attacker, defender, hitInfo);
        if (res && res.connected && !res.guarded && attacker.jobId === 'POSEIDON' &&
            attacker.attackType === 'SKILL1') {
          this.applyPoseidonSlow(defender, spec.slowDuration);
        }

        // Lifesteal on hit (Reaper 3rd normal attack & Werewolf Skill 2 Predator Bite)
        if (res && res.connected && !res.guarded && spec.healOnHit && attacker.state !== 'KO') {
          const prevHp = attacker.hp;
          attacker.hp = Math.min(attacker.maxHp, attacker.hp + spec.healOnHit);
          const healed = Math.round(attacker.hp - prevHp);
          if (healed > 0) {
            const healTag = attacker.jobId === 'WEREWOLF' ? `+${healed} HP (포식)` : `+${healed} HP (흡혈)`;
            VFX.spawnFloatingText(attacker.x, attacker.y - 165, healTag, '#4ade80');
            VFX.spawnHitSparks(attacker.x, attacker.y - 84, '#4ade80', 12, 0.85);
          }
        }
      },

      applyPoseidonSlow(target, duration) {
        if (target.hp <= 0) return;
        target.poseidonSlowStacks = Math.min(2, target.poseidonSlowStacks + 1);
        target.poseidonSlowTimer = Math.max(target.poseidonSlowTimer, duration || 210);
        VFX.spawnFloatingText(target.x,target.y-165,
          `둔화 ${target.poseidonSlowStacks}/2`, '#67e8f9');
      },

      checkProjectiles(p1, p2, projectiles) {
        for (let i = 0; i < projectiles.length; i++) {
          const a = projectiles[i];
          if (!a.active) continue;
          for (let j = i + 1; j < projectiles.length; j++) {
            const b = projectiles[j];
            if (!b.active || a.owner === b.owner) continue;
            if (this.rectsOverlap(a.getHitbox(), b.getHitbox())) {
              const midX = (a.x + b.x) / 2;
              const midY = (a.y + b.y) / 2;
              const aMonkPalm = a.visualType === 'MONK_PALM' && a.owner && a.owner.jobId === 'MONK';
              const bMonkPalm = b.visualType === 'MONK_PALM' && b.owner && b.owner.jobId === 'MONK';
              // Monk's Golden Palm is a durable projectile: each enemy projectile hit
              // chips one point of durability. Three Ninja kunai/shuriken hits destroy it.
              if (aMonkPalm || bMonkPalm) {
                const damagePalm = (palm, incoming) => {
                  if (!palm || !palm.active) return;
                  palm.projectileHp = Math.max(0, (palm.projectileHp || 3) - 1);
                  incoming.active = false;
                  VFX.spawnHitSparks(palm.x, palm.y, '#fef3c7', 10, .85);
                  if (palm.projectileHp <= 0) {
                    palm.active = false;
                    VFX.spawnHitSparks(palm.x, palm.y, '#fbbf24', 24, 1.2);
                    VFX.shockwaves.push({x:palm.x,y:palm.y,radius:10,maxRadius:62,life:12,maxLife:12,color:'#fbbf24'});
                    VFX.spawnFloatingText(palm.x,palm.y-34,'금강장 파괴!','#fde68a');
                  } else {
                    VFX.spawnFloatingText(palm.x,palm.y-34,`금강장 내구도 ${palm.projectileHp}/3`,'#fde68a');
                  }
                  AUDIO.sfxGuard();
                };
                if (aMonkPalm && bMonkPalm) {
                  damagePalm(a, b); damagePalm(b, a);
                } else if (aMonkPalm) {
                  damagePalm(a, b);
                } else {
                  damagePalm(b, a);
                }
                continue;
              }
              if (!a.piercing) a.active = false;
              if (!b.piercing) b.active = false;
              VFX.spawnHitSparks(midX, midY, '#f8fafc', 16, 1.0);
              VFX.spawnFloatingText(midX, midY - 20, 'CLASH!', '#fde047');
              AUDIO.sfxGuard();
            }
          }
        }

        for (const proj of projectiles) {
          if (!proj.active) continue;
          const defender = proj.owner === p1 ? p2 : p1;
          const projBox = proj.getHitbox();
          // Poseidon's rotating trident destroys enemy projectiles, without touching other guards.
          if (defender.jobId === 'POSEIDON' && defender.state === 'ATTACK' &&
              defender.attackType === 'SKILL1' &&
              defender.stateTimer >= defender.attacks.SKILL1.startup &&
              defender.stateTimer < defender.attacks.SKILL1.startup + defender.attacks.SKILL1.active &&
              Math.abs(proj.x - defender.x) < 95 && Math.abs(proj.y - (defender.y-85)) < 95) {
            proj.active = false;
            VFX.spawnHitSparks(proj.x,proj.y,'#67e8f9',10,0.8);
            AUDIO.sfxGuard();
            continue;
          }

          if (defender.getBannerHurtbox() && this.rectsOverlap(projBox, defender.getBannerHurtbox())) {
            if (!proj.piercing) {
              proj.active = false;
            }
            this.damageBanner(defender, proj.damage);
            if (!proj.piercing) continue;
          }

          this.damageGhostsInArea(proj.owner, projBox, proj.damage);

          if (defender.state === 'KO' || defender.invulnTimer > 0) continue;

          if (this.rectsOverlap(projBox, defender.getHurtbox())) {
            if (proj.persistAfterHit && proj.hasHitTarget) continue;
            if (proj.persistAfterHit) { proj.hasHitTarget = true; }
            else if (proj.piercing) {
              if (proj.pierceHitTimer > 0) continue;
              proj.pierceHitTimer = 11;
            } else {
              proj.active = false;
            }
            const poseidonWave = proj.visualType === 'POSEIDON_WAVE';
            const result = this.applyHit(proj.owner, defender, {
              aiStun:proj.aiStun||0,
              ignoreDefense:Boolean(proj.ignoreDefense),
              damage: proj.damage,
              isSkill: proj.isSkill,
              rageGain: proj.isSkill ? 14 : 8,
              rootDuration: proj.rootDuration || 0,
              ultGainAttacker: proj.ultGainAttacker,
              ultGainDefender: proj.ultGainDefender,
              hitstun: proj.hitstun,
              blockstun: proj.blockstun,
              knockbackX: proj.knockbackX,
              knockbackY: proj.knockbackY,
              knockdown: proj.knockdown,
              guardBreak: proj.guardBreak,
              hitstop: proj.hitstop,
              shake: proj.shake,
              direction: proj.facing,
              sourceX: proj.x,
              isHeavy: proj.piercing
            });
            if (proj.gojoRedPull && result && result.connected && !result.guarded) {
              proj.owner.gojoRedTimer=28;proj.owner.gojoRedTarget=defender;proj.owner.gojoRedBurstDone=false;
              defender.vx=0;defender.vy=0;defender.state='HITSTUN';defender.stateTimer=2;
              VFX.spawnHitSparks(proj.x,proj.y,'#fca5a5',24,1.25);
              VFX.shockwaves.push({x:proj.x,y:proj.y,radius:10,maxRadius:90,life:16,maxLife:16,color:'#ef4444'});
              VFX.spawnFloatingText(defender.x,defender.y-175,'혁 적중! 끌어당김','#fca5a5');
            }
            if (proj.slowDuration && result && result.connected && !result.guarded) {
              defender.gambleSlowTimer=Math.max(defender.gambleSlowTimer,proj.slowDuration);
              VFX.spawnFloatingText(defender.x,defender.y-170,'이동 속도 감소!','#60a5fa');
            }
            if (poseidonWave && result && result.connected && !result.guarded) {
              this.applyPoseidonSlow(defender, proj.slowDuration);
            }
          }
        }
      },

      applyHit(attacker, defender, info) {
        const hitX = (attacker.x + defender.x) / 2;
        const hitY = defender.y - 84;

        // Poseidon judgment shield: any attack damages the bubble first, including projectiles.
        if (defender.jobId === 'POSEIDON' && defender.poseidonJudgmentTimer > 0 &&
            defender.poseidonJudgmentShield > 0) {
          const absorbed = Math.min(defender.poseidonJudgmentShield, Math.max(1, info.damage || 0));
          defender.poseidonJudgmentShield -= absorbed;
          VFX.spawnHitSparks(defender.x,defender.y-80,'#67e8f9',12,0.9);
          VFX.spawnFloatingText(defender.x,defender.y-165,`거품 보호막 -${absorbed}`, '#67e8f9');
          AUDIO.sfxShieldHit();
          if (defender.poseidonJudgmentShield <= 0) {
            defender.poseidonJudgmentTimer = 0;
            defender.poseidonKrakenStrikesLeft = 0;
            defender.poseidonKrakenWarning = 0;
            VFX.spawnFloatingText(defender.x,defender.y-184,'바다의 심판 저지!', '#fde047');
            VFX.shockwaves.push({x:defender.x,y:defender.y-75,radius:10,maxRadius:120,
              life:18,maxLife:18,color:'#67e8f9'});
          }
          return {connected:true,guarded:true};
        }
        // Beggar's plea: convert the incoming attack's damage into healing, without hitstun.
        if (defender.jobId==='BEGGAR' && defender.begPleadTimer>0 && !info.isExecute) {
          const healed=Math.min(defender.maxHp-defender.hp,Math.max(0,Math.round(info.damage||0)));
          defender.hp+=healed;
          VFX.spawnFloatingText(defender.x,defender.y-158,healed?`+${healed} HP 구걸 성공`:'구걸 방어!', '#4ade80');
          VFX.spawnHitSparks(defender.x,defender.y-85,'#4ade80',9,.7);
          AUDIO.sfxShieldHit();
          return {connected:true,guarded:true};
        }
        // 0. Song Master Evasion Buff (50% dodge chance while active)
        if (defender.songDodgeTimer > 0 && Math.random() < (defender.attacks.SKILL2.dodgeChance || 0.5)) {
          VFX.spawnAfterimage(defender, '#fb923c');
          VFX.spawnFloatingText(defender.x, defender.y - 155, 'MISS! (회피)', '#fb923c');
          AUDIO.sfxWhiff();
          return { connected: false, guarded: false };
        }

        // 1. Human Werewolf Skill 2 Timing Parry Check (Negates ALL incoming attacks & builds massive Rage!)
        if (defender.isParrying()) {
          VFX.triggerHitstop(8);
          VFX.triggerShake(10);
          VFX.spawnGuardSparks(defender.x + defender.facing * 26, defender.y - 88);

          defender.gainUlt(8);

        }

        // 2. Knight Directional Shield Guard Check (Nullifies damage from the guarded side!)
        if (defender.knightShieldTimer > 0 && info.sourceX !== undefined) {
          const attackFromRight = info.sourceX >= defender.x;
          const shieldFacesRight = defender.knightShieldDir === 1;
          if (attackFromRight === shieldFacesRight) {
            VFX.triggerHitstop(5);
            VFX.triggerShake(6);
            VFX.spawnGuardSparks(defender.x + defender.knightShieldDir * 36, defender.y - 86);
            VFX.spawnFloatingText(defender.x, defender.y - 158, '방패 완벽 방어!', '#38bdf8');
            AUDIO.sfxGuard();
            defender.gainUlt(5);
            return { connected: false, guarded: true };
          }
        }

        if(attacker.jobId==='AI_ROBOT' && attacker.aiOverloadTimer>0)info={...info,damage:Math.round((info.damage||0)*1.55)};
        else if(attacker.jobId==='AI_ROBOT' && attacker.aiEvolveTimer>0 && attacker.attackType && (attacker.attackType.startsWith('AI_BLADE')||attacker.attackType.startsWith('AI_RING')))info={...info,damage:Math.round((info.damage||0)*1.25)};
        // 3. Apply Knight Guardian Banner Damage Reduction (35% reduction while banner stands)
        let incomingDamage = info.damage;
        if (!info.isExecute && defender.jobId === 'GOJO' && defender.gojoDomainTimer > 0 && !info.ignoreDefense) {
          incomingDamage = Math.max(1, Math.round(incomingDamage * (defender.attacks.ULTIMATE.domainDefense || 0.30)));
        }
        if (!info.ignoreDefense && !info.isExecute &&
            ((defender.jobId === 'MONK' && defender.monkGoldTimer > 0) ||
             (defender.jobId === 'GAMBLER' && defender.gambleMonkGoldTimer > 0))) {
          incomingDamage = Math.max(1, Math.round(incomingDamage * 0.40));
        }
        if (!info.ignoreDefense && !info.isExecute && defender.hasActiveBanner()) {
          incomingDamage = Math.max(1, Math.round(incomingDamage * (1 - (defender.attacks.ULTIMATE.damageReduction || 0.35))));
        }

        // 3b. Apply Taekwondo Defense-Up Buff (White/Yellow Skill 2 or Blue/Red Skill 2)
        if (!info.ignoreDefense && !info.isExecute && defender.jobId === 'TAEKWONDO' && (defender.tkdDefTimer > 0 || defender.tkdAtkDefTimer > 0)) {
          incomingDamage = Math.max(1, Math.round(incomingDamage * (defender.attacks.SKILL2.defMult || 0.65)));
        }

        const guarded = this.canDefenderGuard(defender, info.guardBreak);

        // Human Werewolf builds Rage when hit or blocking attacks
        if (defender.jobId === 'WEREWOLF' && !defender.isWerewolf) {
          const baseRage = info.rageGain || (info.isSkill ? 16 : 10);
          defender.gainRage(guarded ? Math.ceil(baseRage * 0.6) : baseRage);

        if (guarded) {
          let chipDamage = Math.max(1, Math.round(incomingDamage * CONFIG.GUARD_CHIP_RATIO));

          // Viking Rune Shield absorbs chip damage too
          if (defender.shieldHp > 0 && defender.shieldTimer > 0) {
            const absorbed = Math.min(defender.shieldHp, chipDamage);
            defender.shieldHp -= absorbed;
            chipDamage -= absorbed;
            VFX.spawnFloatingText(defender.x, defender.y - 150, `보호막 -${absorbed}`, '#22d3ee');

          }

            defender.state = 'HITSTUN';
            defender.stateTimer = 0;
            defender.isBlocking = true;
            defender.hitstunTimer = info.blockstun;

          attacker.gainUlt(Math.ceil(info.ultGainAttacker * 0.5));

          VFX.triggerShake(Math.max(3, Math.floor(info.shake * 0.5)));
          VFX.spawnGuardSparks(hitX, hitY);

        // Clean Hit!

          const absorbed = Math.min(defender.shieldHp, remainingDamage);
          defender.shieldHp -= absorbed;
          remainingDamage -= absorbed;

          VFX.spawnHitSparks(defender.x, defender.y - 84, '#22d3ee', 14, 0.9);
          VFX.spawnFloatingText(defender.x, defender.y - 152, `보호막 흡수 -${absorbed}`, '#22d3ee');

          if (defender.shieldHp <= 0) {

            });

        defender.hp = Math.max(0, defender.hp - remainingDamage);
        if(attacker.jobId==='AI_ROBOT' && info.aiStun>0 && defender.hp>0){defender.aiStunTimer=Math.max(defender.aiStunTimer,info.aiStun);VFX.spawnFloatingText(defender.x,defender.y-180,'전기 충격! 0.5초 기절','#67e8f9');}
        defender.isBlocking = false;
        defender.attackType = null;
        // An armored fighter can ignore hitstun, but must not remain in ATTACK
        // after its attackType is cleared: that would crash updateAttackState.
        if (defender.state === 'ATTACK') {

          defender.stateTimer = 0;
        }
        defender.iaidoLineBox = null;
        defender.shadowClones = [];

        // Apply Root (Taoist Vines & Tornadoes, Werewolf Bite) unless Knight Guardian Banner grants immunity
        if (info.rootDuration && info.rootDuration > 0 && defender.hp > 0 && !defender.hasActiveBanner()) {
          defender.rootTimer = Math.max(defender.rootTimer, info.rootDuration);
          defender.vx = 0;
          const rootTag = attacker.jobId === 'WEREWOLF' ? '물기 속박!' : '속박!';
          VFX.spawnFloatingText(defender.x, defender.y - 158, rootTag, '#4ade80');
        }

        attacker.gainUlt(info.ultGainAttacker);
        defender.gainUlt(info.ultGainDefender);

        attacker.comboCount++;
        attacker.comboResetTimer = 55;

        if (defender.hp <= 0) {
          defender.state = 'KO';
          defender.stateTimer = 0;
          defender.vx = info.direction * Math.max(12, info.knockbackX);
          defender.vy = -12.5;
          defender.y -= 4;

          VFX.triggerHitstop(16);
          VFX.triggerShake(22);
          VFX.spawnHitSparks(hitX, hitY, '#f43f5e', 30, 1.5);
          if (info.isExecute) {
            VFX.triggerScreenFlash('#a855f7', 0.5);
            VFX.spawnFloatingText(defender.x, defender.y - 165, '즉살! (사신의 선고)', '#e879f9');
            AUDIO.sfxReaperExecute();
          } else {
            VFX.spawnFloatingText(defender.x, defender.y - 145, 'K.O.!', '#f43f5e');
          }
          AUDIO.sfxKO();
          return { connected: true, guarded: false };
        }

        // Knight Guardian Banner grants Hitstun/Knockdown Immunity while standing!
        if (defender.hasActiveBanner()) {
          VFX.triggerHitstop(info.hitstop);
          VFX.triggerShake(Math.max(4, Math.floor(info.shake * 0.7)));
          VFX.spawnHitSparks(hitX, hitY, attacker.accentColor, info.isHeavy ? 18 : 11, info.isHeavy ? 1.15 : 0.85);
          if (remainingDamage > 0) {
            VFX.spawnFloatingText(defender.x, defender.y - 138, `-${remainingDamage} (슈퍼아머)`, '#fde047');
          }
          if (info.isHeavy) AUDIO.sfxHitHeavy();
          else AUDIO.sfxHitLight();
          return { connected: true, guarded: false };

        // Viking Rune Shield grants Super Armor (no hitstun/knockdown) while active!
        if (defender.shieldHp > 0 && defender.shieldTimer > 0) {
          VFX.triggerHitstop(info.hitstop);
          VFX.triggerShake(Math.max(4, Math.floor(info.shake * 0.6)));
          VFX.spawnHitSparks(hitX, hitY, '#22d3ee', 12, 0.9);
          return { connected: true, guarded: false };
        }

        if (info.knockdown || !defender.isGrounded()) {
          defender.state = 'KNOCKDOWN';
          defender.stateTimer = 0;
          defender.vx = info.direction * info.knockbackX;
          defender.vy = info.knockbackY !== 0 ? info.knockbackY : -7.5;
          defender.y -= 2;
        } else {
          defender.state = 'HITSTUN';
          defender.stateTimer = 0;
          defender.hitstunTimer = info.hitstun;
          this.applyKnockbackWithCornerPush(attacker, defender, info.direction, info.knockbackX);
        }

        VFX.triggerHitstop(info.hitstop);
        VFX.triggerShake(info.shake);
        VFX.spawnHitSparks(hitX, hitY, attacker.accentColor, info.isHeavy ? 22 : 13, info.isHeavy ? 1.25 : 0.9);

        if (remainingDamage > 0) {

          VFX.spawnFloatingText(defender.x, defender.y - 138, callout, info.guardBreak ? '#f43f5e' : '#fbbf24');
        }

        if (info.isSkill && attacker.jobId !== 'STICKMAN') VFX.spawnSkillImpact(attacker, hitX, hitY, info);

        if (info.isHeavy) AUDIO.sfxHitHeavy();
        else AUDIO.sfxHitLight();
        return { connected: true, guarded: false };
      },

      applyKnockbackWithCornerPush(attacker, defender, direction, knockback) {
        const nextX = defender.x + direction * knockback;
        if (nextX < CONFIG.STAGE_LEFT) {
          const overflow = CONFIG.STAGE_LEFT - nextX;
          defender.x = CONFIG.STAGE_LEFT;
          defender.vx = 0;
          attacker.x = Math.min(CONFIG.STAGE_RIGHT, attacker.x + overflow * CONFIG.CORNER_PUSH_FACTOR);
        } else if (nextX > CONFIG.STAGE_RIGHT) {
          const overflow = nextX - CONFIG.STAGE_RIGHT;
          defender.x = CONFIG.STAGE_RIGHT;
          defender.vx = 0;
          attacker.x = Math.max(CONFIG.STAGE_LEFT, attacker.x - overflow * CONFIG.CORNER_PUSH_FACTOR);
        } else {
          defender.vx = direction * knockback;
        }
      }
    };

      drawKrakenForeground(ctx, game) {
        const kraken = [game.p1, game.p2].find(f => f && f.jobId === 'POSEIDON' && f.poseidonKrakenImpactTimer > 0);
        if (!kraken) return;
        const remaining = kraken.poseidonKrakenImpactTimer;
        const progress = 1 - remaining / 18;
        const x = kraken.poseidonKrakenTargetX;
        const ground = CONFIG.GROUND_Y - 8;
        // A massive tentacle drops from above, visibly strikes the marked ground,
        // and withdraws. Visual-only: damage, timing and hitboxes stay unchanged.
        const tipY = remaining >= 12 ? -130 + (18 - remaining) / 6 * (ground + 130)
          : remaining >= 7 ? ground : ground - (7 - remaining) / 7 * (ground + 130);

          const f = (i + 1) / 8;
          const yy = -120 * (1-f)**3 + 3*90*(1-f)**2*f + 3*Math.max(90,tipY-180)*(1-f)*f*f + tipY*f**3;
          const xx = (x+120)*(1-f)**3 + 3*(x-125)*(1-f)**2*f + 3*(x+115)*(1-f)*f*f + x*f**3;

          }

        const isRaining = (game.p1 && game.p1.rainstormTimer > 0) || (game.p2 && game.p2.rainstormTimer > 0);
        const skyGrad = ctx.createLinearGradient(0, 0, 0, CONFIG.GROUND_Y);

          // Kraken rises behind the arena. Tentacles and warning are purely visual.

          if (kraken) {

            ctx.beginPath();ctx.ellipse(640,400,155,100,0,Math.PI,Math.PI*2);ctx.fill();ctx.stroke();
            for(let i=0;i<6;i++) {

        ctx.save();
        ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
        ctx.beginPath(); ctx.roundRect(x, y, w, h, 16); ctx.fill();
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
        ctx.lineWidth = 2; ctx.stroke();
        CONFIG.JOB_ORDER.forEach((jid, idx) => {
          const jInfo = CONFIG.JOBS[jid];
          const col = idx % cols, row = Math.floor(idx / cols);
          const cx = x + pad + col * (cellW + gap);

      drawGroundCracks(ctx) {
        for (const c of VFX.groundCracks) {
          const alpha = Math.max(0, c.life / c.maxLife);
          ctx.save();
          ctx.globalAlpha = alpha * 0.85;
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 3 * c.scale;
          ctx.beginPath();
          ctx.moveTo(c.x - 52 * c.scale, c.y);
          ctx.lineTo(c.x - 24 * c.scale, c.y + 12 * c.scale);
          ctx.lineTo(c.x, c.y + 4 * c.scale);
          ctx.lineTo(c.x + 28 * c.scale, c.y + 15 * c.scale);
          ctx.lineTo(c.x + 56 * c.scale, c.y);
          ctx.stroke();

          ctx.strokeStyle = '#090d16';
          ctx.lineWidth = 2 * c.scale;
          ctx.beginPath();
          ctx.moveTo(c.x - 36 * c.scale, c.y + 2);
          ctx.lineTo(c.x - 14 * c.scale, c.y + 18 * c.scale);
          ctx.moveTo(c.x + 12 * c.scale, c.y + 2);
          ctx.lineTo(c.x + 34 * c.scale, c.y + 19 * c.scale);
          ctx.stroke();
          ctx.restore();
        }
      },

      drawSlashArcs(ctx) {
        for (const arc of VFX.slashArcs) {
          const progress = 1 - arc.life / arc.maxLife;
          const alpha = Math.max(0, 1 - progress);
          ctx.save();
          ctx.translate(arc.x, arc.y);
          ctx.scale(arc.facing, 1);
          ctx.globalAlpha = alpha;

          ctx.strokeStyle = arc.color;
          ctx.lineWidth = arc.lineWidth * (1 - progress * 0.35);
          ctx.lineCap = 'round';
          ctx.shadowBlur = 16;
          ctx.shadowColor = arc.color;
          ctx.beginPath();
          ctx.arc(0, 0, arc.radius + progress * 10, arc.startAngle, arc.endAngle, arc.endAngle < arc.startAngle);
          ctx.stroke();

          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = Math.max(2, arc.lineWidth * 0.36 * (1 - progress * 0.4));
          ctx.beginPath();
          ctx.arc(0, 0, arc.radius + progress * 10, arc.startAngle, arc.endAngle, arc.endAngle < arc.startAngle);
          ctx.stroke();
          ctx.restore();
        }
      },

      drawThrustCones(ctx) {
        for (const tc of VFX.thrustCones) {
          const alpha = Math.max(0, tc.life / tc.maxLife);
          ctx.save();
          ctx.translate(tc.x, tc.y);
          ctx.scale(tc.facing, 1);
          ctx.globalAlpha = alpha;

          if (tc.isStar) {
            ctx.fillStyle = tc.color;
            ctx.shadowBlur = 16;
            ctx.shadowColor = tc.color;
            const r = tc.length * (0.6 + (1 - alpha) * 0.5);
            ctx.beginPath();
            ctx.moveTo(0, -r);
            ctx.lineTo(r * 0.25, -r * 0.25);
            ctx.lineTo(r, 0);
            ctx.lineTo(r * 0.25, r * 0.25);
            ctx.lineTo(0, r);
            ctx.lineTo(-r * 0.25, r * 0.25);
            ctx.lineTo(-r, 0);
            ctx.lineTo(-r * 0.25, -r * 0.25);
            ctx.closePath();
            ctx.fill();
          } else {
            const grad = ctx.createLinearGradient(0, 0, tc.length, 0);
            grad.addColorStop(0, 'rgba(255,255,255,0)');
            grad.addColorStop(0.4, tc.color);
            grad.addColorStop(1, '#ffffff');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(0, -14);
            ctx.lineTo(tc.length, 0);
            ctx.lineTo(0, 14);
            ctx.closePath();
            ctx.fill();
          }
          ctx.restore();
        }
      },

      drawWolfBiteJaws(ctx) {
        for (const jb of VFX.wolfBiteJaws) {
          const progress = 1 - jb.life / jb.maxLife;
          const alpha = Math.max(0, 1 - progress * 0.85);
          // Clamp jaw shut rapidly in first 35% of life
          const snap = Math.min(1, progress / 0.35);
          const openAngle = 0.58 * (1 - snap);

          ctx.save();
          ctx.translate(jb.x, jb.y);
          ctx.scale(jb.facing, 1);
          ctx.globalAlpha = alpha;

          // Crimson chomp shock ring
          ctx.strokeStyle = jb.color;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, 0, 26 + progress * 28, 0, Math.PI * 2);
          ctx.stroke();

          // Upper Jaw Fangs
          ctx.save();
          ctx.translate(-16, -8);
          ctx.rotate(-openAngle);
          ctx.fillStyle = '#ffffff';
          ctx.strokeStyle = jb.color;
          ctx.lineWidth = 2;
          for (let f = 0; f < 4; f++) {
            const fx = f * 12;
            const fh = f === 0 || f === 3 ? 19 : 13;
            ctx.beginPath();
            ctx.moveTo(fx - 4, 0);
            ctx.lineTo(fx + 4, 0);
            ctx.lineTo(fx, fh);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }
          ctx.restore();

          // Lower Jaw Fangs
          ctx.save();
          ctx.translate(-16, 8);
          ctx.rotate(openAngle);
          ctx.fillStyle = '#ffffff';
          ctx.strokeStyle = jb.color;
          ctx.lineWidth = 2;
          for (let f = 0; f < 4; f++) {
            const fx = f * 12;
            const fh = f === 0 || f === 3 ? 19 : 13;
            ctx.beginPath();
            ctx.moveTo(fx - 4, 0);
            ctx.lineTo(fx + 4, 0);
            ctx.lineTo(fx, -fh);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }
          ctx.restore();

          ctx.restore();
        }
      },

      drawLightningBolts(ctx) {
        for (const bolt of VFX.lightningBolts) {
          const alpha = Math.max(0, bolt.life / bolt.maxLife);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.strokeStyle = bolt.color;
          ctx.lineWidth = 10;
          ctx.shadowBlur = 22;

          ctx.beginPath();
          bolt.segments.forEach((pt, idx) => {

            offsets.forEach((ox, idx) => {

                vt.x + ox * 0.6,

      // -----------------------------------------------------------------------

      drawClassCostume(ctx, f, p) {
        const j=f.jobId||'STICKMAN', {hipX,hipY,shoulderX,shoulderY,headX,headY,frontFoot,backFoot,frontHand,backHand,dir,t}=p;
        const x=f.x,y=f.y;
        const torsoX=x+(shoulderX+hipX)/2, torsoY=y+(shoulderY+hipY)/2;
        ctx.save();ctx.lineJoin='round';ctx.lineCap='round';ctx.shadowBlur=0;
        const line=(a,b,c,d,color,w=3)=>{ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();};
        const patch=(color,stroke='#172033',w=17)=>{ctx.fillStyle=color;ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+shoulderX-w,y+shoulderY+3);ctx.lineTo(x+shoulderX+w,y+shoulderY+3);ctx.lineTo(x+hipX+w*.8,y+hipY+6);ctx.lineTo(x+hipX-w*.8,y+hipY+6);ctx.closePath();ctx.fill();ctx.stroke();};

          ctx.fillStyle='#111827';ctx.strokeStyle='#e5e7eb';ctx.lineWidth=2.5;
          ctx.beginPath();ctx.moveTo(x+shoulderX-17,y+shoulderY+1);ctx.lineTo(x+shoulderX+17,y+shoulderY+1);ctx.lineTo(x+hipX+24,y+hipY+19);ctx.lineTo(x+hipX-24,y+hipY+19);ctx.closePath();ctx.fill();ctx.stroke();
          ctx.fillStyle='#f8fafc';ctx.fillRect(x+shoulderX-7,y+shoulderY+1,14,9);ctx.fillStyle='#dc2626';ctx.fillRect(x+shoulderX-2,y+shoulderY+9,4,17);
          ctx.strokeStyle='#f8fafc';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+shoulderX,y+shoulderY+23);ctx.lineTo(x+shoulderX,y+shoulderY+40);ctx.moveTo(x+shoulderX-6,y+shoulderY+29);ctx.lineTo(x+shoulderX+6,y+shoulderY+29);ctx.stroke();

      drawKatana(ctx, f, hand, dir) {
        const hx = f.x + hand.x;
        const hy = f.y + hand.y;
        let angle = -0.75;

        if (f.state === 'ATTACK') {
          if (f.attackType === 'SWORD_SLASH') angle = 0.25;
          else if (f.attackType === 'SWORD_THRUST') angle = 0.02;
          else if (f.attackType === 'SWORD_WAVE_SLASH') angle = -0.35;
          else if (f.attackType === 'SKILL1') angle = (Math.floor(f.stateTimer / 7) % 2 === 0) ? 0.35 : -0.45;
          else if (f.attackType === 'SKILL2') angle = f.stateTimer < 12 ? -2.3 : 0.08;
        }

        const isAwakened = f.awakenTimer > 0;
        const bladeLength = isAwakened ? 92 : 76;
        const bladeColor = isAwakened ? f.accentColor : '#f8fafc';

        ctx.save();
        ctx.translate(hx, hy);
        ctx.scale(dir, 1);
        ctx.rotate(angle);

        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(-14, 0);
        ctx.lineTo(0, 0);
        ctx.stroke();

        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(-1, -7, 4, 14);

        ctx.strokeStyle = bladeColor;
        ctx.lineWidth = isAwakened ? 5.5 : 4;
        ctx.shadowBlur = isAwakened ? 20 : 8;
        ctx.shadowColor = isAwakened ? f.accentColor : '#38bdf8';
        ctx.beginPath();
        ctx.moveTo(3, 0);
        ctx.quadraticCurveTo(bladeLength * 0.6, -2, bladeLength, -6);
        ctx.stroke();

        ctx.restore();
      },
