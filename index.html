        if (this.recentDashTimer > 0) {
          this.recentDashTimer--;
        }

        // Taekwondo Passive Fast Ultimate Accumulation & Buff Timers
        if (this.jobId === 'TAEKWONDO' && this.state !== 'KO') {
          if (GAME.phase === 'FIGHT' && this.ult < CONFIG.MAX_ULT) {
            const beforeUlt = this.ult;
            this.ult = Math.min(CONFIG.MAX_ULT, this.ult + 0.045);
            this.notifyUltReady(beforeUlt);
          }
          if (this.tkdRangeTimer > 0) {
            this.tkdRangeTimer--;
            if (this.tkdRangeTimer % 4 === 0) {
              VFX.particles.push({
                x: this.x + (Math.random() - 0.5) * 38,
                y: this.y - 8 - Math.random() * 44,
                vx: (Math.random() - 0.5) * 2.2,
                vy: -1.4 - Math.random() * 1.8,
                life: 14,
                maxLife: 14,
                size: 3.4,
                color: Math.random() > 0.4 ? '#fb923c' : '#fde047',
                spark: true
              });
            }
          }
          if (this.tkdDefTimer > 0) {
            this.tkdDefTimer--;
          }
          if (this.tkdAtkDefTimer > 0) {
            this.tkdAtkDefTimer--;
            if (this.tkdAtkDefTimer % 5 === 0) {
              VFX.particles.push({
                x: this.x + (Math.random() - 0.5) * 44,
                y: this.y - 20 - Math.random() * 105,
                vx: (Math.random() - 0.5) * 1.5,
                vy: -2.0 - Math.random() * 1.8,
                life: 15,
                maxLife: 15,
                size: 3.2,
                color: Math.random() > 0.5 ? '#f43f5e' : '#38bdf8',
                spark: true
              });
            }
          }
        }

        // Werewolf Transformation Rage Drain & Post-Revert Immobilization
        if (this.jobId === 'WEREWOLF' && this.state !== 'KO') {
          if (this.isWerewolf) {
            this.rage = Math.max(0, this.rage - 0.145);
            if (this.animTick % 5 === 0) {
              VFX.particles.push({
                x: this.x + (Math.random() - 0.5) * 48,
                y: this.y - 16 - Math.random() * 115,
                vx: (Math.random() - 0.5) * 1.6,
                vy: -2.0 - Math.random() * 2.2,
                life: 16,
                maxLife: 16,
                size: 3.5,
                color: Math.random() > 0.35 ? this.accentColor : '#fde047',
                spark: true
              });
            }
            if (this.rage <= 0) {
              this.revertToHuman();
            }
          } else if (this.revertStunTimer > 0) {
            this.revertStunTimer--;
            this.vx = 0;
            if (this.revertStunTimer % 8 === 0) {
              VFX.smokePuffs.push({
                x: this.x + (Math.random() - 0.5) * 20,
                y: this.y - 96,
                vx: (Math.random() - 0.5) * 1.2,
                vy: -1.4,
                radius: 7,
                color: 'rgba(148, 163, 184, 0.55)',
                life: 14,
                maxLife: 14
              });
            }
          }
        }

        if (this.jobId === 'HUNTER' && this.hunterAmmoTimer > 0) this.hunterAmmoTimer--;
        if (this.begStenchTimer > 0) this.begStenchTimer--;
        if (this.begPleadTimer > 0) this.begPleadTimer--;
        if (this.begCoinRainTimer > 0 && GAME.phase === 'FIGHT') {
          this.begCoinRainTimer--;
          this.begCoinRainTick++;
          const spec = CONFIG.JOBS.BEGGAR.attacks.ULTIMATE;
          if (this.begCoinRainTick % spec.coinInterval === 1) {
            const targetX = this.opponent ? this.opponent.x : this.x;
            const cx = Math.max(CONFIG.STAGE_LEFT+20,Math.min(CONFIG.STAGE_RIGHT-20,targetX+(Math.random()-.5)*340));
            this.begCoins.push({x:cx,y:-35,vy:10+Math.random()*3,gold:Math.random()<0.27,hit:false});
          }
        }
        if (this.begCoins.length) {
          for (const coin of this.begCoins) {
            coin.y += coin.vy;
            coin.vy = Math.min(21,coin.vy+0.42);
            if (!coin.hit && this.opponent && this.opponent.hp>0 && Math.abs(coin.x-this.opponent.x)<31 && coin.y>=this.opponent.y-126 && coin.y<this.opponent.y-18) {
              coin.hit=true;
              if (this.opponent.invulnTimer<=0) COMBAT_ENGINE.applyHit(this,this.opponent,{
                damage:coin.gold?CONFIG.JOBS.BEGGAR.attacks.ULTIMATE.goldDamage:CONFIG.JOBS.BEGGAR.attacks.ULTIMATE.silverDamage,
                ultGainAttacker:0,ultGainDefender:3,hitstun:12,blockstun:9,knockbackX:2,knockbackY:0,hitstop:2,shake:4,
                direction:this.opponent.x>=coin.x?1:-1,sourceX:coin.x,isSkill:true
              });
            }
          }
          this.begCoins=this.begCoins.filter(c=>c.y<CONFIG.GROUND_Y+25);
        }
        if (this.gambleSlowTimer > 0) this.gambleSlowTimer--;
        if (this.gambleBuffTimer > 0) this.gambleBuffTimer--;
        if (this.poseidonSlowTimer > 0) {
          this.poseidonSlowTimer--;
          if (this.poseidonSlowTimer === 0) this.poseidonSlowStacks = 0;
        }
        if (this.poseidonKrakenImpactTimer > 0) this.poseidonKrakenImpactTimer--;
        // Eight telegraphed Kraken strikes; no countdown execution or instant KO.
        if (this.poseidonJudgmentTimer > 0 && this.poseidonJudgmentShield > 0 && this.poseidonKrakenStrikesLeft > 0) {
          const spec = this.attacks.ULTIMATE;
          const interval = spec.strikeInterval || 58;
          const warning = spec.warningFrames || 35;
          const phase = (this.poseidonJudgmentTimer - 1) % interval;
          if (phase === interval - 1 && this.opponent) {
            this.poseidonKrakenTargetX = Math.max(CONFIG.STAGE_LEFT+55,
              Math.min(CONFIG.STAGE_RIGHT-55, this.opponent.x));
          }
          this.poseidonKrakenWarning = phase >= interval - warning ? 1 : 0;
          if (phase === interval - warning - 1 && this.opponent && this.opponent.hp > 0) {
            this.poseidonKrakenImpactTimer = 18;
            const enemy = this.opponent;
            // The warning marks the fixed landing position; moving away avoids damage.
            if (Math.abs(enemy.x - this.poseidonKrakenTargetX) < 69 && enemy.invulnTimer <= 0) {
              const damage = spec.strikeDamage || 65;
              enemy.hp = Math.max(0, enemy.hp - damage);
              enemy.vx += (enemy.x >= this.poseidonKrakenTargetX ? 1 : -1) * 7;
              VFX.spawnHitSparks(enemy.x,enemy.y-75,'#67e8f9',18,1.1);
              VFX.spawnFloatingText(enemy.x,enemy.y-160,`-${damage} 크라켄`, '#a5f3fc');
              if (enemy.hp <= 0) { enemy.state='KO';enemy.attackType=null;enemy.stateTimer=0;AUDIO.sfxKO(); }
            }
            VFX.shockwaves.push({x:this.poseidonKrakenTargetX,y:CONFIG.GROUND_Y-7,
              radius:12,maxRadius:95,life:17,maxLife:17,color:'#38bdf8'});
            this.poseidonKrakenStrikesLeft--;
          }
          this.poseidonJudgmentTimer--;
          if (this.poseidonJudgmentTimer <= 0 || this.poseidonKrakenStrikesLeft <= 0) {
            this.poseidonJudgmentTimer=0;
            this.poseidonKrakenWarning=0;
          }
        }
        // Class Buff, Shield, Root, Rainstorm & Knight/Pirate Timers
        if (this.songDodgeTimer > 0) {
          this.songDodgeTimer--;
        }
        if (this.awakenTimer > 0) {
          this.awakenTimer--;
          if (this.awakenTimer % 5 === 0) {
            const pCol = this.id === 'P1'
              ? (Math.random() > 0.35 ? '#f43f5e' : '#fda4af')
              : (Math.random() > 0.35 ? '#38bdf8' : '#7dd3fc');
            VFX.particles.push({
              x: this.x + (Math.random() - 0.5) * 44,
              y: this.y - 15 - Math.random() * 110,
              vx: (Math.random() - 0.5) * 1.5,
              vy: -2.2 - Math.random() * 2.0,
              life: 16,
              maxLife: 16,
              size: 3.5,
              color: pCol,
              spark: true
            });
          }
        }
        if (this.pirateGunTimer > 0) {
          this.pirateGunTimer--;
          if (this.pirateGunTimer <= 0 && this.pirateGunAmmo > 0) {
            this.pirateGunAmmo = 0;
            VFX.spawnFloatingText(this.x, this.y - 158, '검 복귀!', '#fbbf24');
            AUDIO.sfxSwordSlash();
          }
        }
        if (this.pirateBuffTimer > 0) {
          this.pirateBuffTimer--;
          if (this.pirateBuffTimer % 5 === 0) {
            VFX.particles.push({
              x: this.x + (Math.random() - 0.5) * 44,
              y: this.y - 15 - Math.random() * 110,
              vx: (Math.random() - 0.5) * 1.5,
              vy: -2.2 - Math.random() * 2.0,
              life: 16,
              maxLife: 16,
              size: 3.5,
              color: Math.random() > 0.4 ? '#fde047' : '#ef4444',
              spark: true
            });
          }
        }
        if (this.shieldTimer > 0 && this.shieldHp > 0) {
          this.shieldTimer--;
          if (this.shieldTimer <= 0) {
            this.shieldHp = 0;
          }
        }
        if (this.knightShieldTimer > 0) {
          this.knightShieldTimer--;
        }
        if (this.knightBuffTimer > 0) {
          this.knightBuffTimer--;
          if (this.knightBuffTimer % 7 === 0) {
            VFX.particles.push({
              x: this.x + this.facing * 24 + (Math.random() - 0.5) * 26,
              y: this.y - 60 - Math.random() * 65,
              vx: (Math.random() - 0.5) * 1.2,
              vy: -1.8 - Math.random() * 1.6,
              life: 14,
              maxLife: 14,
              size: 3,
              color: '#fde047',
              spark: true
            });
          }
        }
        if (this.banner) {
          this.banner.timer--;
          if (this.banner.hitCooldown > 0) this.banner.hitCooldown--;
          if (this.banner.hp <= 0) {
            VFX.spawnHitSparks(this.banner.x, this.banner.y - 70, '#f43f5e', 20, 1.15);
            VFX.spawnFloatingText(this.banner.x, this.banner.y - 152, '깃발 파괴!', '#f43f5e');
            AUDIO.sfxGuard();
            this.banner = null;
          } else if (this.banner.timer <= 0) {
            VFX.spawnDust(this.banner.x, this.banner.y, 0);
            VFX.spawnFloatingText(this.banner.x, this.banner.y - 152, '깃발 종료', '#94a3b8');
            this.banner = null;
          }
        }
        if (this.rootTimer > 0) {
          if (this.hasActiveBanner()) {
            this.rootTimer = 0;
          } else {
            this.rootTimer--;
            this.vx = 0;
          }
        }
        if (this.rainstormTimer > 0) {
          this.rainstormTimer--;
          this.rainStrikeTimer--;
          if (this.rainStrikeTimer <= 0 && opponent && opponent.state !== 'KO') {
            const ultSpec = this.attacks.ULTIMATE;
            this.rainStrikeTimer = ultSpec.strikeInterval || 75;
            VFX.spawnSkyStrike(this, opponent, opponent.x, ultSpec);
          }
        }

        const cdTick = this.awakenTimer > 0 ? (this.attacks.ULTIMATE.speedMult || 1.22) : 1;
        if (this.cooldowns.SKILL1 > 0) this.cooldowns.SKILL1 = Math.max(0, this.cooldowns.SKILL1 - cdTick);
        if (this.cooldowns.SKILL2 > 0) this.cooldowns.SKILL2 = Math.max(0, this.cooldowns.SKILL2 - cdTick);
        if (this.normalChainCooldown > 0) this.normalChainCooldown--;
        if (this.invulnTimer > 0) this.invulnTimer--;
        if (this.comboResetTimer > 0) {
          this.comboResetTimer--;
          if (this.comboResetTimer === 0) this.comboCount = 0;
        }

        if (this.isGrounded() && ['IDLE', 'WALK', 'CROUCH'].includes(this.state) && this.revertStunTimer <= 0) {
          if (this.knightShieldTimer > 0) {
            this.facing = this.knightShieldDir;
          } else if (opponent.x > this.x + 6) {
            this.facing = 1;
          } else if (opponent.x < this.x - 6) {
            this.facing = -1;
          }
        }

        switch (this.state) {
          case 'KO':
          case 'VICTORY':
            this.shadowClones = [];
            this.vx *= 0.85;
            this.applyGravityAndBounds();
            this.updateHeadband();
            return;

          case 'HITSTUN':
            this.stateTimer++;
            this.hitstunTimer--;
            this.vx *= 0.88;
            if (this.hitstunTimer <= 0) {
              this.isBlocking = false;
              this.state = this.isGrounded() ? 'IDLE' : 'JUMP';
              this.stateTimer = 0;
            }
            break;

          case 'KNOCKDOWN':
            this.stateTimer++;
            this.vx *= 0.92;
            if (this.isGrounded() && this.vy >= 0 && this.stateTimer > 12) {
              this.vx *= 0.75;
              if (this.stateTimer >= 36) {
                this.state = 'IDLE';
                this.stateTimer = 0;
                this.invulnTimer = 22;
                VFX.spawnDust(this.x, this.y, 0);
              }
            }
            break;

          case 'DASH':
            this.stateTimer++;
            if (this.stateTimer % 2 === 0) VFX.spawnAfterimage(this);
            // Taekwondo Dash + Normal Attack Commands (DD+X / AA+X)
            if (canControl && this.jobId === 'TAEKWONDO' && INPUT.wasPressed(this.controls.normal)) {
              if (this.dashDir === this.facing) {
                this.startAttack('TKD_DASH_DOUBLE_KICK', projectiles);
                break;
              } else if (this.dashDir === -this.facing && this.beltRank >= 1) {
                this.startAttack('TKD_BACK_SPIN_KICK', projectiles);
                break;
              } else {
                this.startAttack(this.firstNormal, projectiles);
                break;
              }
            }
            if (this.stateTimer >= CONFIG.DASH_DURATION) {
              this.vx *= 0.35;
              this.recentDashDir = this.dashDir;
              this.recentDashTimer = 6;
              this.state = this.isGrounded() ? 'IDLE' : 'JUMP';
              this.stateTimer = 0;
            }
            break;

          case 'ATTACK':
            this.updateAttackState(opponent, projectiles, canControl);
            break;

          case 'IDLE':
          case 'WALK':
          case 'CROUCH':
          case 'JUMP':
            if (this.revertStunTimer > 0 || this.aiStunTimer > 0) {
              this.vx = 0;
              if (this.isGrounded()) this.state = 'IDLE';
            } else if (canControl) {
              this.handleNeutralControls(projectiles);
            } else {
              this.vx *= 0.8;
              if (this.isGrounded()) this.state = 'IDLE';
            }
            break;
        }

        this.applyGravityAndBounds();
        this.updateHeadband();
      }

      handleNeutralControls(projectiles) {
        if (this.revertStunTimer > 0) {
          this.vx = 0;
          if (this.isGrounded()) this.state = 'IDLE';
          return;
        }

        const c = this.begStenchTimer > 0 ? {...this.controls,up:this.controls.down,down:this.controls.up,left:this.controls.right,right:this.controls.left} : this.controls;
        const grounded = this.isGrounded();
        let speedBoost = this.awakenTimer > 0 ? 1.12 : 1.0;
        if (this.pirateBuffTimer > 0) speedBoost *= 1.18;
        if (this.isWerewolf) speedBoost *= 1.18;
        if (this.isDebuffedByRain()) speedBoost *= 0.75;
        if (this.begStenchTimer > 0) speedBoost *= 0.60;
        if (this.jobId === 'MONK' && this.monkGoldTimer > 0) speedBoost *= 0.22;

        if (this.tryStartAttackInput(projectiles)) return;

        // If rooted by Taoist vines/tornadoes or Werewolf Bite, lock walking, dashing, and jumping (guard & attacks still allowed)
        if (this.rootTimer > 0) {
          this.vx = 0;
          if (grounded && INPUT.isDown(c.down)) {
            this.state = 'CROUCH';
          } else if (grounded) {
            this.state = 'IDLE';
          }
          return;
        }

        if (grounded) {
          if (INPUT.wasDoubleTapped(c.right)) {
            this.startDash(1);
            return;
          }
          if (INPUT.wasDoubleTapped(c.left)) {
            this.startDash(-1);
            return;
          }
        }

        if (grounded && INPUT.wasPressed(c.up)) {
          this.vy = CONFIG.JUMP_VELOCITY * (this.isWerewolf ? 1.05 : 1.0);
          this.y -= 2;
          this.state = 'JUMP';
          this.stateTimer = 0;
          VFX.spawnDust(this.x, CONFIG.GROUND_Y, 0);
          AUDIO.sfxWhiff();
          return;
        }

        if (grounded && INPUT.isDown(c.down)) {
          this.state = 'CROUCH';
          this.vx *= 0.7;
          return;
        }

        const moveLeft = INPUT.isDown(c.left);
        const moveRight = INPUT.isDown(c.right);

        if (moveLeft && !moveRight) {
          const speed = (this.facing === -1 ? this.walkSpeed : this.backWalkSpeed) * speedBoost;
          this.vx = -speed;
          if (grounded) this.state = 'WALK';
        } else if (moveRight && !moveLeft) {
          const speed = (this.facing === 1 ? this.walkSpeed : this.backWalkSpeed) * speedBoost;
          this.vx = speed;
          if (grounded) this.state = 'WALK';
        } else {
          this.vx *= grounded ? 0.72 : 0.94;
          if (grounded && Math.abs(this.vx) < 0.4) {
            this.vx = 0;
            this.state = 'IDLE';
          }
        }

        if (!grounded) {
          this.state = 'JUMP';
        }
      }

      startDash(dir) {
        if (this.rootTimer > 0 || this.revertStunTimer > 0) return;
        let dashMult = this.isDebuffedByRain() ? 0.75 : 1.0;
        if (this.pirateBuffTimer > 0) dashMult *= 1.15;
        if (this.isWerewolf) dashMult *= 1.16;
        this.dashDir = dir;
        this.state = 'DASH';
        this.stateTimer = 0;
        this.vx = this.dashSpeed * dashMult * dir;
        VFX.spawnDust(this.x, this.y, dir);
        AUDIO.sfxWhiff();
      }

      tryStartAttackInput(projectiles) {
        if (this.revertStunTimer > 0 || this.aiStunTimer > 0) return false;
        const c = this.controls;

        if (INPUT.wasPressed(c.ultimate) && this.ult >= CONFIG.MAX_ULT && !(this.aiSealTimer>0 && this.aiSealSlot==='ULTIMATE')) {
          this.startAttack('ULTIMATE', projectiles);
          return true;
        }

        if (INPUT.wasPressed(c.skill2) && this.cooldowns.SKILL2 <= 0 && !(this.aiSealTimer>0 && this.aiSealSlot==='SKILL2')) {
          if (this.jobId === 'REAPER' && this.soulCount <= 0) {
            this.cooldowns.SKILL2 = 18;
            VFX.spawnFloatingText(this.x, this.y - 158, '영혼 부족!', this.accentColor);
            AUDIO.sfxWhiff();
            return false;
          }
          this.startAttack('SKILL2', projectiles);
          return true;
        }

        if (INPUT.wasPressed(c.skill1) && this.cooldowns.SKILL1 <= 0 && !(this.aiSealTimer>0 && this.aiSealSlot==='SKILL1')) {
          if (this.jobId === 'STICKMAN') {
            const hasActiveBall = projectiles.some((p) => p.owner === this && p.active);
            if (hasActiveBall) return false;
          }
          if (this.jobId === 'REAPER' && this.hasActiveBoomerang()) {
            return false;
          }
          this.startAttack('SKILL1', projectiles);
          return true;
        }

        if (INPUT.wasPressed(c.normal) && this.normalChainCooldown <= 0) {
          if (this.jobId === 'TAEKWONDO') {
            // Check jump side-kick (Blue belt+ while airborne)
            if (!this.isGrounded() && this.beltRank >= 2) {
              this.startAttack('TKD_JUMP_SIDE_KICK', projectiles);
              return true;
            }
            // Check recent dash buffer (DD+X forward double kick, AA+X yellow belt+ back spin kick)
            if (this.isGrounded() && this.recentDashTimer > 0) {
              const dDir = this.recentDashDir;
              this.recentDashTimer = 0;
              if (dDir === this.facing) {
                this.startAttack('TKD_DASH_DOUBLE_KICK', projectiles);
                return true;
              }
              if (dDir === -this.facing && this.beltRank >= 1) {
                this.startAttack('TKD_BACK_SPIN_KICK', projectiles);
                return true;
              }
            }
            this.startAttack('TKD_KICK', projectiles);
            return true;
          }
          if(this.jobId==='AI_ROBOT'){
            const close=this.opponent&&Math.abs(this.opponent.x-this.x)<205;
            this.aiRingHits=close?0:this.aiRingHits;
            this.startAttack(close?'AI_BLADE1':'AI_RING1',projectiles);
          } else if (this.isPirateGunActive()) {
            this.startAttack('PIRATE_GUN_SHOT', projectiles);
          } else {
            this.startAttack(this.firstNormal, projectiles);
          }
          return true;
        }

        return false;
      }

      startAttack(type, projectiles) {
        if(this.aiStunTimer>0)return;
        if(this.aiSealTimer>0 && this.aiSealSlot===type){VFX.spawnFloatingText(this.x,this.y-160,'AI 기술 봉쇄!','#f87171');return;}
        if(this.jobId==='AI_ROBOT' && type==='AI_BLADE1' && this.opponent && Math.abs(this.opponent.x-this.x)>=205)type='AI_RING1';
        // Regular Taekwondo attacks cycle: front kick -> roundhouse -> roundhouse.
        if (this.jobId === 'TAEKWONDO' && type === 'TKD_KICK') {
          // Taekwondo's normal combo must only cycle through attacks defined by its own job.
          // Gojo move IDs here caused undefined attack specs/state transitions and could freeze combat.
          const sequence = ['TKD_KICK', 'TKD_ROUNDHOUSE1', 'TKD_ROUNDHOUSE2'];
          type = sequence[this.tkdNormalStep % sequence.length];
          this.tkdNormalStep = (this.tkdNormalStep + 1) % sequence.length;
        }
        this.state = 'ATTACK';
        this.attackType = type;
        this.stateTimer = 0;
        this.attackHasHit = false;
        this.bannerHasHit = false;
        this.attackInstanceId = (this.attackInstanceId || 0) + 1;
        this.activeBeatIndex = 0;
        this.beatTriggered.clear();
        this.iaidoLineBox = null;
        this.shadowClones = [];
        this.isBlocking = false;

        // 도박꾼: 복사한 기술의 원래 슬롯을 사용해 기술 1/2의 발동 로직을 모두 실행한다.
        // 재사용 대기시간은 도박꾼의 기술 2에만 적용한다.
        if (this.jobId === 'GAMBLER') {
          this.attacks = this.job.attacks;
          this.gambleCopyActive = false;
          if (type === 'SKILL2' && this.opponent && this.opponent.attacks) {
            let choice = Math.random() < 0.5 ? 'SKILL1' : 'SKILL2';
            if (this.opponent.jobId === 'GAMBLER' && choice === 'SKILL2') choice = 'SKILL1';
            const copied = this.opponent.attacks[choice];
            // 스님 2번은 일반 공격이 아니라 즉시 발동하는 방어 버프다.
            // 도박꾼이 이를 일반 공격처럼 복사하면 존재하지 않는 공격 동작으로 진입해
            // 캐릭터 렌더링/상태가 꼬일 수 있으므로, 효과만 안전하게 복사한다.
            if (copied && this.opponent.jobId === 'MONK' && choice === 'SKILL2') {
              this.gambleMonkGoldTimer = copied.goldDuration || 240;
              this.cooldowns.SKILL2 = this.job.attacks.SKILL2.cooldown;
              this.state = 'IDLE';
              this.attackType = null;
              this.stateTimer = 0;
              this.gainUlt(copied.ultGainOnCast || 6);
              VFX.spawnHitSparks(this.x, this.y - 78, '#fbbf24', 30, 1.15);
              VFX.spawnFloatingText(this.x, this.y - 178, '금강불괴 복사! 피해 60% 감소', '#fde68a');
              AUDIO.sfxShieldCast();
              return;
            }
            if (copied && copied.skillStyle !== 'GAMBLE_COPY') {
              this.gambleCopyActive = true;
              this.gambleCopySlot = choice;
              this.gambleCopiedJob = this.opponent.jobId;
              this.attacks = {...this.job.attacks, [choice]: {...copied, name:choice}};
              type = choice;
              this.attackType = choice;
              this.cooldowns.SKILL2 = this.job.attacks.SKILL2.cooldown;
              VFX.spawnHitSparks(this.x, this.y - 115, '#fbbf24', 16, 1.1);
              VFX.spawnFloatingText(this.x, this.y - 170, `기술 복사: ${choice === 'SKILL1' ? '1' : '2'}번!`, '#fde047');
            } else {
              this.cooldowns.SKILL2 = this.job.attacks.SKILL2.cooldown;
              VFX.spawnFloatingText(this.x, this.y - 170, '복사 실패!', '#f87171');
            }
          }
        }
        const spec = this.attacks[type];
        if (type === 'SKILL1' || type === 'SKILL2' || type === 'ULTIMATE') VFX.spawnSkillCast(this, type);
        if(this.jobId==='AI_ROBOT' && type==='ULTIMATE'){
          if(this.aiEvolveTimer>0){this.aiOverloadTimer=spec.overloadDuration;this.aiEvolveTimer=spec.overloadDuration;VFX.spawnFloatingText(this.x,this.y-175,'OVERLOAD!','#fb7185');}
          else{this.aiEvolveTimer=spec.evolveDuration;VFX.spawnFloatingText(this.x,this.y-175,'AI 진화!','#fbbf24');}
        }
        // Normal Attacks (all 11 classes)
        if (spec.nextNormal || [
          'JAB', 'STRAIGHT', 'KICK',
          'SWORD_SLASH', 'SWORD_THRUST', 'SWORD_WAVE_SLASH',
          'AXE_SWING1', 'AXE_SWING2', 'AXE_SLAM',
          'SHURIKEN_THROW1', 'SHURIKEN_THROW2', 'SHURIKEN_DASH_SLASH',
          'FAN_SWING1', 'FAN_SWING2', 'FAN_WIND_GUST',
          'KNIGHT_SWORD_SLASH', 'KNIGHT_SHIELD_BASH',
          'PIRATE_SLASH1', 'PIRATE_SLASH2', 'PIRATE_SLASH3', 'PIRATE_UPPER_SLASH', 'PIRATE_GUN_SHOT',
          'POSEIDON_SWING1', 'POSEIDON_SWING2', 'POSEIDON_THRUST',
          'REAPER_SLASH1', 'REAPER_SLASH2', 'REAPER_SLASH3',
          'WOLF_HUMAN_PUNCH1', 'WOLF_HUMAN_PUNCH2', 'WOLF_HUMAN_UPPER',
          'WOLF_CLAW1', 'WOLF_CLAW2', 'WOLF_CLAW3',
          'HUNTER_SHOT1', 'HUNTER_SHOT2', 'HUNTER_ROLL_SHOT', 'BASKET_THROW', 'GAMBLE_COIN1', 'GAMBLE_COIN2', 'GAMBLE_CASH',
          'TKD_KICK', 'TKD_ROUNDHOUSE1', 'TKD_ROUNDHOUSE2', 'TKD_DASH_DOUBLE_KICK', 'TKD_BACK_SPIN_KICK', 'TKD_JUMP_SIDE_KICK'
        ].includes(type)) {
          if (spec.lungeX && this.isGrounded() && this.rootTimer <= 0) {
            this.vx = spec.lungeX * this.facing;
          }
          if (spec.advanceSpeed && this.rootTimer <= 0) {
            this.vx = spec.advanceSpeed * this.facing;
            VFX.spawnDust(this.x, this.y, this.facing);
          }
          if (spec.backVelX && this.rootTimer <= 0) {
            this.vx = spec.backVelX * this.facing;
            VFX.spawnDust(this.x, this.y, -this.facing);
          }
          if (spec.airVelX && this.rootTimer <= 0) {
            this.vx = spec.airVelX * this.facing;
            this.vy = Math.min(this.vy, -2.2);
          }
          if (spec.hopVelY && this.isGrounded() && this.rootTimer <= 0) {
            this.vy = spec.hopVelY;
            this.y -= 2;
          }
          if (spec.dashBurstVelX && this.rootTimer <= 0) {
            this.vx = spec.dashBurstVelX * this.facing;
            VFX.spawnDust(this.x, this.y, this.facing);
          }

          if (type.startsWith('WOLF_CLAW')) {
            VFX.spawnSlashArc({
              x: this.x + this.facing * 24,
              y: this.y - 96,
              radius: type === 'WOLF_CLAW3' ? 92 : 78,
              startAngle: type === 'WOLF_CLAW2' ? 0.9 : -1.05,
              endAngle: type === 'WOLF_CLAW2' ? -0.9 : 0.85,
              facing: this.facing,
              color: this.accentColor,
              lineWidth: type === 'WOLF_CLAW3' ? 17 : 13,
              life: 9
            });
            AUDIO.sfxSwordSlash();
          } else if (type.startsWith('REAPER_SLASH')) AUDIO.sfxReaperScythe();
          else if (type.startsWith('SWORD_') || type === 'KNIGHT_SWORD_SLASH' || type.startsWith('PIRATE_SLASH') || type === 'PIRATE_UPPER_SLASH') AUDIO.sfxSwordSlash();
          else if (type === 'PIRATE_GUN_SHOT') AUDIO.sfxWhiff();
          else if (type.startsWith('SHURIKEN_THROW')) AUDIO.sfxShurikenThrow();
          else if (type.startsWith('FAN_')) AUDIO.sfxWindGust();
          else AUDIO.sfxWhiff();
          return;
        }

        // Skill 1 Variants
        if (type === 'SKILL1') {
          if (spec.skillStyle === 'BEG_STENCH') {
            this.cooldowns.SKILL1=spec.cooldown;this.gainUlt(spec.ultGainOnCast||0);
            if (this.opponent && Math.abs(this.opponent.x-this.x)<=spec.range && this.opponent.hp>0) {
              this.opponent.begStenchTimer=Math.max(this.opponent.begStenchTimer||0,spec.duration);
              VFX.spawnFloatingText(this.opponent.x,this.opponent.y-170,'악취! 방향 반전', '#a3e635');
            }
            VFX.spawnSmokePoof(this.x+this.facing*35,this.y-65,16,'rgba(132,204,22,0.72)');
            AUDIO.sfxWindGust();return;
          }
          if (spec.skillStyle === 'GAMBLE_CARD') {
            this.cooldowns.SKILL1=spec.cooldown;
            this.gainUlt(spec.ultGainOnCast || 0);
            AUDIO.sfxWhiff();return;
          }
          if (spec.skillStyle === 'POSEIDON_SPIN') {
            this.cooldowns.SKILL1 = spec.cooldown;
            this.gainUlt(spec.ultGainOnCast || 0);
            this.vx = 0;
            AUDIO.sfxWindGust();
            return;
          }
          if (spec.skillStyle === 'TKD_SAFE_DASH') {
            this.cooldowns.SKILL1 = spec.cooldown;
            if (spec.ultGainOnCast) this.gainUlt(spec.ultGainOnCast);
            if (this.rootTimer <= 0) this.vx = 22 * this.facing;
            VFX.spawnAfterimage(this);
            VFX.spawnDust(this.x, CONFIG.GROUND_Y, this.facing);
            AUDIO.sfxWhiff();
            return;
          }

          if (spec.skillStyle === 'WEREWOLF_SKILL1') {
            if (this.isWerewolf) {
              // Werewolf Form Skill 1: Ferocious Lunge that damages on hit
              this.cooldowns.SKILL1 = spec.wolfCooldown || 78;
              this.vx = (spec.wolfDashVelX || 23.0) * this.facing;
              VFX.spawnDust(this.x, this.y, this.facing);
              VFX.spawnSlashArc({
                x: this.x + this.facing * 28,
                y: this.y - 88,
                radius: 88,
                startAngle: -0.9,
                endAngle: 0.9,
                facing: this.facing,
                color: this.accentColor,
                lineWidth: 16
              });
              AUDIO.sfxUppercut();
            } else {
              // Human Form Skill 1: Short non-damaging tactical dash
              this.cooldowns.SKILL1 = spec.cooldown || 48;
              this.dashRageAwarded = false;
              if (this.rootTimer <= 0) {
                this.vx = (spec.humanDashVelX || 16.5) * this.facing;
              }
              VFX.spawnDust(this.x, this.y, this.facing);
              AUDIO.sfxWhiff();
            }
            return;
          }

          this.cooldowns.SKILL1 = spec.cooldown;
          if (spec.ultGainOnCast) this.gainUlt(spec.ultGainOnCast);

          if (spec.skillStyle === 'SONG_WALL_DASH') {
            this.dashWallDir = this.facing;
            this.vx = spec.dashVelX * this.dashWallDir;
            VFX.spawnDust(this.x, this.y, this.dashWallDir);
            VFX.spawnAfterimage(this, '#fb923c');
            AUDIO.sfxUppercut();
          } else if (spec.skillStyle === 'REAPER_BOOMERANG') {
            this.vx *= 0.2;
            AUDIO.sfxReaperScythe();
          } else if (spec.skillStyle === 'PIRATE_GUN_MODE') {
            this.vx = 0;
            this.pirateGunAmmo = spec.gunMaxAmmo || 5;
            this.pirateGunTimer = spec.gunDuration || 420;
            this.pirateGunMaxTimer = spec.gunDuration || 420;
            VFX.spawnHitSparks(this.x + this.facing * 32, this.y - 98, '#fbbf24', 12, 0.85);
            VFX.spawnFloatingText(this.x, this.y - 158, '총기 전환! (5발)', '#fbbf24');
            AUDIO.sfxIaidoGlint();
          } else if (spec.skillStyle === 'SAMURAI_DANCE') {
            this.vx = spec.advanceSpeed * this.facing;
            AUDIO.sfxSwordSlash();
          } else if (spec.skillStyle === 'VIKING_SHIELD') {
            this.vx = 0;
            this.shieldHp = spec.shieldHp;
            this.shieldMaxHp = spec.shieldHp;
            this.shieldTimer = spec.shieldDuration;
            VFX.shockwaves.push({
              x: this.x,
              y: this.y - 72,
              radius: 14,
              maxRadius: 88,
              life: 16,
              maxLife: 16,
              color: '#22d3ee'
            });
            VFX.spawnHitSparks(this.x, this.y - 72, '#34d399', 16, 1.0);
            VFX.spawnFloatingText(this.x, this.y - 158, '룬 보호막!', '#22d3ee');
            AUDIO.sfxShieldCast();
          } else if (spec.skillStyle === 'NINJA_TRIPLE_SHURIKEN') {
            if (this.isGrounded() && spec.hopVelY && this.rootTimer <= 0) {
              this.vy = spec.hopVelY;
              this.y -= 2;
              this.vx = -2.2 * this.facing;
            }
            AUDIO.sfxWhiff();
          } else if (spec.skillStyle === 'TAOIST_VINES') {
            this.vx *= 0.2;
            const targetX = this.opponent ? this.opponent.x : (this.x + this.facing * 180);
            VFX.spawnVineTrap(this, this.opponent, targetX, spec);
            VFX.spawnHitSparks(this.x + this.facing * 36, this.y - 96, '#34d399', 10, 0.75);
            AUDIO.sfxVineBind();
          } else if (spec.skillStyle === 'KNIGHT_SHIELD_GUARD') {
            this.vx = 0;
            this.knightShieldDir = this.facing;
            this.knightShieldTimer = spec.guardDuration;
            this.knightShieldMaxTimer = spec.guardDuration;
            const sideLabel = this.knightShieldDir === 1 ? '우측 방패 방어!' : '좌측 방패 방어!';
            VFX.spawnGuardSparks(this.x + this.knightShieldDir * 34, this.y - 84);
            VFX.spawnFloatingText(this.x, this.y - 158, sideLabel, '#38bdf8');
            AUDIO.sfxShieldCast();
          } else {
            this.vx *= 0.2;
          }
          return;
        }

        // Skill 2 Variants
        if (type === 'SKILL2') {
          if (spec.skillStyle === 'BEG_PLEAD') {
            this.cooldowns.SKILL2=spec.cooldown;this.gainUlt(spec.ultGainOnCast||0);
            this.begPleadTimer=spec.buffDuration;
            VFX.spawnFloatingText(this.x,this.y-170,'구걸 중! 공격을 회복으로', '#4ade80');
            AUDIO.sfxShieldCast();return;
          }
          if (spec.skillStyle === 'GAMBLE_COPY') {
            this.cooldowns.SKILL2=spec.cooldown;
            VFX.spawnFloatingText(this.x,this.y-155,'상대 기술 복사!','#fde047');
            return;
          }
          if (spec.skillStyle === 'TKD_DEF_RANGE_BUFF') {
            this.cooldowns.SKILL2 = spec.cooldown;
            if (spec.ultGainOnCast) this.gainUlt(spec.ultGainOnCast);
            this.vx *= 0.25;
            this.tkdDefTimer = spec.buffDuration || 360;
            this.tkdDefMaxTimer = spec.buffDuration || 360;
            this.tkdAtkDefTimer = 0;
            this.tkdRangeTimer = spec.buffDuration || 360;
            this.tkdRangeMaxTimer = spec.buffDuration || 360;
            VFX.shockwaves.push({
              x: this.x, y: this.y - 72, radius: 14, maxRadius: 88,
              life: 15, maxLife: 15, color: '#38bdf8'
            });
            VFX.spawnHitSparks(this.x, this.y - 76, '#38bdf8', 15, 0.95);
            VFX.spawnFloatingText(this.x, this.y - 160, '방어력·사거리 증가!', '#38bdf8');
            AUDIO.sfxShieldCast();
            return;
          }

          if (spec.skillStyle === 'WEREWOLF_SKILL2') {
            if (this.isWerewolf) {
              // Werewolf Form Skill 2: Predator Bite (Root + Damage + Lifesteal)
              this.cooldowns.SKILL2 = spec.wolfCooldown || 150;
              if (spec.lungeX && this.isGrounded() && this.rootTimer <= 0) {
                this.vx = spec.lungeX * this.facing;
              }
              VFX.spawnWolfBiteVFX(this.x + this.facing * 58, this.y - 88, this.facing, this.accentColor);
              AUDIO.sfxWolfBite();
            } else {
              // Human Form Skill 2: Timing-Based Parry Stance
              this.cooldowns.SKILL2 = spec.cooldown || 95;
              this.vx = 0;
              VFX.spawnGlint(this.x + this.facing * 24, this.y - 94, '#fde047');
              AUDIO.sfxSwordSlash();
            }
            return;
          }

          // AI Robot missiles are launched by the startup-frame trigger below.
          // Do not use the generic uppercut fallback: this skill has no launchVelX/Y.
          if (spec.skillStyle === 'AI_MISSILES') {
            this.cooldowns.SKILL2 = spec.cooldown;
            this.vx = 0;
            VFX.spawnFloatingText(this.x, this.y - 158, '유도 미사일 발사!', '#67e8f9');
            VFX.spawnHitSparks(this.x + this.facing * 30, this.y - 96, '#22d3ee', 14, 0.9);
            AUDIO.sfxWhiff();
            return;
          }

          this.cooldowns.SKILL2 = spec.cooldown;
          this.invulnTimer = spec.invulnFrames || 0;

          if (spec.skillStyle === 'SONG_EVASION_BUFF') {
            this.vx = 0;
            this.songDodgeTimer = spec.buffDuration || 300;
            this.songDodgeMaxTimer = spec.buffDuration || 300;
            VFX.spawnFloatingText(this.x, this.y - 158, '50% 회피 태세!', '#fb923c');
            AUDIO.sfxBuffAwaken();
          } else if (spec.skillStyle === 'REAPER_SUMMON') {
            this.vx = 0;
            if (this.soulCount <= 0) {
              this.cooldowns.SKILL2 = 15;
              VFX.spawnFloatingText(this.x, this.y - 158, '영혼 부족!', this.accentColor);
              AUDIO.sfxWhiff();
            } else {
              const summonCount = Math.min(3, this.soulCount);
              this.soulCount = 0;
              GAME.spawnReaperGhosts(this, summonCount, spec);
              VFX.shockwaves.push({
                x: this.x,
                y: this.y - 78,
                radius: 14,
                maxRadius: 95,
                life: 16,
                maxLife: 16,
                color: this.accentColor
              });
              VFX.spawnHitSparks(this.x, this.y - 84, this.accentColor, 18, 1.05);
              VFX.spawnFloatingText(this.x, this.y - 162, `유령 ${summonCount}마리 소환!`, this.accentColor);
              AUDIO.sfxGhostSummon();
            }
          } else if (spec.skillStyle === 'HUNTER_AMMO') {
            this.hunterAmmoTimer=spec.buffDuration;
            VFX.spawnFloatingText(this.x,this.y-160,'특수 탄약 장전! 6초 강화','#fbbf24');
            VFX.spawnHitSparks(this.x,this.y-100,'#fbbf24',15,1);
            AUDIO.sfxBuffAwaken();
          } else if (spec.skillStyle === 'PIRATE_FLAG_BUFF') {
            this.vx = 0;
            this.pirateBuffTimer = spec.buffDuration || 360;
            this.pirateBuffMaxTimer = spec.buffDuration || 360;
            VFX.shockwaves.push({
              x: this.x,
              y: this.y - 84,
              radius: 16,
              maxRadius: 96,
              life: 16,
              maxLife: 16,
              color: '#ef4444'
            });
            VFX.spawnHitSparks(this.x, this.y - 110, '#fde047', 16, 1.0);
            VFX.spawnFloatingText(this.x, this.y - 162, '해적기! 속도·데미지 증가!', '#fde047');
            AUDIO.sfxBuffAwaken();
          } else if (spec.skillStyle === 'SAMURAI_IAIDO') {
            this.vx = 0;
            VFX.spawnGlint(this.x - this.facing * 12, this.y - 68, this.accentColor);
            AUDIO.sfxIaidoGlint();
          } else if (spec.skillStyle === 'VIKING_GIANT_AXE') {
            if (spec.lungeX && this.isGrounded()) this.vx = spec.lungeX * this.facing;
            VFX.spawnHitSparks(this.x, this.y - 135, '#fbbf24', 14, 1.0);
            AUDIO.sfxUppercut();
          } else if (spec.skillStyle === 'NINJA_LONG_DASH') {
            this.vx = spec.dashVelX * this.facing;
            VFX.spawnDust(this.x, this.y, this.facing);
            AUDIO.sfxUppercut();
          } else if (spec.skillStyle === 'POSEIDON_WAVE') {
            this.vx *= 0.2;
            AUDIO.sfxWindGust();
          } else if (spec.skillStyle === 'TAOIST_TORNADO') {
            this.vx *= 0.2;
            AUDIO.sfxWindGust();
          } else if (spec.skillStyle === 'KNIGHT_GIANT_SWORD') {
            if (spec.lungeX && this.isGrounded() && this.rootTimer <= 0) {
              this.vx = spec.lungeX * this.facing;
            }
            VFX.spawnHitSparks(this.x, this.y - 130, '#fde047', 12, 0.95);
            AUDIO.sfxSwordSlash();
          } else {
            this.vx = spec.launchVelX * this.facing;
            this.vy = spec.launchVelY;
            this.y -= 4;
            VFX.spawnDust(this.x, CONFIG.GROUND_Y, this.facing);
            AUDIO.sfxUppercut();
          }
          return;
        }

        // Ultimate Variants
        if (type === 'ULTIMATE') {
          this.ult = 0;

          if (spec.ultStyle === 'BEG_COIN_RAIN') {
            this.begCoinRainTimer=spec.rainDuration;this.begCoinRainTick=0;this.begCoins=[];
            VFX.spawnFloatingText(this.x,this.y-180,'동전 폭우!', '#fde047');
            AUDIO.sfxUltimateFlash();return;
          }
          if (spec.ultStyle === 'GAMBLE_FLIP') {
            this.vx=0;this.vy=0;
            GAME.gambleFlip={owner:this,frames:115,result:Math.random()<.5?'HEADS':'TAILS',resolved:false};
            AUDIO.sfxUltimateFlash();return;
          }
          // AI Robot Ultimate: explicitly trigger evolution/overload and its visual feedback.
          if (spec.ultStyle === 'AI_EVOLVE') {
            this.vx = 0;
            this.vy = 0;
            this.invulnTimer = Math.max(this.invulnTimer, spec.flashFrames + spec.startup + spec.active + 6);
            VFX.triggerSuperFlash(this.accentColor, `${this.name}`);
            VFX.triggerHitstop(spec.flashFrames || 12);
            VFX.triggerScreenFlash(this.aiOverloadTimer > 0 ? '#fb7185' : '#fbbf24', 0.42);
            VFX.spawnHitSparks(this.x, this.y - 95, this.aiOverloadTimer > 0 ? '#fb7185' : '#fbbf24', 28, 1.45);
            AUDIO.sfxUltimateFlash();
            AUDIO.sfxBuffAwaken();
            return;
          }
          if (spec.ultStyle === 'POSEIDON_JUDGMENT') {
            this.poseidonJudgmentShield = spec.shieldHp;
            this.poseidonJudgmentMaxShield = spec.shieldHp;
            this.poseidonKrakenStrikesLeft = spec.krakenStrikes || 8;
            this.poseidonJudgmentTimer = this.poseidonKrakenStrikesLeft * (spec.strikeInterval || 58);
            this.poseidonKrakenTargetX = this.opponent ? this.opponent.x : this.x;
            this.poseidonKrakenWarning = 0;
            VFX.shockwaves.push({x:this.x,y:this.y-75,radius:20,maxRadius:150,life:22,maxLife:22,color:'#67e8f9'});
            VFX.spawnFloatingText(this.x,this.y-166,'크라켄 강림! 경고 지점을 피해라!', '#67e8f9');
            AUDIO.sfxShieldCast();
            return;
          }
          // Taekwondo Ultimate: Heal + Knock Nearby Enemy Back + Belt Promotion!
          if (spec.ultStyle === 'TKD_PROMOTE') {
            this.vx = 0;
            this.invulnTimer = Math.max(this.invulnTimer, 24);
            const prevHp = this.hp;
            this.hp = Math.min(this.maxHp, this.hp + (spec.healAmount || 120));
            const healed = Math.round(this.hp - prevHp);

            const wasMaxRank = this.beltRank >= 4;
            this.beltRank = Math.min(4, this.beltRank + 1);

      updateAttackState(opponent, projectiles, canControl) {
        const spec = this.attacks[this.attackType];
        const frames = this.getEffectiveFrames(spec);
        this.stateTimer++;

        // 1. Combo & Special Cancel Checks
        if (canControl && spec.canCancelInto) {
          const c = this.controls;
          const inCancelWindow = this.stateTimer >= frames.startup &&
                                 this.stateTimer <= frames.startup + frames.active + 7;

          if (inCancelWindow) {
            if (spec.canCancelInto.includes('ULTIMATE') &&
                INPUT.wasPressed(c.ultimate) && this.ult >= CONFIG.MAX_ULT && !(this.aiSealTimer>0 && this.aiSealSlot==='ULTIMATE')) {
              this.startAttack('ULTIMATE', projectiles);
              return;
            }
            if (spec.canCancelInto.includes('SKILL2') &&
                INPUT.wasPressed(c.skill2) && this.cooldowns.SKILL2 <= 0 && !(this.aiSealTimer>0 && this.aiSealSlot==='SKILL2')) {
              this.startAttack('SKILL2', projectiles);
              return;
            }
            if (spec.canCancelInto.includes('SKILL1') &&
                INPUT.wasPressed(c.skill1) && this.cooldowns.SKILL1 <= 0 && !(this.aiSealTimer>0 && this.aiSealSlot==='SKILL1')) {
              const blockedByStickman = this.jobId === 'STICKMAN' && projectiles.some((p) => p.owner === this && p.active);
              const blockedByReaper = this.jobId === 'REAPER' && this.hasActiveBoomerang();
              if (!blockedByStickman && !blockedByReaper) {
                this.startAttack('SKILL1', projectiles);
                return;
              }
            }
            if (INPUT.wasPressed(c.normal)) {
              if (this.isPirateGunActive() && spec.canCancelInto.includes('PIRATE_GUN_SHOT')) {
                this.startAttack('PIRATE_GUN_SHOT', projectiles);
                return;
              }

                this.startAttack(spec.nextNormal, projectiles);
                return;
              }
