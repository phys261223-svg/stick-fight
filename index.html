          if (proj.visualType === 'POSEIDON_WAVE') {
            ctx.save();
            ctx.translate(proj.x,proj.y);
            ctx.scale(proj.facing*1.25,.78);
            const shimmer=Math.sin(proj.age*.18);
            ctx.shadowColor='#38bdf8';ctx.shadowBlur=19;
            const g=ctx.createLinearGradient(-55,-45,55,45);
            g.addColorStop(0,'rgba(3,105,161,0.5)');
            g.addColorStop(.5,'rgba(6,182,212,0.85)');
            g.addColorStop(1,'rgba(224,242,254,0.96)');
            ctx.fillStyle=g;ctx.strokeStyle='#a5f3fc';ctx.lineWidth=4;
            ctx.beginPath();ctx.moveTo(-55,42);
            ctx.bezierCurveTo(-58,-22,-22,-64,13,-46);
            ctx.bezierCurveTo(44,-32,17,-12,57,-17);
            ctx.bezierCurveTo(53,7,48,31,54,42);
            ctx.closePath();ctx.fill();ctx.stroke();
            ctx.shadowBlur=0;
            ctx.strokeStyle='rgba(240,249,255,0.85)';ctx.lineWidth=3;
            ctx.beginPath();ctx.moveTo(-47,8);
            ctx.bezierCurveTo(-38,-47,-8,-53,13,-37);
            ctx.quadraticCurveTo(27,-22,46,-25);ctx.stroke();
            for(let i=0;i<11;i++){
              const bx=-48+i*10+Math.sin(proj.age*.13+i)*5;
              const by=-42+Math.sin(proj.age*.21+i*1.8)*12+(i%3)*8;
              ctx.fillStyle=i%3===0?'#f0f9ff':'rgba(165,243,252,0.8)';
              ctx.beginPath();ctx.arc(bx,by,2.5+i%3,0,Math.PI*2);ctx.fill();
            }
            ctx.strokeStyle='rgba(103,232,249,0.5)';ctx.lineWidth=2;
            for(let i=0;i<3;i++){
              ctx.beginPath();ctx.moveTo(-78-i*12,15+i*11);
              ctx.quadraticCurveTo(-62-i*9,8+i*10+shimmer*3,-40-i*6,18+i*9);ctx.stroke();
            }
            ctx.restore();ctx.restore();continue;
          }
          if (proj.visualType === 'TKD_KI_WAVE') {
            for (let i = 0; i < proj.trail.length; i++) {
              const pt = proj.trail[i];
              const ratio = (i + 1) / proj.trail.length;
              ctx.globalAlpha = ratio * 0.42;
              ctx.fillStyle = '#fbbf24';
              ctx.beginPath();
              ctx.arc(pt.x, pt.y, proj.radius * ratio * 0.9, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.translate(proj.x, proj.y);
            ctx.scale(proj.facing, 1);

            const kiGrad = ctx.createRadialGradient(0, 0, 4, 0, 0, proj.radius + 10);
            kiGrad.addColorStop(0, '#ffffff');
            kiGrad.addColorStop(0.45, '#fde047');
            kiGrad.addColorStop(0.8, '#0f172a');
            kiGrad.addColorStop(1, 'rgba(251, 191, 36, 0)');
            ctx.fillStyle = kiGrad;
            ctx.beginPath();
            ctx.arc(0, 0, proj.radius + 10, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#fde047';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(-4, 0, proj.radius, -1.1, 1.1);
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(4, 0, proj.radius * 0.45, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            continue;
          }

          if (proj.visualType === 'PIRATE_BULLET') {
            for (let i = 0; i < proj.trail.length; i++) {
              const pt = proj.trail[i];
              const ratio = (i + 1) / proj.trail.length;
              ctx.globalAlpha = ratio * 0.45;
              ctx.fillStyle = '#fb923c';
              ctx.beginPath();
              ctx.arc(pt.x, pt.y, proj.radius * ratio * 0.85, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#fde047';
            ctx.shadowBlur = 14;
            ctx.shadowColor = '#f97316';
            ctx.beginPath();
            ctx.ellipse(proj.x, proj.y, 16, 7, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(proj.x + proj.facing * 5, proj.y, 4.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            continue;
          }

          if (proj.visualType === 'WIND_GUST') {
            ctx.translate(proj.x, proj.y);
            ctx.scale(proj.facing, 1);
            ctx.strokeStyle = '#6ee7b7';
            ctx.lineWidth = 5;
            ctx.shadowBlur = 16;
            ctx.shadowColor = '#10b981';
            for (let w = -1; w <= 1; w++) {
              ctx.beginPath();
              ctx.arc(-8, w * 14, 24 - Math.abs(w) * 4, -0.9, 0.9);
              ctx.stroke();
            }
            ctx.restore();
            continue;
          }

          if (proj.visualType === 'TORNADO') {
            ctx.translate(proj.x, proj.y);
            const sway = Math.sin(proj.age * 0.45) * 5;
            ctx.strokeStyle = '#34d399';
            ctx.lineWidth = 3.5;
            ctx.shadowBlur = 14;
            ctx.shadowColor = '#10b981';
            for (let ring = 0; ring < 4; ring++) {
              const ry = 22 - ring * 14;
              const rx = 10 + ring * 6;
              ctx.beginPath();
              ctx.ellipse(sway * (ring * 0.3), ry, rx, 5, 0, 0, Math.PI * 2);
              ctx.stroke();
            }
            ctx.restore();
            continue;
          }

          if (proj.visualType === 'CRESCENT') {
            ctx.translate(proj.x, proj.y);
            ctx.scale(proj.facing, 1);
            ctx.fillStyle = proj.color;
            ctx.shadowBlur = 18;
            ctx.shadowColor = proj.color;
            ctx.beginPath();
            ctx.arc(0, 0, proj.radius, -1.15, 1.15, false);
            ctx.quadraticCurveTo(proj.radius * 0.35, 0, Math.cos(-1.15) * proj.radius, Math.sin(-1.15) * proj.radius);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
            continue;
          }

          if (proj.visualType === 'SHURIKEN') {
            ctx.translate(proj.x, proj.y);
            ctx.rotate(proj.rotation);
            ctx.fillStyle = '#e2e8f0';
            ctx.strokeStyle = proj.color;
            ctx.lineWidth = 2;
            const r = proj.radius;
            ctx.beginPath();
            for (let k = 0; k < 4; k++) {
              const a = (k * Math.PI) / 2;
              ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
              ctx.lineTo(Math.cos(a + 0.45) * (r * 0.32), Math.sin(a + 0.45) * (r * 0.32));
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
            continue;
          }

          if (proj.visualType === 'KUNAI') {
            ctx.translate(proj.x, proj.y);
            ctx.rotate(proj.rotation);
            ctx.fillStyle = '#f8fafc';
            ctx.strokeStyle = proj.color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(22, 0);
            ctx.lineTo(-8, -7);
            ctx.lineTo(-4, 0);
            ctx.lineTo(-8, 7);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
            continue;
          }

          if (proj.visualType === 'BASKETBALL') {
            for (let i = 0; i < proj.trail.length; i++) {
              const pt = proj.trail[i];
              const ratio = (i + 1) / proj.trail.length;
              ctx.globalAlpha = ratio * 0.35;
              ctx.fillStyle = proj.threePointAwarded ? '#fde047' : '#fb923c';
              ctx.beginPath();
              ctx.arc(pt.x, pt.y, proj.radius * ratio * 0.85, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.translate(proj.x, proj.y);
            ctx.rotate(proj.rotation);
            if (proj.threePointAwarded) {
              ctx.shadowBlur = 18;
              ctx.shadowColor = '#fde047';
            }
            ctx.fillStyle = '#ea580c';
            ctx.strokeStyle = '#090d16';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.arc(0, 0, proj.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-proj.radius, 0);
            ctx.lineTo(proj.radius, 0);
            ctx.moveTo(0, -proj.radius);
            ctx.lineTo(0, proj.radius);
            ctx.stroke();
            ctx.restore();
            continue;
          }

          // Classic Stickman Fireball (UNTOUCHED)
          for (let i = 0; i < proj.trail.length; i++) {
            const pt = proj.trail[i];
            const ratio = (i + 1) / proj.trail.length;
            ctx.globalAlpha = ratio * 0.38;
            ctx.fillStyle = proj.color;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, proj.radius * ratio * 0.85, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.globalAlpha = 1;
          const grad = ctx.createRadialGradient(proj.x, proj.y, 4, proj.x, proj.y, proj.radius + 8);
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.45, proj.color);
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(proj.x, proj.y, proj.radius + 8, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(proj.x + proj.facing * 4, proj.y, proj.radius * 0.48, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }
      },

      drawUltimateBeam(ctx, fighter) {
        const beam = fighter.getUltimateBeamBox();
        if (!beam) return;

        ctx.save();
        const pulse = Math.sin(fighter.stateTimer * 0.9) * 8;
        const centerY = beam.y + beam.height / 2;

        const outerGrad = ctx.createLinearGradient(0, centerY - 52, 0, centerY + 52);
        outerGrad.addColorStop(0, 'rgba(0,0,0,0)');
        outerGrad.addColorStop(0.25, fighter.accentColor);
        outerGrad.addColorStop(0.5, '#ffffff');
        outerGrad.addColorStop(0.75, fighter.accentColor);
        outerGrad.addColorStop(1, 'rgba(0,0,0,0)');

        ctx.fillStyle = outerGrad;
        ctx.fillRect(beam.x, centerY - (48 + pulse), beam.width, (48 + pulse) * 2);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(beam.x, centerY - (18 + pulse * 0.4), beam.width, (18 + pulse * 0.4) * 2);

        const muzzleX = fighter.facing === 1 ? fighter.x + 36 : fighter.x - 36;
        ctx.beginPath();
        ctx.arc(muzzleX, centerY, 46 + pulse, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();

        ctx.restore();
      },

      drawVFX(ctx) {
        for (const s of VFX.shockwaves) {
          const alpha = s.life / s.maxLife;
          ctx.save();
          ctx.globalAlpha = alpha * 0.85;
          ctx.strokeStyle = s.color;
          ctx.lineWidth = 5 * alpha;
          ctx.shadowColor = s.color;
          ctx.shadowBlur = 16 * alpha;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        for (const p of VFX.particles) {
          const alpha = p.life / p.maxLife;
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          if (p.glyph) {
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation || 0) + (1 - alpha) * 0.55);
            ctx.font = `900 ${p.size}px "Noto Sans KR", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 14 * alpha;
            ctx.fillText(p.glyph, 0, 0);
          } else if (p.spark) {
            ctx.translate(p.x, p.y);
            ctx.rotate(Math.atan2(p.vy, p.vx));
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 10 * alpha;
            ctx.fillRect(-p.size * 1.8, -p.size * 0.5, p.size * 3.6, p.size);
          } else if (p.isRock) {
            ctx.fillRect(p.x - p.size * 0.5, p.y - p.size * 0.5, p.size, p.size);
          } else {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        for (const ft of VFX.floatingTexts) {
          const alpha = Math.min(1, (ft.life / ft.maxLife) * 1.4);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.font = '900 18px Orbitron, "Noto Sans KR", sans-serif';
          ctx.textAlign = 'center';
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#020617';
          ctx.strokeText(ft.text, ft.x, ft.y);
          ctx.fillStyle = ft.color;
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.restore();
        }
      },

      drawSuperFlashOverlay(ctx) {
        const sf = VFX.superFlash;
        const progress = 1 - sf.timer / CONFIG.ATTACKS.ULTIMATE.flashFrames;

        ctx.save();
        ctx.strokeStyle = sf.color;
        ctx.lineWidth = 3;
        ctx.globalAlpha = 0.65;
        for (let i = 0; i < 24; i++) {
          const angle = (i / 24) * Math.PI * 2 + progress * 0.8;
          const innerR = 140 + progress * 80;
          const outerR = 780;
          ctx.beginPath();
          ctx.moveTo(CONFIG.WIDTH / 2 + Math.cos(angle) * innerR, CONFIG.HEIGHT / 2 + Math.sin(angle) * innerR);
          ctx.lineTo(CONFIG.WIDTH / 2 + Math.cos(angle) * outerR, CONFIG.HEIGHT / 2 + Math.sin(angle) * outerR);
          ctx.stroke();
        }

        ctx.globalAlpha = 1;
        ctx.font = '900 44px Orbitron, "Noto Sans KR", sans-serif';
        ctx.textAlign = 'center';
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#020617';
        const label = `${sf.attackerName} · ULTIMATE!`;
        ctx.strokeText(label, CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2 - 40);
        ctx.fillStyle = '#fde047';
        ctx.fillText(label, CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2 - 40);
        ctx.restore();
      },

      drawHUD(ctx, game) {
        const { p1, p2, timer } = game;
        const barWidth = 460;
        const barHeight = 28;
        const topY = 26;

        // Top Center Timer Box
        ctx.save();
        ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(CONFIG.WIDTH / 2 - 48, topY - 6, 96, 54, 12);
        ctx.fill();
        ctx.stroke();

        ctx.font = '900 32px Orbitron, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = timer <= 15 ? '#f43f5e' : '#fde047';
        ctx.fillText(String(Math.ceil(timer)).padStart(2, '0'), CONFIG.WIDTH / 2, topY + 32);

        // P1 Health Bar (Left)
        this.drawHealthBar(ctx, {
          x: CONFIG.WIDTH / 2 - 64 - barWidth,
          y: topY,
          w: barWidth,
          h: barHeight,
          hp: p1.hp,
          displayHp: p1.displayHp,
          maxHp: p1.maxHp,
          shieldHp: p1.shieldHp,
          shieldMaxHp: p1.shieldMaxHp,
          alignRight: true,
          color: '#f43f5e',
          label: `${p1.name} · ${p1.job.name}`,
          roundsWon: p1.roundsWon,
          comboCount: p1.comboCount
        });

        // P2 Health Bar (Right)
        const p2Label = game.mode === 'PVE'
          ? `2P AI (${AI_CONTROLLER.getDifficultyLabel()}) · ${p2.job.name}`
          : `${p2.name} · ${p2.job.name}`;
        this.drawHealthBar(ctx, {
          x: CONFIG.WIDTH / 2 + 64,
          y: topY,
          w: barWidth,
          h: barHeight,
          hp: p2.hp,
          displayHp: p2.displayHp,
          maxHp: p2.maxHp,
          shieldHp: p2.shieldHp,
          shieldMaxHp: p2.shieldMaxHp,
          alignRight: false,
          color: '#38bdf8',
          label: p2Label,
          roundsWon: p2.roundsWon,
          comboCount: p2.comboCount
        });

        // Bottom Ultimate Bars & Cooldown / Buff / Ammo / Soul Indicators
        this.drawBottomMeters(ctx, p1, 44, CONFIG.HEIGHT - 36, false);
        this.drawBottomMeters(ctx, p2, CONFIG.WIDTH - 44 - 340, CONFIG.HEIGHT - 36, true);

        // Skill cooldown cards: larger, high-contrast timers for quick reading.
        const drawSkillCooldowns = (fighter, x, y, alignRight) => {
          const cardW = 112, cardH = 42, gap = 8;
          const items = [
            { key: 'SKILL1', label: '기술 1', color: '#38bdf8' },
            { key: 'SKILL2', label: '기술 2', color: '#c084fc' }
          ];
          items.forEach((item, i) => {
            const left = alignRight ? x - (cardW + gap) * (i + 1) : x + (cardW + gap) * i;
            const remaining = Math.max(0, fighter.cooldowns[item.key] || 0);
            const ready = remaining <= 0;
            const seconds = (remaining / 60).toFixed(1);
            ctx.fillStyle = 'rgba(2, 6, 23, 0.92)';
            ctx.strokeStyle = ready ? '#4ade80' : item.color;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.roundRect(left, y, cardW, cardH, 8); ctx.fill(); ctx.stroke();
            ctx.textAlign = 'center';
            ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
            ctx.fillStyle = '#e2e8f0';
            ctx.fillText(item.label, left + cardW / 2, y + 15);
            ctx.font = '900 17px Orbitron, "Noto Sans KR", sans-serif';
            ctx.fillStyle = ready ? '#4ade80' : '#fbbf24';
            ctx.fillText(ready ? '준비 완료' : `${seconds}초`, left + cardW / 2, y + 34);
          });
        };
        drawSkillCooldowns(p1, 44, CONFIG.HEIGHT - 100, false);
        drawSkillCooldowns(p2, CONFIG.WIDTH - 44, CONFIG.HEIGHT - 100, true);

        ctx.restore();
      },

      drawHealthBar(ctx, cfg) {
        const { x, y, w, h, hp, displayHp, maxHp, shieldHp, shieldMaxHp, alignRight, color, label, roundsWon, comboCount } = cfg;

        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.55)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, 8);
        ctx.fill();
        ctx.stroke();

        const damageW = (displayHp / maxHp) * (w - 4);
        ctx.fillStyle = '#f59e0b';
        if (alignRight) {
          ctx.fillRect(x + w - 2 - damageW, y + 2, damageW, h - 4);
        } else {
          ctx.fillRect(x + 2, y + 2, damageW, h - 4);
        }

        const hpW = (hp / maxHp) * (w - 4);
        ctx.fillStyle = hp / maxHp < 0.25 ? '#ef4444' : color;
        if (alignRight) {
          ctx.fillRect(x + w - 2 - hpW, y + 2, hpW, h - 4);
        } else {
          ctx.fillRect(x + 2, y + 2, hpW, h - 4);
        }

        // Viking Rune Shield Overlay Bar
        if (shieldHp > 0) {
          const shW = Math.min(w - 4, (shieldHp / (shieldMaxHp || 260)) * (w - 4) * 0.65);
          ctx.fillStyle = 'rgba(34, 211, 238, 0.85)';
          if (alignRight) {
            ctx.fillRect(x + w - 2 - shW, y + 2, shW, 8);
          } else {
            ctx.fillRect(x + 2, y + 2, shW, 8);
          }
        }

        ctx.font = '900 13px Orbitron, "Noto Sans KR", sans-serif';
        ctx.fillStyle = '#f8fafc';
        ctx.textAlign = alignRight ? 'left' : 'right';
        ctx.fillText(label, alignRight ? x : x + w, y + h + 18);

        for (let i = 0; i < CONFIG.ROUNDS_TO_WIN; i++) {
          const pipX = alignRight ? x + w - 12 - i * 24 : x + 12 + i * 24;
          const pipY = y + h + 13;
          ctx.beginPath();
          ctx.arc(pipX, pipY, 7, 0, Math.PI * 2);
          ctx.fillStyle = i < roundsWon ? '#fde047' : 'rgba(51, 65, 85, 0.8)';
          ctx.fill();
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }

        if (comboCount >= 2) {
          ctx.font = '900 22px Orbitron, sans-serif';
          ctx.textAlign = alignRight ? 'left' : 'right';
          ctx.fillStyle = '#fde047';
          ctx.fillText(`${comboCount} HIT COMBO!`, alignRight ? x : x + w, y + h + 50);
        }
      },

      drawBottomMeters(ctx, fighter, x, y, alignRight) {
        const w = 340;
        const h = 16;

        // Active Buff / Debuff / Resource Status Bar above Ultimate Meter
        let statusY = y - 24;
        if (fighter.jobId === 'TAEKWONDO') {
          const beltInfo = TKD_BELTS[Math.min(4, Math.max(0, fighter.beltRank || 0))];
          const unlockHint = beltInfo.rank === 0 ? '다음: 노랑띠' : (beltInfo.rank === 1 ? '해금: AA뒤돌려' : (beltInfo.rank === 2 ? '해금: 점프옆차기' : (beltInfo.rank === 3 ? '빨간띠' : '최고 단수')));
          ctx.font = '900 11.5px "Noto Sans KR", sans-serif';
          ctx.textAlign = alignRight ? 'right' : 'left';
          ctx.fillStyle = beltInfo.rank === 4 ? '#fde047' : beltInfo.color;
          ctx.fillText(`🥋 ${beltInfo.name} (${unlockHint})`, alignRight ? x + w : x, statusY);
          statusY -= 16;

          if (fighter.tkdRangeTimer > 0) {
            const ratio = fighter.tkdRangeTimer / fighter.tkdRangeMaxTimer;
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.fillRect(x, statusY, w, 7);
            ctx.fillStyle = '#fb923c';
            ctx.fillRect(alignRight ? x + w * (1 - ratio) : x, statusY, w * ratio, 7);
            statusY -= 12;
          }
          if (fighter.tkdDefTimer > 0) {
            const ratio = fighter.tkdDefTimer / fighter.tkdDefMaxTimer;
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.fillRect(x, statusY, w, 7);
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(alignRight ? x + w * (1 - ratio) : x, statusY, w * ratio, 7);
            statusY -= 12;
          }
          if (fighter.tkdAtkDefTimer > 0) {
            const ratio = fighter.tkdAtkDefTimer / fighter.tkdAtkDefMaxTimer;
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.fillRect(x, statusY, w, 7);
            ctx.fillStyle = '#f43f5e';
            ctx.fillRect(alignRight ? x + w * (1 - ratio) : x, statusY, w * ratio, 7);
            statusY -= 12;
          }
        }
        if (fighter.jobId === 'WEREWOLF') {
          const rageRatio = Math.max(0, Math.min(1, fighter.rage / (fighter.maxRage || 100)));
          ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
          ctx.fillRect(x, statusY, w, 9);
          ctx.fillStyle = fighter.isWerewolf ? '#f43f5e' : '#fb7185';
          ctx.fillRect(alignRight ? x + w * (1 - rageRatio) : x, statusY, w * rageRatio, 9);

    const originalApplyHit = COMBAT_ENGINE.applyHit.bind(COMBAT_ENGINE);

      if (defender && defender.jobId === 'SANTA' && defender.santaRideTimer > 0 && defender.santaRideHp > 0) {
        const absorbed = Math.min(defender.santaRideHp, Math.max(0,info.damage||0));
        defender.santaRideHp -= absorbed;
        info = {...info, damage:Math.max(0,(info.damage||0)-absorbed)};
        if(defender.santaRideTimer>0) info = {...info, damage:Math.round(info.damage*(defender.santaDefenseMult||0.85))};
        if (absorbed > 0) VFX.spawnHitSparks(defender.x,defender.y-95,'#fecaca',8,.7);
        if (defender.santaRideHp <= 0) {
          defender.santaRideTimer=0; defender.santaDamageMult=1; defender.santaDefenseMult=1; defender.santaSpeedMult=1;
          VFX.spawnFloatingText(defender.x,defender.y-175,'루돌독이 지쳤다! 탑승 종료','#fca5a5');
        }
      }
      const result = originalApplyHit(attacker,defender,info);
      if(result && result.connected && !result.guarded && attacker && defender){
        if(attacker.jobId==='PASTOR'){
          VFX.spawnHitSparks(defender.x,defender.y-82,'#fde68a',22,1.05);
          VFX.spawnFloatingText(defender.x,defender.y-145,'✦ 성스러운 타격 ✦','#fff7cc');

          VFX.spawnHitSparks(defender.x,defender.y-78,'#fbbf24',20,1.0);
          VFX.spawnFloatingText(defender.x,defender.y-145,'🎁 메리 크리스마스!','#fecaca');
        }
      }
      if (attacker && defender && attacker.jobId === 'SANTA' && attacker.santaSnowTimer > 0 && result && result.connected && !result.guarded) {
        attacker.santaFreezeMeter = (attacker.santaFreezeMeter||0) + (info.damage||0);
        if (attacker.santaFreezeMeter >= attacker.attacks.SKILL2.freezeThreshold && (defender.customFreeze||0) <= 0) {
          defender.customFreeze=attacker.attacks.SKILL2.freezeDuration; defender.vx=0; defender.vy=0;

    const applyHitBeforeBalance = COMBAT_ENGINE.applyHit.bind(COMBAT_ENGINE);
    COMBAT_ENGINE.applyHit = function(attacker, defender, info) {
      if (info && typeof info.damage === 'number' && info.damage > 0) {
        const scale = CHARACTER_DAMAGE_SCALE[attacker && attacker.jobId] || 0.92;
        info = {...info, damage: Math.max(1, Math.round(info.damage * scale))};
      }
      return applyHitBeforeBalance(attacker, defender, info);
    };

    // AI normal-chain nerf: first and second hits still deal damage/stun,

    const applyHitBeforeAiKnockbackTune = COMBAT_ENGINE.applyHit.bind(COMBAT_ENGINE);
    COMBAT_ENGINE.applyHit = function(attacker, defender, info) {
      if (GAME.mode === 'PVE' && attacker === GAME.p2 && info && !info.isSkill &&
          attacker && attacker.attackType && attacker.isNormalAttackType(attacker.attackType)) {
        const move = attacker.attacks && attacker.attacks[attacker.attackType];
        if (move && move.nextNormal) {
          info = {...info, knockbackX: 0, knockbackY: 0, knockdown: false};

      spawnReaperGhosts(owner, count, spec) {
        const opp = owner === this.p1 ? this.p2 : this.p1;

      updateReaperSouls() {
        const fighters = [this.p1, this.p2];

      },

                sourceX: g.x,
                isHeavy: false

          }
        }
      },

      handleRoundEnd() {
        this.phase = 'ROUND_OVER';
        this.phaseTimer = 110;
        this.projectiles = [];
        this.boomerangScythes = [];
        this.reaperSouls = [];
        this.reaperGhosts = [];

        if (this.battleType === 'SWITCH') {
          const hp1 = this.teams.P1.reduce((sum, f) => sum + Math.max(0, f.hp), 0);

    roomSeed: 123456,
    lastSeededRound: -1,

    // Redundant input history (last 3 frames) for packet-loss immunity
    localHistory: [],
    remoteAppliedTick: -1,
    remoteDownMask: 0,
    remotePressedQueue: [],
    remoteDoubleQueue: [],

    // Guest physical key tracking (WASD + HJKL)
    guestPhysicalDown: new Set(),
    guestPhysicalPressed: new Set(),
    guestPhysicalDouble: new Set(),

    // Latest authoritative snapshot from Host
    latestSnapshot: null,
    unsubCallbacks: [],

    init() {
      this.injectUI();
      this.bindGuestPhysicalKeys();
      this.patchGameLoopAndInput();
      this.patchCanvasSelectClick();
      this.patchOnlineSelectionFlow();
      window.addEventListener('beforeunload', () => this.leaveRoom(true));
    },

    getDb() {
      if (this.db) return this.db;
      if (typeof firebase === 'undefined' || !firebase.database) return null;
      const cfg = window.OD_FIREBASE_CONFIG || {};
      const dbUrl = cfg.databaseURL || `https://${cfg.projectId}-default-rtdb.firebaseio.com`;
      try {
        this.db = firebase.app().database(dbUrl);
      } catch (e) {
        this.db = firebase.database();
      }
      return this.db;
    },

    getCurrentUser() {
      const auth = window.OD && window.OD.auth;
      const u = auth ? auth.current() : (typeof firebase !== 'undefined' && firebase.auth().currentUser);
      if (!u) return null;
      const name = auth && auth.label ? auth.label(u) : (u.displayName || 'PLAYER');
      return { uid: u.uid, name };
    },

    // =========================================================================

          navigator.clipboard.writeText(this.roomCode);

        }

      document.getElementById('omLeaveBtn').addEventListener('click', () => this.leaveRoom(false));
    },

    setStatus(msg, color = '#fde047') {
      const el = document.getElementById('omStatus');
      if (el) {
        el.textContent = msg || '';
        el.style.color = color;
      }
    },

    openModal() {
      const user = this.getCurrentUser();
      if (!user) {
        alert('먼저 Firebase 계정으로 로그인해 주세요!');
        return;
      }
      const db = this.getDb();
      if (!db) {
        alert('Firebase Realtime Database SDK가 로드되지 않았습니다.');
        return;
      }
      document.getElementById('onlineModal').hidden = false;
      this.updateModalView();
      if (!this.active) {
        this.subscribeRoomList();
      }
    },

    updateModalView() {
      const lobby = document.getElementById('omLobbyView');
      const activeView = document.getElementById('omActiveView');
      const pingBadge = document.getElementById('onlinePingBadge');
      const btnOnline = document.getElementById('btnOnline');

      if (this.active) {
        lobby.hidden = true;
        activeView.hidden = false;
        document.getElementById('omDisplayCode').textContent = this.roomCode || '----';
        if (btnOnline) btnOnline.textContent = `🌐 방 [${this.roomCode}]`;
        if (pingBadge) {
          pingBadge.classList.remove('hidden');
          pingBadge.textContent = this.transport === 'P2P'
            ? `P2P 직결 · ${this.pingMs || 12}ms`
            : `연결 중 (${this.transport})`;
        }
      } else {
        lobby.hidden = false;
        activeView.hidden = true;
        if (btnOnline) btnOnline.textContent = '🌐 온라인 대전';
        if (pingBadge) pingBadge.classList.add('hidden');
      }
    },

    // =========================================================================
    // 2. ROOM CREATION, LISTING & JOINING (Firebase Realtime Database)
    // =========================================================================
    generateRoomCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 4; i++) {
        code += chars[Math.floor(_origRandom() * chars.length)];
      }
      return code;
    },

    subscribeRoomList() {
      const db = this.getDb();
      if (!db) return;
      if (this.roomsListRef) this.roomsListRef.off();

      this.roomsListRef = db.ref('rooms').orderByChild('meta/createdAt').limitToLast(20);
      this.roomsListRef.on('value', (snap) => {
        const listEl = document.getElementById('omRoomList');
        const countEl = document.getElementById('omRoomCount');
        if (!listEl) return;

        const rooms = [];
        const now = Date.now();
        snap.forEach((child) => {
          const val = child.val();
          if (val && val.meta && val.meta.status === 'WAITING' && (now - (val.meta.createdAt || 0)) < 3600000) {
            rooms.push({ code: child.key, ...val.meta });
          }
        });
        rooms.reverse();
        countEl.textContent = `${rooms.length}개 방`;

        if (rooms.length === 0) {
          listEl.innerHTML = `<div class="text-center py-6 text-xs text-slate-500 font-bold">현재 대기 중인 방이 없습니다. 새 방을 만들어 보세요!</div>`;
          return;
        }

        listEl.innerHTML = rooms.map((r) => `
          <div class="om-room-item">
            <div class="min-w-0">
              <div class="text-xs font-black text-slate-100 truncate">${this.escapeHtml(r.title)}</div>
              <div class="text-[11px] font-bold text-slate-400">방장: ${this.escapeHtml(r.hostName)} · 코드 <span class="font-arcade text-amber-300">${r.code}</span></div>
            </div>
            <button type="button" data-join="${r.code}" class="px-3 py-1.5 rounded-lg text-xs font-black bg-emerald-500/25 hover:bg-emerald-500/35 text-emerald-200 border border-emerald-400/50 cursor-pointer shrink-0">
              입장
            </button>
          </div>
        `).join('');

        listEl.querySelectorAll('[data-join]').forEach((btn) => {
          btn.addEventListener('click', () => this.joinRoom(btn.dataset.join));
        });
      }, (err) => {
        this.setStatus('DB 연결 오류: Firebase 콘솔에서 Realtime Database와 보안 규칙을 확인해 주세요.', '#fb7185');
        console.error(err);
      });
    },

    escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    },

    async createRoom() {
      const user = this.getCurrentUser();
      const db = this.getDb();
      if (!user || !db) return;

      if (this.roomsListRef) {
        this.roomsListRef.off();
        this.roomsListRef = null;
      }

      const code = this.generateRoomCode();
      const rawTitle = document.getElementById('omRoomTitle').value.trim();
      const title = rawTitle || `${user.name}의 아케이드 결투장`;
      const seed = Math.floor(_origRandom() * 2147483646) + 1;

      this.role = 'HOST';
      this.roomCode = code;
      this.roomSeed = seed;
      this.active = true;
      this.transport = 'SIGNALING';
      this.resetNetBuffers();

      this.roomRef = db.ref(`rooms/${code}`);
      await this.roomRef.set({
        meta: {
          hostUid: user.uid,
          hostName: user.name,
          title,
          status: 'WAITING',
          seed,
          createdAt: firebase.database.ServerValue.TIMESTAMP
        },
        select: {
          p1Job: GAME.selectedJobs.P1,
          p1Locked: false,
          p2Job: GAME.selectedJobs.P2,
          p2Locked: false
        }
      });

      // Auto-delete room if host closes browser
      this.roomRef.onDisconnect().remove();

      this.updateModalView();
      this.setStatus('방이 생성되었습니다! 상대방 입장을 기다립니다...', '#4ade80');
      document.getElementById('omConnDetail').textContent = '상대방이 방에 들어오면 자동으로 P2P 직결됩니다...';

      // Wait for Guest to join
      const guestRef = this.roomRef.child('guest');
      const onGuest = guestRef.on('value', async (snap) => {
        const guest = snap.val();
        if (!guest || !guest.uid) return;
        guestRef.off('value', onGuest);

        document.getElementById('omConnDetail').textContent = `🎮 [${guest.name}] 님 입장! P2P 초저지연 연결 중...`;
        this.setStatus(`[${guest.name}] 님과 P2P 연결 수립 중...`, '#38bdf8');
        await this.roomRef.child('meta/status').set('PLAYING');
        await this.startWebRTCHost();
      });
      this.unsubCallbacks.push(() => guestRef.off('value', onGuest));
    },

    async joinRoom(code) {
      if (!code || code.length < 4) {
        this.setStatus('4자리 방 코드를 입력해 주세요.', '#fb7185');
        return;
      }
      const user = this.getCurrentUser();
      const db = this.getDb();
      if (!user || !db) return;

      const roomRef = db.ref(`rooms/${code}`);
      const snap = await roomRef.once('value');
      const data = snap.val();

      if (!data || !data.meta) {
        this.setStatus('존재하지 않는 방 코드입니다.', '#fb7185');
        return;
      }
      if (data.meta.status !== 'WAITING' || (data.guest && data.guest.uid !== user.uid)) {
        this.setStatus('이미 대전이 시작되었거나 정원이 가득 찬 방입니다.', '#fb7185');
        return;
      }

      if (this.roomsListRef) {
        this.roomsListRef.off();
        this.roomsListRef = null;
      }

      this.role = 'GUEST';
      this.roomCode = code;
      this.roomRef = roomRef;
      this.roomSeed = data.meta.seed || 123456;
      this.active = true;
      this.transport = 'SIGNALING';
      this.resetNetBuffers();

      const guestRef = roomRef.child('guest');
      guestRef.onDisconnect().remove();
      await guestRef.set({
        uid: user.uid,
        name: user.name,
        joinedAt: firebase.database.ServerValue.TIMESTAMP
      });

      this.updateModalView();
      document.getElementById('omConnDetail').textContent = `방장 [${data.meta.hostName}] 님과 P2P 연결 중...`;
      this.setStatus('P2P 초저지연 터널 연결 중...', '#38bdf8');

      await this.startWebRTCGuest();
    },

    async leaveRoom(silent = false) {
      this.unsubCallbacks.forEach((fn) => { try { fn(); } catch (e) {} });
      this.unsubCallbacks = [];

      if (this.pingTimer) {
        clearInterval(this.pingTimer);
        this.pingTimer = null;
      }
      if (this.dc) {
        try { this.dc.close(); } catch (e) {}
        this.dc = null;
      }
      if (this.pc) {
        try { this.pc.close(); } catch (e) {}
        this.pc = null;
      }

      if (this.roomRef) {
        try {
          if (this.role === 'HOST') {
            await this.roomRef.remove();
          } else if (this.role === 'GUEST') {
            await this.roomRef.child('guest').remove();
          }
        } catch (e) {}
        this.roomRef = null;
      }

      this.active = false;
      this.role = null;
      this.roomCode = null;
      this.transport = 'NONE';
      this.latestSnapshot = null;
      restoreRandom();

      if (!silent) {
        this.updateModalView();
        this.setStatus('온라인 방에서 퇴장했습니다.', '#94a3b8');
        this.subscribeRoomList();
      }
    },

    resetNetBuffers() {
      this.tick = 0;
      this.lastSeededRound = -1;
      this.localHistory = [];
      this.remoteAppliedTick = -1;
      this.remoteDownMask = 0;
      this.remotePressedQueue = [];
      this.remoteDoubleQueue = [];
      this.latestSnapshot = null;
    },

    // =========================================================================
    // 3. WEBRTC P2P DATA CHANNEL (UDP-like zero-lag transport)
    // =========================================================================
    setupPeerConnection() {
      const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
      this.pc = pc;

      const candPath = this.role === 'HOST' ? 'signal/hostCandidates' : 'signal/guestCandidates';
      pc.onicecandidate = (e) => {
        if (e.candidate && this.roomRef) {
          this.roomRef.child(candPath).push(e.candidate.toJSON());
        }
      };

      pc.onconnectionstatechange = () => {
        if (['disconnected', 'failed', 'closed'].includes(pc.connectionState)) {
          if (this.active && this.transport === 'P2P') {
            this.transport = 'RELAY';
            this.startFirebaseRelayFallback();
          }
        }
      };

      // Listen for peer ICE candidates
      const peerCandPath = this.role === 'HOST' ? 'signal/guestCandidates' : 'signal/hostCandidates';
      const peerCandRef = this.roomRef.child(peerCandPath);
      const onCand = peerCandRef.on('child_added', (snap) => {
        const cand = snap.val();
        if (cand && pc.remoteDescription) {
          pc.addIceCandidate(new RTCIceCandidate(cand)).catch(() => {});
        }
      });
      this.unsubCallbacks.push(() => peerCandRef.off('child_added', onCand));

      // Fallback timer: if strict firewall blocks WebRTC after 4.5s, switch to RTDB relay seamlessly
      setTimeout(() => {
        if (this.active && this.transport !== 'P2P') {
          this.transport = 'RELAY';
          this.startFirebaseRelayFallback();
          this.enterOnlineCharSelect();
        }
      }, 4500);

      return pc;
    },

    bindDataChannel(dc) {
      this.dc = dc;
      dc.binaryType = 'arraybuffer';

      dc.onopen = () => {
        this.transport = 'P2P';
        this.updateModalView();
        this.setStatus('⚡ P2P 초저지연 연결 완료! 캐릭터를 선택하세요.', '#4ade80');

        // Start 1-second ping measurement
        this.pingTimer = setInterval(() => {
          this.sendPacket({ t: 'PING', ts: performance.now() });
        }, 1000);

        this.enterOnlineCharSelect();
      };

      dc.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          this.handleNetMessage(msg);
        } catch (err) {}
      };
    },

    async startWebRTCHost() {
      const pc = this.setupPeerConnection();
      // Unordered + 0 retransmits = lowest possible latency (no TCP head-of-line blocking)
      const dc = pc.createDataChannel('stickfight-p2p', { ordered: false, maxRetransmits: 0 });
      this.bindDataChannel(dc);

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await this.roomRef.child('signal/offer').set({ type: offer.type, sdp: offer.sdp });

      const ansRef = this.roomRef.child('signal/answer');
      const onAns = ansRef.on('value', async (snap) => {
        const ans = snap.val();
        if (ans && !pc.currentRemoteDescription) {
          ansRef.off('value', onAns);
          await pc.setRemoteDescription(new RTCSessionDescription(ans));
        }
      });
      this.unsubCallbacks.push(() => ansRef.off('value', onAns));
    },

    async startWebRTCGuest() {
      const pc = this.setupPeerConnection();
      pc.ondatachannel = (e) => {
        this.bindDataChannel(e.channel);
      };

      const offerRef = this.roomRef.child('signal/offer');
      const onOffer = offerRef.on('value', async (snap) => {
        const offer = snap.val();
        if (offer && !pc.currentRemoteDescription) {
          offerRef.off('value', onOffer);
          await pc.setRemoteDescription(new RTCSessionDescription(offer));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          await this.roomRef.child('signal/answer').set({ type: answer.type, sdp: answer.sdp });
        }
      });
      this.unsubCallbacks.push(() => offerRef.off('value', onOffer));
    },

    // Automatic Firebase RTDB relay fallback if strict firewall blocks WebRTC UDP
    startFirebaseRelayFallback() {
      if (!this.roomRef) return;
      const mySlot = this.role === 'HOST' ? 'relay/host' : 'relay/guest';
      const peerSlot = this.role === 'HOST' ? 'relay/guest' : 'relay/host';
      this._relayOutRef = this.roomRef.child(mySlot);

      const inRef = this.roomRef.child(peerSlot);
      const onRelay = inRef.on('value', (snap) => {
        const msg = snap.val();
        if (msg) this.handleNetMessage(msg);
      });
      this.unsubCallbacks.push(() => inRef.off('value', onRelay));
    },

    sendPacket(obj) {
      if (!this.active) return;
      if (this.dc && this.dc.readyState === 'open') {
        try {
          this.dc.send(JSON.stringify(obj));
          return;
        } catch (e) {}
      }
      if (this.transport === 'RELAY' && this._relayOutRef) {
        this._relayOutRef.set(obj);
      }
    },

    // =========================================================================
    // 4. ONLINE CHARACTER SELECT & MATCH START SYNC
    // =========================================================================
    enterOnlineCharSelect() {
      const modal = document.getElementById('onlineModal');
      if (modal) modal.hidden = true;

      if (typeof GAME !== 'undefined') {
        GAME.mode = 'PVP';
        GAME.phase = 'CHAR_SELECT';
        GAME.selectLocked.P1 = false;
        GAME.selectLocked.P2 = false;

        const badge = document.getElementById('modeBadge');
        if (badge) badge.textContent = `ONLINE ${this.role === 'HOST' ? '1P (HOST)' : '2P (GUEST)'}`;
        const p2Foot = document.getElementById('p2FooterControls');
        if (p2Foot) {
          p2Foot.innerHTML = `<span class="font-arcade font-black text-emerald-400">ONLINE P2P</span> <span class="text-slate-300 font-bold">내 캐릭터 조작: <span class="kbd-pill">W A S D</span> 이동 · <span class="kbd-pill">H</span> 평타 <span class="kbd-pill">J</span> 기술1 <span class="kbd-pill">K</span> 기술2 <span class="kbd-pill">L</span> 궁극기</span>`;
        }
      }
    },

    syncCharSelectState() {
      if (!this.active || typeof GAME === 'undefined') return;
      if (this.role === 'HOST') {
        this.sendPacket({
          t: 'SEL',
          job: GAME.selectedJobs.P1,
          locked: GAME.selectLocked.P1,
          stage: GAME.pickStage,
          battleType: GAME.battleType
        });
      } else {
        this.sendPacket({
          t: 'SEL',
          job: GAME.selectedJobs.P2,
          locked: GAME.selectLocked.P2,
          stage: GAME.pickStage,
          battleType: GAME.battleType
        });
      }
    },

    handleNetMessage(msg) {
      if (!msg || !msg.t) return;

      if (msg.t === 'PING') {
        this.sendPacket({ t: 'PONG', ts: msg.ts });
        return;
      }
      if (msg.t === 'PONG') {
        this.pingMs = Math.max(1, Math.round(performance.now() - msg.ts));
        const badge = document.getElementById('onlinePingBadge');
        if (badge) badge.textContent = `P2P 직결 · ${this.pingMs}ms`;
        return;
      }

      if (msg.t === 'SEL' && typeof GAME !== 'undefined') {
        if (this.role === 'HOST') {
          GAME.selectedJobs.P2 = msg.job;
          GAME.selectedJobs.P2 = msg.job;
          GAME.selectLocked.P2 = Boolean(msg.locked);
        } else {
          GAME.selectedJobs.P1 = msg.job;
          GAME.selectLocked.P1 = Boolean(msg.locked);
        }
        if (Number.isInteger(msg.stage)) GAME.pickStage = msg.stage;
        if (msg.battleType === 'DUEL' || msg.battleType === 'SWITCH') GAME.battleType = msg.battleType;
        return;
      }

      if (msg.t === 'START_MATCH' && this.role === 'GUEST' && typeof GAME !== 'undefined') {
        GAME.selectedJobs = { P1: msg.jobs.P1, P2: msg.jobs.P2 };
        GAME.teamJobs = msg.teamJobs || { P1: [], P2: [] };
        GAME.pickStage = msg.pickStage || 0;
        GAME.battleType = msg.battleType || 'DUEL';
        GAME.selectLocked = { P1: true, P2: true };
        GAME.startMatch();
        return;
      }

      if (msg.t === 'REMATCH' && typeof GAME !== 'undefined') {
        this.resetNetBuffers();
        if (typeof GAME.startMatch === 'function') GAME.startMatch();
        return;
      }

      if (msg.t === 'GOTO_SELECT') {
        this.enterOnlineCharSelect();
        return;
      }

      if (msg.t === 'IN' && Array.isArray(msg.h)) {
        // Process redundant frames in chronological order
        for (let i = msg.h.length - 1; i >= 0; i--) {
          const item = msg.h[i];
          if (item.f > this.remoteAppliedTick) {
            this.remoteAppliedTick = item.f;
            this.remoteDownMask = item.d;
            if (item.p) this.remotePressedQueue.push(item.p);
            if (item.dt) this.remoteDoubleQueue.push(item.dt);
          }
        }
        return;
      }

      if (msg.t === 'SNAP' && this.role === 'GUEST') {
        this.latestSnapshot = msg;
      }
    },

    // =========================================================================
    // 5. INPUT BITMASK ENCODING & GUEST KEY TRANSLATION
    // =========================================================================
    bindGuestPhysicalKeys() {
      const KEY_TO_BIT = {
        KeyA: BIT.LEFT, KeyD: BIT.RIGHT, KeyW: BIT.UP, KeyS: BIT.DOWN,
        KeyH: BIT.NORMAL, KeyJ: BIT.SKILL1, KeyK: BIT.SKILL2, KeyL: BIT.ULTIMATE
      };
      const lastTap = new Map();

      window.addEventListener('keydown', (e) => {
        const bit = KEY_TO_BIT[e.code];
        if (!bit) return;
        if (this.active) e.preventDefault();
        if (!this.guestPhysicalDown.has(bit)) {
          this.guestPhysicalDown.add(bit);
          this.guestPhysicalPressed.add(bit);
          const now = performance.now();
          const prev = lastTap.get(bit) || 0;
          if (now - prev <= 240) {
            this.guestPhysicalDouble.add(bit);
            lastTap.set(bit, 0);
          } else {
            lastTap.set(bit, now);
          }
        }
      }, true);

      window.addEventListener('keyup', (e) => {
        const bit = KEY_TO_BIT[e.code];
        if (bit) this.guestPhysicalDown.delete(bit);
      }, true);

      window.addEventListener('blur', () => {
        this.guestPhysicalDown.clear();
        this.guestPhysicalPressed.clear();
        this.guestPhysicalDouble.clear();
      });
    },

    captureLocalInputPacket() {
      let down = 0, pressed = 0, dbl = 0;

      if (this.role === 'HOST') {
        // 방장은 자기 기기의 WASD+HJKL 입력을 P1 조작으로 변환한다.
        for (const [action, bit] of [
          ['left', BIT.LEFT], ['right', BIT.RIGHT], ['up', BIT.UP], ['down', BIT.DOWN],
          ['normal', BIT.NORMAL], ['skill1', BIT.SKILL1], ['skill2', BIT.SKILL2], ['ultimate', BIT.ULTIMATE]
        ]) {
          const code = ONLINE_LOCAL_KEYS[action];
          if (INPUT.isDown(code)) down |= bit;
          if (INPUT.wasPressed(code)) pressed |= bit;
          if ((action === 'left' || action === 'right') && INPUT.wasDoubleTapped(code)) dbl |= bit;
        }
        // 온라인 전용 입력을 기존 전투 로직의 P1 키 슬롯에 주입한다.
        this.applyBitmaskToInput(P1_KEYS, down, pressed, dbl, true);
      } else {
        // 게스트도 자기 기기의 WASD+HJKL을 P2 입력으로 변환한다.
        this.guestPhysicalDown.forEach((b) => { down |= b; });
        this.guestPhysicalPressed.forEach((b) => { pressed |= b; });
        this.guestPhysicalDouble.forEach((b) => { dbl |= b; });

        this.guestPhysicalPressed.clear();
        this.guestPhysicalDouble.clear();

        // Inject Guest's local inputs into P2_KEYS for 0ms local response
        this.applyBitmaskToInput(P2_KEYS, down, pressed, dbl, true);
      }

      // Inject remote player's inputs into the opposite slot
      const remoteTargetKeys = this.role === 'HOST' ? P2_KEYS : P1_KEYS;
      const rPressed = this.remotePressedQueue.length ? this.remotePressedQueue.shift() : 0;
      const rDouble = this.remoteDoubleQueue.length ? this.remoteDoubleQueue.shift() : 0;
      this.applyBitmaskToInput(remoteTargetKeys, this.remoteDownMask, rPressed, rDouble, true);

      this.localHistory.unshift({ f: this.tick, d: down, p: pressed, dt: dbl });
      if (this.localHistory.length > 3) this.localHistory.pop();

      this.sendPacket({ t: 'IN', h: this.localHistory });
    },

    applyBitmaskToInput(keyMap, downMask, pressedMask, doubleMask, clearFirst) {
      const pairs = [
        [BIT.LEFT, keyMap.left],
        [BIT.RIGHT, keyMap.right],
        [BIT.UP, keyMap.up],
        [BIT.DOWN, keyMap.down],
        [BIT.NORMAL, keyMap.normal],
        [BIT.SKILL1, keyMap.skill1],
        [BIT.SKILL2, keyMap.skill2],
        [BIT.ULTIMATE, keyMap.ultimate]
      ];
      for (const [bit, code] of pairs) {
        if (clearFirst) {
          INPUT.down.delete(code);
          INPUT.pressed.delete(code);
          INPUT.doubleTapped.delete(code);
        }
        if (downMask & bit) INPUT.down.add(code);
        if (pressedMask & bit) INPUT.pressed.add(code);
        if (doubleMask & bit) INPUT.doubleTapped.add(code);
      }
    },

    // =========================================================================
    // 6. 60HZ FIXED-STEP LOOP + SMOOTH STATE RECONCILIATION
    // =========================================================================
    patchGameLoopAndInput() {
      const self = this;
      const origRAF = window.requestAnimationFrame.bind(window);
      let lastStepTime = performance.now();
      let accumulator = 0;
      const FIXED_DT = 1000 / 60;

      // Normalize 60Hz/120Hz/144Hz monitors to identical 60FPS simulation during online play
      window.requestAnimationFrame = function (cb) {
        return origRAF(function (now) {
          if (!self.active || typeof GAME === 'undefined') {
            lastStepTime = now;
            accumulator = 0;
            return cb(now);
          }

          const dt = Math.min(50, now - lastStepTime);
          lastStepTime = now;
          accumulator += dt;

          if (accumulator < FIXED_DT * 0.85) {
            return window.requestAnimationFrame(cb);
          }
          accumulator %= FIXED_DT;

          self.preFrameSync();
          cb(now);
          self.postFrameSync();
        });
      };

      // Intercept Rematch / CharSelect buttons to keep both players synchronized
      const btnRematch = document.getElementById('btnRematch');
      if (btnRematch) {
        btnRematch.addEventListener('click', () => {
          if (this.active) {
            this.resetNetBuffers();
            this.sendPacket({ t: 'REMATCH' });
          }
        }, true);
      }
      const btnSelect = document.getElementById('btnSelect');
      if (btnSelect) {
        btnSelect.addEventListener('click', () => {
          if (this.active) {
            this.sendPacket({ t: 'GOTO_SELECT' });
          }
        }, true);
      }
    },

    preFrameSync() {
      if (typeof GAME === 'undefined') return;
      GAME.mode = 'PVP';

      // Seed PRNG identically on both machines at the start of every round
      if (GAME.phase === 'FIGHT' && this.lastSeededRound !== GAME.roundNumber) {
        this.lastSeededRound = GAME.roundNumber;
        setDeterministicSeed((this.roomSeed ^ (GAME.roundNumber * 2654435761)) >>> 0);
      }

      if (GAME.phase === 'CHAR_SELECT') {
        // Lock local player to only edit their own side in CHAR_SELECT
        if (this.role === 'HOST') {
          this._savedP2Job = GAME.selectedJobs.P2;
          this._savedP2Lock = GAME.selectLocked.P2;
        } else {
          this._savedP1Job = GAME.selectedJobs.P1;
          this._savedP1Lock = GAME.selectLocked.P1;
          // Allow Guest to navigate P2 roster with comfortable WASD + X as well
          if (INPUT.wasPressed('KeyA')) INPUT.pressed.add('ArrowLeft');
          if (INPUT.wasPressed('KeyD')) INPUT.pressed.add('ArrowRight');
          if (INPUT.wasPressed('KeyW')) INPUT.pressed.add('ArrowUp');
          if (INPUT.wasPressed('KeyS')) INPUT.pressed.add('ArrowDown');
          if (INPUT.wasPressed('KeyX')) INPUT.pressed.add('KeyK');
        }
        return;
      }

      this.tick++;
      this.captureLocalInputPacket();

      // Apply Host authoritative snapshot smoothly on Guest
      if (this.role === 'GUEST' && this.latestSnapshot) {
        this.applySnapshotSmoothly(this.latestSnapshot);
        this.latestSnapshot = null;
      }
    },

    postFrameSync() {
      if (typeof GAME === 'undefined') return;

      if (GAME.phase === 'CHAR_SELECT') {
        if (this.role === 'HOST' && this._savedP2Job) {
          GAME.selectedJobs.P2 = this._savedP2Job;
          GAME.selectLocked.P2 = this._savedP2Lock;
        } else if (this.role === 'GUEST' && this._savedP1Job) {
          GAME.selectedJobs.P1 = this._savedP1Job;
          GAME.selectLocked.P1 = this._savedP1Lock;
        }
        if (this.tick % 4 === 0) this.syncCharSelectState();
        this.tick++;
        return;
      }

      // Host broadcasts compact state snapshot every 6 frames (10Hz) for zero-drift consistency
      if (this.role === 'HOST' && this.tick % 6 === 0 && GAME.p1 && GAME.p2) {
        this.sendPacket({
          t: 'SNAP',
          f: this.tick,
          ph: GAME.phase,
          rt: GAME.roundTimer,
          rn: GAME.roundNumber,
          p1: this.packFighter(GAME.p1),
          p2: this.packFighter(GAME.p2)
        });
      }
    },

    packFighter(f) {
      return {
        x: Math.round(f.x * 10) / 10,
        y: Math.round(f.y * 10) / 10,
        vx: Math.round(f.vx * 100) / 100,
        vy: Math.round(f.vy * 100) / 100,
        fc: f.facing,
        hp: f.hp,
        ult: Math.round(f.ult * 10) / 10,
        st: f.state,
        at: f.attackType,
        tm: f.stateTimer,
        rw: f.roundsWon,
        br: f.beltRank || 0,
        ww: f.isWerewolf ? 1 : 0,
        rg: Math.round(f.rage || 0)
      };
    },

    applySnapshotSmoothly(snap) {
      if (!GAME.p1 || !GAME.p2) return;
      if (typeof snap.rt === 'number') GAME.roundTimer = snap.rt;

      const syncOne = (f, s) => {
        if (!s) return;
        const dx = s.x - f.x;
        const dy = s.y - f.y;
        // Smooth blend for tiny network jitter; instant snap only on teleports
        if (Math.abs(dx) > 65) f.x = s.x;
        else if (Math.abs(dx) > 3) f.x += dx * 0.35;

        if (Math.abs(dy) > 55) f.y = s.y;
        else if (Math.abs(dy) > 3) f.y += dy * 0.35;

        f.hp = s.hp;
        f.ult = s.ult;
        f.roundsWon = s.rw;
        f.beltRank = s.br;
        if (f.jobId === 'WEREWOLF') {
          f.isWerewolf = Boolean(s.ww);
          f.rage = s.rg;
        }
        if (s.st === 'KO' && f.state !== 'KO') {
          f.state = 'KO';
          f.hp = 0;
        }
      };

      syncOne(GAME.p1, snap.p1);
      syncOne(GAME.p2, snap.p2);
    },

    // Coordinate selection completion: only the host starts the match, then tells the guest.
    patchOnlineSelectionFlow() {
      if (this._selectionFlowPatched || typeof GAME === 'undefined') return;
      this._selectionFlowPatched = true;
      const originalFinish = GAME.finishSelection.bind(GAME);
      GAME.finishSelection = () => {
        if (!this.active) return originalFinish();
        if (this.role !== 'HOST') return; // Guest waits for the host's START_MATCH packet.
        if (!GAME.selectLocked.P1 || !GAME.selectLocked.P2) return;
        const beforePhase = GAME.phase;
        originalFinish();
        if (GAME.phase === 'CHAR_SELECT') {
          // SWITCH mode advances to its second pick; publish the new stage and unlocked state.
          this.syncCharSelectState();
          return;
        }
        if (beforePhase === 'CHAR_SELECT' && GAME.phase !== 'CHAR_SELECT') {
          this.sendPacket({
            t: 'START_MATCH',
            jobs: { P1: GAME.selectedJobs.P1, P2: GAME.selectedJobs.P2 },
            teamJobs: GAME.teamJobs,
            pickStage: GAME.pickStage,
            battleType: GAME.battleType
          });
        }
      };

      // The game's legacy click handler also edits both sides. Suppress it online;
      // NET.patchCanvasSelectClick owns all character-grid pointer input instead.
      const canvas = document.getElementById('gameCanvas');
      if (canvas) canvas.addEventListener('click', (e) => {
        if (this.active && GAME.phase === 'CHAR_SELECT') {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    },

    // Allow Host/Guest to click the center roster grid directly for their own character
    patchCanvasSelectClick() {
      const canvas = document.getElementById('gameCanvas');
      if (!canvas) return;

      canvas.addEventListener('pointerdown', (e) => {
        if (!this.active || typeof GAME === 'undefined' || GAME.phase !== 'CHAR_SELECT') return;
        e.stopImmediatePropagation();

        const rect = canvas.getBoundingClientRect();
        const mx = ((e.clientX - rect.left) / rect.width) * CONFIG.WIDTH;
        const my = ((e.clientY - rect.top) / rect.height) * CONFIG.HEIGHT;

        const side = this.role === 'HOST' ? 'P1' : 'P2';
        const locked = GAME.selectLocked[side];

        // Random button check (P1: x 40..352, P2: x 928..1240, y 606..632)
        const randX1 = side === 'P1' ? 40 : 928;
        const randX2 = side === 'P1' ? 352 : 1240;
        if (!locked && mx >= randX1 && mx <= randX2 && my >= 606 && my <= 632) {
          const pool = CONFIG.JOB_ORDER;
          GAME.selectedJobs[side] = pool[Math.floor(_origRandom() * pool.length)];
          AUDIO.sfxSelectMove();
          this.syncCharSelectState();
          return;
        }

        // Center 4-column character grid (x: 382..898, y: 94..636)
        const gx = 382, gy = 94, gw = 516, gh = 542;
        const cols = 4, gap = 7, pad = 12;
        const cellW = (gw - pad * 2 - gap * (cols - 1)) / cols;
        const rows = Math.ceil(CONFIG.JOB_ORDER.length / cols);
        const cellH = (gh - pad * 2 - gap * (rows - 1)) / rows;

        if (mx >= gx + pad && mx <= gx + gw - pad && my >= gy + pad && my <= gy + gh - pad) {
          const col = Math.floor((mx - (gx + pad)) / (cellW + gap));
          const row = Math.floor((my - (gy + pad)) / (cellH + gap));
          const idx = row * cols + col;
          if (idx >= 0 && idx < CONFIG.JOB_ORDER.length) {
            if (GAME.selectedJobs[side] === CONFIG.JOB_ORDER[idx]) {
              GAME.selectLocked[side] = !GAME.selectLocked[side];
              AUDIO.sfxSelectLock();
            } else if (!locked) {
              GAME.selectedJobs[side] = CONFIG.JOB_ORDER[idx];
              AUDIO.sfxSelectMove();
            }
            this.syncCharSelectState();
          }
        }
      }, true);
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => NET.init());
  } else {
    NET.init();
  }
})();
</script>
</body>
