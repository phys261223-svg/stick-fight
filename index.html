<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>STICK FIGHTER: ARCADE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #131b2e 0%, #060911 100%);
      font-family: 'Noto Sans KR', sans-serif;
      color: #f8fafc;
    }
    .font-arcade {
      font-family: 'Orbitron', 'Noto Sans KR', sans-serif;
    }
    .cabinet-glow {
      box-shadow:
        0 0 0 2px rgba(148, 163, 184, 0.22),
        0 24px 60px rgba(0, 0, 0, 0.85),
        0 0 40px rgba(245, 158, 11, 0.14);
    }
    .scanlines {
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%,
        rgba(0, 0, 0, 0.16) 50%
      );
      background-size: 100% 4px;
      pointer-events: none;
    }
    .kbd-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1px 6px;
      border-radius: 5px;
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.45);
      color: #fde047;
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 11px;
      line-height: 1.3;
    }

    /* ================= LOGIN GATE (Firebase) ================= */
    #authGate {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center; padding: 16px;
      background: radial-gradient(circle at center, rgba(19,27,46,.97) 0%, rgba(6,9,17,.99) 100%);
    }
    #authGate[hidden] { display: none; }
    #authGate input, #authGate button { user-select: text; -webkit-user-select: text; }
    #authGate .lg-panel {
      position: relative; width: min(420px, 100%); padding: 34px 30px 26px;
      background: rgba(15, 23, 42, .92); border: 1px solid rgba(148,163,184,.3); border-radius: 16px;
      box-shadow: 0 0 0 2px rgba(148,163,184,.12), 0 24px 60px rgba(0,0,0,.85), 0 0 40px rgba(245,158,11,.14);
    }
    #authGate .lg-title {
      margin: 0; font-family: 'Orbitron','Noto Sans KR',sans-serif; font-weight: 900; font-size: 22px; letter-spacing: .06em;
      background: linear-gradient(90deg,#fb7185,#fcd34d,#38bdf8); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    #authGate .lg-sub { margin: 8px 0 22px; font: 700 11px 'Orbitron',sans-serif; letter-spacing: .3em; color: #94a3b8; }
    #authGate label { display: block; margin-bottom: 14px; font-size: 13px; font-weight: 700; color: #cbd5e1; }
    #authGate input[type=text], #authGate input[type=password] {
      display: block; width: 100%; margin-top: 6px; padding: 11px 13px; font: 600 15px 'Noto Sans KR',sans-serif;
      color: #f8fafc; background: rgba(2,6,23,.75); border: 1px solid #475569; border-radius: 8px; transition: border-color .2s, box-shadow .2s;
    }
    #authGate input:focus { outline: 0; border-color: #fbbf24; box-shadow: 0 0 0 3px rgba(251,191,36,.2); }
    #authGate .pw { position: relative; display: block; }
    #authGate .pw input { padding-right: 62px; }
    #authGate .pw button { position: absolute; right: 6px; top: 50%; margin-top: 3px; transform: translateY(-50%); padding: 6px 8px; font-size: 12px; font-weight: 700; color: #94a3b8; cursor: pointer; background: none; border: 0; }
    #authGate .chk { display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
    #authGate .chk input { width: 16px; height: 16px; accent-color: #f59e0b; }
    #lg-status { min-height: 22px; margin: 0 0 10px; font-size: 13px; font-weight: 700; color: #94a3b8; }
    #lg-status.error { color: #fb7185; } #lg-status.ok { color: #4ade80; }
    #lg-submit {
      width: 100%; padding: 12px; border-radius: 10px; font-weight: 900; font-size: 15px; cursor: pointer; color: #fde68a;
      background: rgba(245,158,11,.22); border: 1px solid rgba(251,191,36,.6); transition: background .2s, transform .1s;
    }
    #lg-submit:hover { background: rgba(245,158,11,.34); } #lg-submit:active { transform: scale(.98); } #lg-submit:disabled { opacity: .55; cursor: default; }
    #authGate .lg-links { display: flex; justify-content: space-between; gap: 12px; margin-top: 16px; }
    #authGate .link { font-size: 13px; font-weight: 700; color: #7dd3fc; padding: 4px 0; background: none; border: 0; cursor: pointer; }
    #authGate .link:hover { color: #fbbf24; }
    #authGate .lg-panel.swap form { animation: lgSwap .35s ease; }
    @keyframes lgSwap { from { opacity: 0; transform: translateX(12px); } }
    #authGate .lg-panel[data-mode=login] [data-show]:not([data-show~=login]),
    #authGate .lg-panel[data-mode=signup] [data-show]:not([data-show~=signup]),
    #authGate .lg-panel[data-mode=reset] [data-show]:not([data-show~=reset]) { display: none; }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 sm:p-3">
  <!-- Main Arcade Cabinet Wrapper -->
  <div class="w-full max-w-[1280px] flex flex-col gap-1.5 sm:gap-2">

          🚪 로그아웃
        </button>
      </div>
    </header>

    <!-- 16:9 Responsive Game Viewport -->
    <div id="stageWrapper" class="relative w-full aspect-video rounded-2xl overflow-hidden bg-slate-950 cabinet-glow">
      <canvas id="gameCanvas" class="block w-full h-full cursor-pointer"></canvas>
      <div class="scanlines absolute inset-0"></div>
    </div>

    <!-- Bottom Compact Control Reference Bar -->
    <footer class="grid grid-cols-1 lg:grid-cols-2 gap-1.5 px-3 py-1.5 rounded-xl bg-slate-900/90 border border-slate-700/70 text-[11px] sm:text-xs">
      <div class="flex flex-wrap items-center gap-x-2 gap-y-1 text-slate-300">
        <span class="font-arcade font-black text-rose-400">1P RED</span>
        <span>이동 <span class="kbd-pill">W</span><span class="kbd-pill">A</span><span class="kbd-pill">S</span><span class="kbd-pill">D</span></span>
        <span>대쉬 <span class="kbd-pill">AA</span>/<span class="kbd-pill">DD</span></span>
        <span>평타 <span class="kbd-pill">X</span></span>
        <span>기술1 <span class="kbd-pill">C</span></span>
        <span>기술2 <span class="kbd-pill">V</span></span>
        <span>궁극기 <span class="kbd-pill">B</span></span>

      <div id="p2FooterControls" class="flex flex-wrap items-center lg:justify-end gap-x-2 gap-y-1 text-slate-300">
        <span class="font-arcade font-black text-sky-400">2P AI (CPU)</span>
        <span class="text-sky-300 font-bold">자동 전투 모드 활성 · 1대1 전환은 <span class="kbd-pill">1</span></span>
      </div>
    </footer>
  </div>


  <!-- ============ 로그인 화면 (Firebase) ============ -->
  <div id="authGate" aria-label="로그인">
    <main class="lg-panel" id="lg-panel" data-mode="login">
      <h2 class="lg-title">STICK FIGHTER: ARCADE</h2>
      <p class="lg-sub" id="lg-sub">PLAYER ACCESS</p>
      <form id="lg-form" novalidate>
        <label>아이디 또는 이메일
          <input id="lg-id" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="아이디(2~12자) 또는 이메일">
        </label>
        <label data-show="login signup">비밀번호
          <span class="pw">
            <input id="lg-pw" type="password" autocomplete="current-password" placeholder="6자 이상">
            <button type="button" id="lg-eye" aria-pressed="false">보기</button>
          </span>
        </label>
        <label data-show="signup">비밀번호 확인
          <input id="lg-pw2" type="password" autocomplete="new-password" placeholder="비밀번호 다시 입력">
        </label>
        <label class="chk" data-show="login signup"><input id="lg-remember" type="checkbox"> 이 기기에서 로그인 유지</label>
        <p id="lg-status" role="status" aria-live="polite"></p>
        <button id="lg-submit" type="submit">로그인</button>
      </form>
      <div class="lg-links">
        <button type="button" class="link" data-show="login" data-go="signup">회원가입</button>
        <button type="button" class="link" data-show="login" data-go="reset">비밀번호 찾기</button>
        <button type="button" class="link" data-show="signup reset" data-go="login">← 로그인으로 돌아가기</button>
      </div>
    </main>
  </div>

<script>
/* Firebase Authentication 래퍼 - EGG RAID와 같은 계정 규칙(아이디 → 내부 이메일) 사용 */
(function () {
  'use strict';
  var OD = window.OD = window.OD || {};
  var KEY = 'gw_site_login_remember'; // EGG RAID와 동일한 키 (아이디만 저장, 비밀번호는 저장 안 함)
  var ready = false, busy = false, cb = null;
  var EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/, INTERNAL = /@gw\.local$/;
  var BAD = '아이디 또는 비밀번호가 올바르지 않아요.';

  var initError = '';
  try {
    if (typeof firebase === 'undefined' || !firebase.auth) throw new Error('Firebase 라이브러리를 불러오지 못했어요. 인터넷 연결(또는 광고/보안 차단 프로그램)을 확인해 주세요.');
    if (!firebase.apps.length) firebase.initializeApp(window.OD_FIREBASE_CONFIG);
    firebase.auth(); // 여기서 환경 문제가 있으면 바로 잡아낸다
    ready = true;
  } catch (e) { initError = (e && e.message) || String(e); console.error('[OVERDRIVE] Firebase 초기화 실패', e); }

  // 아이디는 EGG RAID와 같은 규칙으로 내부 이메일로 변환, '@'가 있으면 실제 이메일로 취급
  function toEmail(raw) {
    var v = (raw || '').trim();
    if (v.indexOf('@') > -1) return EMAIL.test(v) ? v.toLowerCase() : null;
    if (!v) return null;
    return encodeURIComponent(v.toLowerCase()).replace(/%/g, '_') + '@gw.local';
  }
  function errMsg(e, ctx) {
    var c0 = e && e.code;
    if (c0 && c0.indexOf('auth/requests-from-referer') === 0) return '이 주소에서는 Firebase 접속이 막혀 있어요. 게임을 올려둔 사이트 주소에서 열거나, Firebase 콘솔의 API 키 허용 주소에 이 주소를 추가해 주세요.';
    var m = {
      'auth/unauthorized-domain': '이 주소는 Firebase 승인된 도메인에 없어요. Firebase 콘솔 → Authentication → 설정 → 승인된 도메인에 추가해 주세요.',
      'auth/operation-not-allowed': 'Firebase에서 이메일/비밀번호 로그인이 꺼져 있어요.',
      'auth/api-key-not-valid': 'Firebase API 키가 올바르지 않아요.',
      'auth/internal-error': 'Firebase 내부 오류예요. 잠시 후 다시 시도해 주세요.',
      'auth/email-already-in-use': '이미 사용 중인 아이디(이메일)예요.',
      'auth/invalid-email': '아이디 또는 이메일 형식이 올바르지 않아요.',
      'auth/weak-password': '비밀번호는 6자 이상이어야 해요.',
      'auth/user-not-found': ctx === 'reset' ? '가입된 이메일을 찾을 수 없어요.' : BAD,
      'auth/wrong-password': BAD, 'auth/invalid-credential': BAD,
      'auth/user-disabled': '사용이 중지된 계정이에요.',
      'auth/too-many-requests': '시도가 너무 많아요. 잠시 후 다시 해 주세요.',
      'auth/network-request-failed': '네트워크 연결을 확인해 주세요.',
      'auth/operation-not-supported-in-this-environment': '이 실행 환경에서는 로그인을 쓸 수 없어요. http://localhost 같은 로컬 서버로 열어 주세요.',
      'od/no-email': '아이디로 만든 계정은 이메일이 없어 재설정 메일을 보낼 수 없어요. 이메일로 가입한 계정만 가능해요.'
    };
    return (e && m[e.code]) || ('오류가 발생했어요' + (e && e.code ? ' (' + e.code + ')' : '') + (e && e.message ? ': ' + e.message : ''));
  }
  function persist(remember) {
    if (!/^https?:$/.test(location.protocol)) return Promise.resolve(); // file:// 에서는 저장 방식 지정을 건너뜀
    var P = firebase.auth.Auth.Persistence;
    return firebase.auth().setPersistence(remember ? P.LOCAL : P.SESSION).catch(function () {});
  }
  function remember(raw, on) { try { on ? localStorage.setItem(KEY, JSON.stringify({ id: raw.trim() })) : localStorage.removeItem(KEY); } catch (e) {} }
  function remembered() { try { var p = JSON.parse(localStorage.getItem(KEY)); return p && p.id || ''; } catch (e) { return ''; } }
  function label(u) {
    if (u.displayName) return u.displayName;
    var l = (u.email || '').split('@')[0];
    try { return INTERNAL.test(u.email || '') ? decodeURIComponent(l.replace(/_/g, '%')) : l; } catch (e) { return l; }
  }

  OD.auth = {
    ready: ready, initError: initError, errMsg: errMsg, label: label, remembered: remembered,
    isEmailAccount: function (u) { return !!u.email && !INTERNAL.test(u.email); },
    signIn: function (raw, pw, rem) {
      var email = toEmail(raw);
      if (!email) return Promise.reject({ code: 'auth/invalid-email' });
      return persist(rem).then(function () { return firebase.auth().signInWithEmailAndPassword(email, pw); })
        .then(function () { remember(raw, rem); });
    },
    signUp: function (raw, pw, rem) {
      var email = toEmail(raw);
      if (!email) return Promise.reject({ code: 'auth/invalid-email' });
      busy = true; // 표시 이름 저장이 끝날 때까지 화면 전환 보류
      return persist(rem).then(function () { return firebase.auth().createUserWithEmailAndPassword(email, pw); })
        .then(function (c) {
          var name = INTERNAL.test(email) ? raw.trim() : email.split('@')[0];
          return c.user.updateProfile({ displayName: name }).catch(function () {});
        })
        .then(function () { remember(raw, rem); busy = false; if (cb) cb(firebase.auth().currentUser); })
        .catch(function (e) { busy = false; throw e; });
    },
    reset: function (raw) {
      var email = toEmail(raw);
      if (!email) return Promise.reject({ code: 'auth/invalid-email' });
      if (INTERNAL.test(email)) return Promise.reject({ code: 'od/no-email' });
      return firebase.auth().sendPasswordResetEmail(email);
    },
    signOut: function () { return firebase.auth().signOut(); },
    current: function () { return ready ? firebase.auth().currentUser : null; },
    onState: function (fn) {
      cb = fn;
      if (ready) firebase.auth().onAuthStateChanged(function (u) { if (!busy) cb(u); });
    }
  };
})();

</script>
<script>
/* 로그인 화면 동작: 로그인 / 회원가입 / 비밀번호 찾기 */
(function () {
  'use strict';
  var OD = window.OD, A = OD.auth, $ = function (i) { return document.getElementById(i); };
  var panel = $('lg-panel'), fid = $('lg-id'), pw = $('lg-pw'), pw2 = $('lg-pw2'), rem = $('lg-remember');
  var st = $('lg-status'), btn = $('lg-submit'), sub = $('lg-sub');
  var mode = 'login', busy = false;
  var TXT = { login: ['OPERATOR ACCESS', '로그인'], signup: ['NEW OPERATOR REGISTRATION', '회원가입'], reset: ['PASSWORD RECOVERY', '재설정 메일 보내기'] };

  function say(m, t) { st.textContent = m || ''; st.className = t || ''; }
  function lock(b) { busy = b; btn.disabled = b; }
  function setMode(m) {
    mode = m; panel.dataset.mode = m; sub.textContent = TXT[m][0]; btn.textContent = TXT[m][1];
    pw.value = pw2.value = ''; say('');
    pw.autocomplete = m === 'login' ? 'current-password' : 'new-password';
    panel.classList.remove('swap'); void panel.offsetWidth; panel.classList.add('swap');
  }
  function validate() {
    var v = fid.value.trim();
    if (!v) return '아이디 또는 이메일을 입력해 주세요.';
    if (mode === 'reset') return '';
    if (!pw.value) return '비밀번호를 입력해 주세요.';
    if (mode === 'signup') {
      if (v.indexOf('@') < 0 && (v.length < 2 || v.length > 12)) return '아이디는 2~12자로 입력해 주세요.';
      if (pw.value.length < 6) return '비밀번호는 6자 이상이어야 해요.';
      if (pw.value !== pw2.value) return '비밀번호 확인이 일치하지 않아요.';
    }
    return '';
  }
  $('lg-form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;
    if (!A.ready) { say('로그인 서버에 연결할 수 없어요. ' + (A.initError || ''), 'error'); return; }
    var bad = validate(); if (bad) { say(bad, 'error'); return; }
    var v = fid.value.trim(), p;
    lock(true);
    if (mode === 'login') { say('인증 중...'); p = A.signIn(v, pw.value, rem.checked); }
    else if (mode === 'signup') { say('계정 생성 중...'); p = A.signUp(v, pw.value, rem.checked); }
    else {
      say('메일 전송 중...');
      p = A.reset(v).then(function () { say('재설정 메일을 보냈어요. 메일함(스팸함 포함)을 확인해 주세요.', 'ok'); lock(false); });
    }
    // 로그인/가입 성공 시에는 인증 상태 변화가 메인 화면 전환을 처리한다
    p.catch(function (err) { say(A.errMsg(err, mode), 'error'); lock(false); });
  });
  Array.prototype.forEach.call(panel.querySelectorAll('[data-go]'), function (b) {
    b.addEventListener('click', function () { setMode(b.dataset.go); });
  });
  $('lg-eye').addEventListener('click', function () {
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password'; this.textContent = show ? '숨기기' : '보기'; this.setAttribute('aria-pressed', show);
  });
  var saved = A.remembered(); if (saved) { fid.value = saved; rem.checked = true; }
  if (!A.ready) say('Firebase 연결 실패: ' + A.initError, 'error');

  OD.login = { release: function () { lock(false); setMode('login'); } }; // 로그아웃 후 로그인 화면 초기화
})();

    const INPUT = {
      down: new Set(),
      pressed: new Set(),
      lastTapTime: new Map(),
      doubleTapped: new Set(),

      KEY_FALLBACK: {
        w: 'KeyW', a: 'KeyA', s: 'KeyS', d: 'KeyD',
        x: 'KeyX', c: 'KeyC', v: 'KeyV', b: 'KeyB',
        f: 'KeyF', g: 'KeyG', h: 'KeyH', j: 'KeyJ',
        k: 'KeyK', l: 'KeyL', ';': 'Semicolon', "'": 'Quote',
        r: 'KeyR', m: 'KeyM'
      },

      BLOCKED_CODES: new Set([
        'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
        'Space', 'Semicolon', 'Quote', 'Slash'
      ]),

      init() {
        window.addEventListener('keydown', (e) => {
          const code = this.normalizeCode(e);
          if (this.BLOCKED_CODES.has(code)) {
            e.preventDefault();
          }

          if (!this.down.has(code)) {
            this.down.add(code);
            this.pressed.add(code);

            // Detect double-tap for dash/backstep
            const now = performance.now();
            const prev = this.lastTapTime.get(code) || 0;
            if (now - prev <= CONFIG.DOUBLE_TAP_WINDOW_MS) {
              this.doubleTapped.add(code);
              this.lastTapTime.set(code, 0);
            } else {
              this.lastTapTime.set(code, now);
            }
          }
        });

        window.addEventListener('keyup', (e) => {
          const code = this.normalizeCode(e);
          this.down.delete(code);
        });

        window.addEventListener('blur', () => {
          this.down.clear();
          this.pressed.clear();
          this.doubleTapped.clear();
        });
      },

      normalizeCode(e) {
        if (e.code && e.code !== 'Unidentified' && e.code !== '') {
          return e.code;
        }
        const k = (e.key || '').toLowerCase();
        return this.KEY_FALLBACK[k] || e.code || k;
      },

      isDown(code) {
        return this.down.has(code);
      },

      wasPressed(code) {
        return this.pressed.has(code);
      },

      wasDoubleTapped(code) {
        return this.doubleTapped.has(code);
      },

      endFrame() {
        this.pressed.clear();
        this.doubleTapped.clear();
      }
    };

    // =========================================================================
    // 3. AUDIO: Procedural Web Audio API Retro Arcade Sound Synthesizer
    // =========================================================================
    const AUDIO = {
      ctx: null,
      muted: false,

      ensureContext() {
        if (this.muted) return null;
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        return this.ctx;
      },

      toggleMute() {
        this.muted = !this.muted;
        return this.muted;
      },

      playTone({ type = 'square', freqStart = 440, freqEnd = 220, duration = 0.12, gain = 0.16, delay = 0 }) {
        const ctx = this.ensureContext();
        if (!ctx) return;

        const now = ctx.currentTime + delay;
        const osc = ctx.createOscillator();
        const amp = ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freqStart, now);
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), now + duration);

        amp.gain.setValueAtTime(gain, now);
        amp.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(amp);
        amp.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.02);
      },

      playNoise({ duration = 0.12, gain = 0.18, filterFreq = 1200, filterType = 'bandpass', delay = 0 }) {
        const ctx = this.ensureContext();
        if (!ctx) return;

        const now = ctx.currentTime + delay;
        const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = filterType;
        filter.frequency.setValueAtTime(filterFreq, now);

        const amp = ctx.createGain();
        amp.gain.setValueAtTime(gain, now);
        amp.gain.exponentialRampToValueAtTime(0.001, now + duration);

        noise.connect(filter);
        filter.connect(amp);
        amp.connect(ctx.destination);
        noise.start(now);
        noise.stop(now + duration + 0.02);
      },

          PIRATE: ['#fbbf24', '⚓'], REAPER: ['#a78bfa', '☠'], WEREWOLF: ['#f97316', '狼'],
          SONG_MASTER: ['#f0abfc', '♫'], TAEKWONDO: ['#67e8f9', '踢'], POSEIDON: ['#22d3ee', '♆'],
          GAMBLER: ['#facc15', '♠'], HUNTER: ['#a3e635', '✧'], BEGGAR: ['#86efac', '₩'],
          AI_ROBOT: ['#22d3ee', 'AI'], GOJO: ['#60a5fa', '無'], PASTOR: ['#fde68a', '✝'], MONK: ['#fbbf24', '卍'], SANTA: ['#fb7185', '❄']
        };
        const [c, glyph] = palette[f.jobId] || (f.jobId === 'DRAGON_KNIGHT' ? ['#fb6b32', '竜'] : [f.accentColor || '#fbbf24', '✦']);
        const ult = type === 'ULTIMATE';
        const cx = f.x, cy = f.y - 82;
        const life = ult ? 18 : 11;
        const radius = ult ? 185 : 112;

        // Layered expanding rings and a bright core make the cast readable at a glance.
        this.shockwaves.push({ x: cx, y: cy, radius: 7, maxRadius: radius, life, maxLife: life, color: c });
        this.shockwaves.push({ x: cx, y: cy, radius: 3, maxRadius: radius * .68, life: Math.round(life * .72), maxLife: Math.round(life * .72), color: '#ffffff' });
        this.shockwaves.push({ x: cx, y: CONFIG.GROUND_Y - 5, radius: 8, maxRadius: ult ? 270 : 150, life: ult ? 16 : 10, maxLife: ult ? 16 : 10, color: c });

        // Radial sparks + rising motes; glyph particles are decorative only.
        const n = ult ? 22 : 12;
        for (let i = 0; i < n; i++) {
          const a = (Math.PI * 2 * i / n) + (Math.random() - .5) * .24;
          const speed = (ult ? 4.2 : 2.4) + Math.random() * (ult ? 7.5 : 4.8);
          const particleLife = 9 + Math.floor(Math.random() * (ult ? 7 : 5));
          const glyphParticle = i % (ult ? 5 : 7) === 0;
          this.particles.push({
            x: cx + Math.cos(a) * (ult ? 18 : 10),
            y: cy + Math.sin(a) * (ult ? 18 : 10),
            vx: Math.cos(a) * speed,
            vy: Math.sin(a) * speed - (glyphParticle ? 1.2 : 0),
            gravity: glyphParticle ? -0.025 : 0.015,
            life: particleLife, maxLife: particleLife,
            size: glyphParticle ? (ult ? 17 : 13) : 2.5 + Math.random() * (ult ? 4.5 : 3),
            color: i % 4 === 0 ? '#ffffff' : c,
            spark: !glyphParticle,
            glyph: glyphParticle ? glyph : null,
            rotation: a
          });
        }
        // A few upward embers emphasize the character's silhouette.
        for (let i = 0; i < (ult ? 9 : 5); i++) {
          const particleLife = 10 + Math.floor(Math.random() * 6);
          this.particles.push({
            x: cx + (Math.random() - .5) * 76, y: CONFIG.GROUND_Y - 8,
            vx: (Math.random() - .5) * 2.4, vy: -(2.8 + Math.random() * (ult ? 7 : 4.5)),
            gravity: -0.035, life: particleLife, maxLife: particleLife,
            size: 2 + Math.random() * 3.5, color: i % 3 ? c : '#fff7ed'
          });
        }
        this.spawnDust(f.x, CONFIG.GROUND_Y, 0);
        if (ult) {
          this.triggerShake(10);
          this.triggerScreenFlash(c, 0.24);
        } else {
          this.triggerShake(4);
        }
        if (this.particles.length > 300) this.particles.splice(0, this.particles.length - 300);
      },

      spawnSkillImpact(attacker, x, y, info) {
        const c = attacker.accentColor || '#fbbf24';
        const ult = attacker.attackType === 'ULTIMATE';
        const dir = info.direction || 1;
        const life = ult ? 12 : 8;
        this.shockwaves.push({ x, y, radius: 8, maxRadius: ult ? 175 : 112, life, maxLife: life, color: c });
        this.shockwaves.push({ x, y, radius: 4, maxRadius: ult ? 105 : 64, life: Math.round(life * 0.7), maxLife: Math.round(life * 0.7), color: '#ffffff' });
        const n = ult ? 12 : 7;
        for (let i = 0; i < n; i++) {
          const sp = 7 + Math.random() * (ult ? 15 : 11);
          const life2 = 7 + Math.floor(Math.random() * 5);
          this.particles.push({
            x, y,
            vx: dir * sp * (0.6 + Math.random() * 0.8),
            vy: (Math.random() - 0.5) * 7,
            life: life2, maxLife: life2,
            size: 3.5 + Math.random() * 3.5,
            color: i % 3 === 0 ? '#ffffff' : c,
            spark: true
          });
        }
        this.triggerHitstop((info.hitstop || 0) + (ult ? 4 : 2));
        this.triggerShake((info.shake || 0) + (ult ? 5 : 2));
        if (ult) this.triggerScreenFlash(c, 0.22);
        if (this.particles.length > 220) this.particles.splice(0, this.particles.length - 220);
      },

      spawnGuardSparks(x, y) {
        this.spawnHitSparks(x, y, '#38bdf8', 10, 0.8);
        this.shockwaves.push({
          x, y,
          radius: 18,
          maxRadius: 72,
          life: 14,
          maxLife: 14,
          color: '#7dd3fc'
        });
      },

      spawnDust(x, y, dir = 0) {
        for (let i = 0; i < 6; i++) {
          this.particles.push({
            x: x + (Math.random() - 0.5) * 24,
            y: y - 4,
            vx: (-dir * (1.5 + Math.random() * 2.5)) + (Math.random() - 0.5) * 2,
            vy: -0.5 - Math.random() * 2.2,
            life: 16 + Math.floor(Math.random() * 8),
            maxLife: 24,
            size: 6 + Math.random() * 6,
            color: 'rgba(226, 232, 240, 0.55)',

          });

      },

      spawnAfterimage(fighter, customColor = null) {
        this.afterimages.push({
          jobId: fighter.jobId || 'STICKMAN',
          isWerewolf: Boolean(fighter.isWerewolf),
          beltRank: fighter.beltRank || 0,
          x: fighter.x,
          y: fighter.y,
          facing: fighter.facing,
          state: fighter.state,
          attackType: fighter.attackType,
          stateTimer: fighter.stateTimer,
          color: customColor || fighter.accentColor,
          life: 10,
          maxLife: 10
        });
      },

      spawnFloatingText(x, y, text, color = '#fbbf24') {
        this.floatingTexts.push({
          x, y,
          vy: -1.6,
          text,
          color,
          life: 25,
          maxLife: 25
        });
      },

      update() {
        if (this.shakeIntensity > 0.2) {
          this.shakeX = Math.round((Math.random() - 0.5) * 2 * this.shakeIntensity);
          this.shakeY = Math.round((Math.random() - 0.5) * 2 * this.shakeIntensity);
          this.shakeIntensity *= 0.82;
        } else {
          this.shakeIntensity = 0;
          this.shakeX = 0;
          this.shakeY = 0;
        }

        if (this.screenFlashAlpha > 0) {
          this.screenFlashAlpha = Math.max(0, this.screenFlashAlpha - 0.045);
        }

        if (this.superFlash.active) {
          this.superFlash.timer--;
          if (this.superFlash.timer <= 0) {
            this.superFlash.active = false;
          }
        }

        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          if (p.gravity) p.vy += p.gravity;
          else if (p.spark) {
            p.vx *= 0.88;
            p.vy *= 0.88;
          } else {
            p.size *= 1.02;
          }
          p.life--;
          if (p.life <= 0 || p.x < -80 || p.x > CONFIG.WIDTH+80 || p.y < -100 || p.y > CONFIG.HEIGHT+100) this.particles.splice(i, 1);
        }

        if (this.shockwaves.length > 100) this.shockwaves.splice(0, this.shockwaves.length - 100);
        if (this.afterimages.length > 80) this.afterimages.splice(0, this.afterimages.length - 80);
        for (let i = this.shockwaves.length - 1; i >= 0; i--) {
          const s = this.shockwaves[i];
          s.radius += (s.maxRadius - s.radius) * 0.35;
          s.life--;
          if (s.life <= 0 || s.x < -s.maxRadius-40 || s.x > CONFIG.WIDTH+s.maxRadius+40 || s.y < -s.maxRadius-40 || s.y > CONFIG.HEIGHT+s.maxRadius+40) this.shockwaves.splice(i, 1);
        }

        for (let i = this.wolfBiteJaws.length - 1; i >= 0; i--) {
          this.wolfBiteJaws[i].life--;
          if (this.wolfBiteJaws[i].life <= 0) this.wolfBiteJaws.splice(i, 1);
        }

        for (let i = this.slashArcs.length - 1; i >= 0; i--) {
          this.slashArcs[i].life--;
          if (this.slashArcs[i].life <= 0) this.slashArcs.splice(i, 1);
        }
        for (let i = this.thrustCones.length - 1; i >= 0; i--) {
          this.thrustCones[i].life--;
          if (this.thrustCones[i].life <= 0) this.thrustCones.splice(i, 1);
        }
        for (let i = this.iaidoLines.length - 1; i >= 0; i--) {
          this.iaidoLines[i].life--;
          if (this.iaidoLines[i].life <= 0) this.iaidoLines.splice(i, 1);
        }
        for (let i = this.lightningBolts.length - 1; i >= 0; i--) {
          this.lightningBolts[i].life--;
          if (this.lightningBolts[i].life <= 0) this.lightningBolts.splice(i, 1);
        }
        for (let i = this.groundCracks.length - 1; i >= 0; i--) {
          this.groundCracks[i].life--;
          if (this.groundCracks[i].life <= 0) this.groundCracks.splice(i, 1);
        }
        for (let i = this.smokePuffs.length - 1; i >= 0; i--) {
          const sm = this.smokePuffs[i];
          sm.x += sm.vx;
          sm.y += sm.vy;
          sm.vx *= 0.9;
          sm.vy *= 0.9;
          sm.life--;
          if (sm.life <= 0) this.smokePuffs.splice(i, 1);
        }

        // Pirate Galleon Ships & Enhanced Dodgable Cannonball Bombs
        for (let i = this.pirateShips.length - 1; i >= 0; i--) {
          const ship = this.pirateShips[i];
          ship.bobTick++;
          if (ship.muzzleFlashTimer > 0) ship.muzzleFlashTimer--;
          ship.x += ship.vx;
          if (ship.x < 195) {
            ship.x = 195;
            ship.vx = Math.abs(ship.vx);
            ship.dir = 1;
          } else if (ship.x > CONFIG.WIDTH - 195) {
            ship.x = CONFIG.WIDTH - 195;
            ship.vx = -Math.abs(ship.vx);
            ship.dir = -1;
          }

          if (ship.shotsRemaining > 0) {
            ship.shotTimer--;
            if (ship.shotTimer <= 0) {
              ship.shotsRemaining--;
              ship.shotTimer = ship.shotInterval;
              ship.muzzleFlashTimer = 11;
              const target = ship.target;
              const aimX = target
                ? target.x + (Math.random() - 0.5) * 90
                : (CONFIG.WIDTH * 0.5 + (Math.random() - 0.5) * 320);
              const cannonX = ship.x + ship.dir * 56;
              const cannonY = ship.y + 42;
              this.spawnCannonBomb(ship.owner, target, cannonX, cannonY, aimX, ship.spec);
              this.spawnSmokePoof(cannonX, cannonY, 6, 'rgba(248, 250, 252, 0.72)');
              this.spawnHitSparks(cannonX, cannonY, '#fde047', 16, 1.15);
              this.shockwaves.push({
                x: cannonX,
                y: cannonY,
                radius: 8,
                maxRadius: 58,
                life: 12,
                maxLife: 12,
                color: '#f97316'
              });
              this.triggerShake(7);
              AUDIO.sfxCannonBoom();
            }
          } else {
            ship.lingerTimer--;
            if (ship.lingerTimer <= 0) {
              this.spawnSmokePoof(ship.x, ship.y, 6, 'rgba(203, 213, 225, 0.55)');
              this.pirateShips.splice(i, 1);
            }
          }
        }

        for (let i = this.cannonBombs.length - 1; i >= 0; i--) {
          const bomb = this.cannonBombs[i];
          bomb.timer++;
          const t = Math.min(1, bomb.timer / bomb.flightTime);
          bomb.x = bomb.startX + (bomb.targetX - bomb.startX) * t;
          bomb.y = bomb.startY + (bomb.targetY - bomb.startY) * t - Math.sin(t * Math.PI) * 125;

          // Rich Fiery Ember & Smoke Trail
          this.particles.push({
            x: bomb.x + (Math.random() - 0.5) * 8,
            y: bomb.y + (Math.random() - 0.5) * 8,
            vx: (Math.random() - 0.5) * 2.2,
            vy: -1.0 - Math.random() * 1.8,
            life: 14,
            maxLife: 14,
            size: 5 + Math.random() * 3,
            color: bomb.timer % 2 === 0 ? '#f97316' : '#fde047',
            spark: true
          });
          if (bomb.timer % 3 === 0) {
            this.smokePuffs.push({
              x: bomb.x,
              y: bomb.y,
              vx: (Math.random() - 0.5) * 1.2,
              vy: -0.9,
              radius: 9,
              color: 'rgba(100, 116, 139, 0.45)',
              life: 14,
              maxLife: 14
            });
          }

          const target = bomb.target;
          const blastRadius = bomb.spec.blastRadius || 52;
          const midAirDirectHit =
            t > 0.5 &&
            target &&
            target.state !== 'KO' &&
            target.invulnTimer <= 0 &&
            Math.abs(target.x - bomb.x) <= 34 &&
            Math.abs((target.y - 66) - bomb.y) <= 56;

          if (t >= 1 || midAirDirectHit) {
            const explodeX = midAirDirectHit ? bomb.x : bomb.targetX;
            const explodeY = midAirDirectHit ? bomb.y : CONFIG.GROUND_Y;

            // High-Impact Naval Broadside Explosion VFX
            this.spawnGroundSlam(explodeX, CONFIG.GROUND_Y, '#f97316', 1.45);
            this.spawnHitSparks(explodeX, explodeY - 24, '#fde047', 24, 1.45);
            this.spawnHitSparks(explodeX, explodeY - 38, '#ef4444', 16, 1.25);
            this.spawnSmokePoof(explodeX, explodeY - 30, 6, 'rgba(30, 41, 59, 0.72)');
            this.shockwaves.push({
              x: explodeX,
              y: explodeY - 12,
              radius: 14,
              maxRadius: 135,
              life: 18,
              maxLife: 18,
              color: '#fde047'
            });
            // Rising Flame Pillar Particles
            for (let f = 0; f < 10; f++) {
              this.particles.push({
                x: explodeX + (Math.random() - 0.5) * 48,
                y: explodeY - 12,
                vx: (Math.random() - 0.5) * 5,
                vy: -7 - Math.random() * 9,
                life: 18 + Math.floor(Math.random() * 8),
                maxLife: 26,
                size: 7 + Math.random() * 6,
                color: f % 2 === 0 ? '#f97316' : '#fef08a',
                spark: false
              });
            }
            this.triggerScreenFlash('#f97316', 0.24);
            this.triggerShake(13);
            AUDIO.sfxCannonBoom();

            if (target && target.state !== 'KO' && target.invulnTimer <= 0) {
              const inBlast =
                Math.abs(target.x - explodeX) <= blastRadius &&
                target.y >= CONFIG.GROUND_Y - 115;
              if (midAirDirectHit || inBlast) {
                COMBAT_ENGINE.applyHit(bomb.owner, target, {
                  damage: bomb.spec.cannonDamage || 72,
                  isSkill: true,
                  rageGain: 12,
                  ultGainAttacker: 0,
                  ultGainDefender: 4,
                  hitstun: 22,
                  blockstun: 13,
                  knockbackX: 9.5,
                  knockbackY: -9.5,
                  knockdown: true,
                  hitstop: 0,
                  shake: 11,
                  direction: target.x >= explodeX ? 1 : -1,
                  sourceX: explodeX,
                  isHeavy: true
                });
              }
            }

            if (target && target.banner && target.banner.hp > 0 && Math.abs(target.banner.x - explodeX) <= blastRadius) {
              COMBAT_ENGINE.damageBanner(target, bomb.spec.cannonDamage || 72);
            }

            // Damage enemy ghosts in blast radius
            COMBAT_ENGINE.damageGhostsInArea(bomb.owner, {
              x: explodeX - blastRadius,
              y: CONFIG.GROUND_Y - 125,
              width: blastRadius * 2,
              height: 125
            }, bomb.spec.cannonDamage || 72);

            this.cannonBombs.splice(i, 1);
          }
        }

        // Taoist Vine Traps (Warning -> Eruption + Root)
        for (let i = this.vineTraps.length - 1; i >= 0; i--) {
          const vt = this.vineTraps[i];
          vt.timer++;
          if (vt.timer === vt.warningFrames) {
            AUDIO.sfxVineBind();
            this.spawnHitSparks(vt.x, vt.y - 24, '#34d399', 12, 0.9);
          }
          if (vt.timer >= vt.warningFrames && vt.timer < vt.warningFrames + vt.eruptFrames) {
            const target = vt.target;
            const vineBox = { x: vt.x - 42, y: vt.y - 125, width: 84, height: 125 };
            if (!vt.hasHit && target && target.state !== 'KO' && target.invulnTimer <= 0) {
              if (COMBAT_ENGINE.rectsOverlap(vineBox, target.getHurtbox())) {
                vt.hasHit = true;
                COMBAT_ENGINE.applyHit(vt.owner, target, {
                  damage: vt.spec.damage,
                  isSkill: true,
                  rageGain: 22,
                  rootDuration: vt.spec.rootDuration,
                  ultGainAttacker: vt.spec.ultGainAttacker,
                  ultGainDefender: vt.spec.ultGainDefender,
                  hitstun: vt.spec.hitstun,
                  blockstun: vt.spec.blockstun,
                  knockbackX: vt.spec.knockbackX,
                  knockbackY: vt.spec.knockbackY,
                  hitstop: vt.spec.hitstop,
                  shake: vt.spec.shake,
                  direction: target.x >= vt.x ? 1 : -1,
                  sourceX: vt.x,
                  isHeavy: true
                });
              }
            }
            if (!vt.hasHitBanner && target && target.getBannerHurtbox() && COMBAT_ENGINE.rectsOverlap(vineBox, target.getBannerHurtbox())) {
              vt.hasHitBanner = true;
              COMBAT_ENGINE.damageBanner(target, vt.spec.damage);
            }
            COMBAT_ENGINE.damageGhostsInArea(vt.owner, vineBox, vt.spec.damage, vt.hitGhostIds);
          }
          if (vt.timer >= vt.warningFrames + vt.eruptFrames) {
            this.vineTraps.splice(i, 1);
          }
        }

        // Taoist Rainstorm Dodgeable Lightning Strikes
        for (let i = this.skyStrikes.length - 1; i >= 0; i--) {
          const st = this.skyStrikes[i];
          st.timer++;
          if (st.timer >= st.warningFrames) {
            this.spawnLightningBolt(st.x, CONFIG.GROUND_Y, '#34d399');
            this.triggerShake(11);
            AUDIO.sfxThunder();

            const target = st.target;
            if (target && target.state !== 'KO' && target.invulnTimer <= 0 && Math.abs(target.x - st.x) <= 44) {
              COMBAT_ENGINE.applyHit(st.owner, target, {
                damage: st.spec.lightningDamage,
                isSkill: true,
                rageGain: 12,
                ultGainAttacker: 0,
                ultGainDefender: 3,
                hitstun: 20,
                blockstun: 11,
                knockbackX: 4.5,
                knockbackY: -7.5,
                hitstop: 3,
                shake: 12,
                direction: target.x >= st.x ? 1 : -1,
                sourceX: st.x,
                isHeavy: true
              });
            }
            if (target && target.banner && target.banner.hp > 0 && Math.abs(target.banner.x - st.x) <= 44) {
              COMBAT_ENGINE.damageBanner(target, st.spec.lightningDamage);
            }
            COMBAT_ENGINE.damageGhostsInArea(st.owner, {
              x: st.x - 44,
              y: CONFIG.GROUND_Y - 140,
              width: 88,
              height: 140
            }, st.spec.lightningDamage);
            this.skyStrikes.splice(i, 1);
          }
        }

        for (let i = this.afterimages.length - 1; i >= 0; i--) {
          this.afterimages[i].life--;
          if (this.afterimages[i].life <= 0) this.afterimages.splice(i, 1);
        }

        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
          const ft = this.floatingTexts[i];
          ft.y += ft.vy;
          ft.vy *= 0.95;
          ft.life--;
          if (ft.life <= 0) this.floatingTexts.splice(i, 1);
        }
      }
    };

    // =========================================================================
    // 5. PROJECTILE_CLASS & BOOMERANG_SCYTHE_CLASS
    // =========================================================================
    class Projectile {
      constructor(owner, x, y, facing, customSpec = null, isSkill = true) {
        const spec = customSpec || owner.attacks.SKILL1.projectile;
        this.owner = owner;
        this.isSkill = isSkill;
        this.x = x;
        this.y = y;
        this.facing = facing;
        this.visualType = spec.visualType || 'FIREBALL';
        this.piercing = Boolean(spec.piercing);
        this.persistAfterHit = Boolean(spec.persistAfterHit);
        this.hasHitTarget = false;
        this.guardBreak = Boolean(spec.guardBreak);
        this.knockdown = Boolean(spec.knockdown);
        this.rootDuration = spec.rootDuration || 0;
        this.slowDuration = spec.slowDuration || 0;
        this.vx = spec.speed * facing;
        this.vy = spec.vy || 0;
        this.gravity = spec.gravity || 0;
        this.spawnX = x;
        this.maxTravel = Number.isFinite(spec.maxTravel) ? spec.maxTravel : 0;
        this.threePointDist = spec.threePointDist || 0;
        this.threePointMult = spec.threePointMult || 1;
        this.threePointAwarded = false;
        this.radius = spec.radius;
        this.projectileHp = Number.isFinite(spec.projectileHp) ? spec.projectileHp : 0;
        this.projectileMaxHp = this.projectileHp;
        this.damage = Math.round(spec.damage * (owner.getDamageMultiplier ? owner.getDamageMultiplier() : 1));
        this.ultGainAttacker = spec.ultGainAttacker;
        this.ultGainDefender = spec.ultGainDefender;
        this.hitstun = spec.hitstun;
        this.blockstun = spec.blockstun;
        this.knockbackX = spec.knockbackX;
        this.knockbackY = spec.knockbackY || 0;
        this.hitstop = spec.hitstop;
        this.shake = spec.shake;
        this.color = owner.accentColor;
        this.coreColor = '#ffffff';
        this.active = true;
        this.age = 0;
        this.rotation = Math.atan2(this.vy, this.vx);
        this.pierceHitTimer = 0;
        this.trail = [];
      }

      update() {
        if (!this.active) return;
        this.age++;
        if (this.visualType === 'SHURIKEN') {
          this.rotation += 0.42 * this.facing;
        } else {
          this.rotation = Math.atan2(this.vy, this.vx);
        }
        if (this.pierceHitTimer > 0) this.pierceHitTimer--;
        if (this.visualType === 'BASKETBALL') {
          this.rotation += 0.34 * this.facing;
          this.vy += this.gravity;
          if (!this.threePointAwarded && this.threePointDist > 0 && Math.abs(this.x - this.spawnX) >= this.threePointDist) {
            this.threePointAwarded = true;
            this.damage = Math.round(this.damage * this.threePointMult);
            VFX.spawnFloatingText(this.x, this.y - 34, '3PT SWISH! (3점슛!)', '#fbbf24');
            VFX.shockwaves.push({ x:this.x, y:this.y, radius:12, maxRadius:58, life:14, maxLife:14, color:'#fbbf24' });
            this.owner.gainUlt(8);
          }
        }

        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 7) this.trail.shift();

        this.x += this.vx;
        this.y += this.vy;

        if (this.maxTravel > 0 && Math.abs(this.x - this.spawnX) >= this.maxTravel) {
          this.active = false;
          VFX.spawnHitSparks(this.x, this.y, '#fb923c', 10, .8);
          VFX.shockwaves.push({x:this.x,y:this.y,radius:5,maxRadius:28,life:9,maxLife:9,color:'#fb923c'});
          return;
        }

        if (this.y >= CONFIG.GROUND_Y - 8) {
          this.active = false;
          VFX.spawnHitSparks(this.x, CONFIG.GROUND_Y - 6, this.color, 7, 0.65);
          return;
        }

        if (this.age % 2 === 0) {
          VFX.particles.push({
            x: this.x - this.facing * 12,
            y: this.y + (Math.random() - 0.5) * (this.radius * 0.8),
            vx: -this.facing * 2,
            vy: (Math.random() - 0.5) * 2,
            life: 10,
            maxLife: 10,
            size: 3.5,
            color: this.color,
            spark: true
          });
        }

        if (this.isSkill && this.owner && this.owner.jobId !== 'STICKMAN') {
          VFX.particles.push({
            x: this.x - this.facing * 8,
            y: this.y + (Math.random() - 0.5) * this.radius * 0.6,
            vx: -this.facing * 0.8,
            vy: (Math.random() - 0.5) * 0.8,
            life: 12, maxLife: 12,
            size: Math.max(3, this.radius * 0.28),
            color: this.age % 4 === 0 ? '#ffffff' : this.color
          });
        }

        const margin = 90;
        if (this.x < CONFIG.STAGE_LEFT - margin || this.x > CONFIG.STAGE_RIGHT + margin) {
          this.active = false;
        }
      }

      getHitbox() {
        return {
          x: this.x - this.radius,
          y: this.y - this.radius,
          width: this.radius * 2,
          height: this.radius * 2
        };
      }
    }

    // Large Boomerang Scythe for Reaper Skill 1 (requires well-timed jump to dodge!)
    class BoomerangScythe {
      constructor(owner, x, y, facing, spec) {
        this.owner = owner;
        this.x = x;
        this.y = y;
        this.facing = facing;
        this.spec = spec;
        this.rx = 76; // Expanded horizontal radius (152px wide)
        this.ry = 60; // Expanded vertical radius (120px tall)
        this.vx = 17.5 * facing;
        this.phase = 'OUT'; // OUT | RETURN
        this.travelled = 0;
        this.maxDistance = 680;
        this.rotation = 0;
        this.age = 0;
        this.returnAge = 0;
        this.active = true;
        this.hitOut = false;
        this.hitReturn = false;
        this.hitBannerOut = false;
        this.hitBannerReturn = false;
        this.hitGhostsOut = new Set();
        this.hitGhostsReturn = new Set();
      }

      update() {
        if (!this.active) return;
        this.age++;
        this.rotation += 0.46 * (this.phase === 'OUT' ? this.facing : -this.facing);

        if (this.phase === 'OUT') {
          this.x += this.vx;
          this.travelled += Math.abs(this.vx);
          this.vx *= 0.968;

          if (this.x <= CONFIG.STAGE_LEFT + 32) {
            this.x = CONFIG.STAGE_LEFT + 32;
            this.phase = 'RETURN';
          } else if (this.x >= CONFIG.STAGE_RIGHT - 32) {
            this.x = CONFIG.STAGE_RIGHT - 32;
            this.phase = 'RETURN';
          } else if (Math.abs(this.vx) < 2.2 || this.travelled >= this.maxDistance) {
            this.phase = 'RETURN';
          }
        } else {
          // Give the returning scythe a short travel grace period near stage edges.
          this.returnAge++;
          // Return smoothly toward the Reaper's current position
          const targetX = this.owner.x;
          const targetY = Math.min(CONFIG.GROUND_Y - 52, this.owner.y - 52);
          const dx = targetX - this.x;
          const dy = targetY - this.y;
          const dist = Math.hypot(dx, dy);

          if ((dist <= 38 && this.returnAge >= 6) || this.age > 210 || this.owner.state === 'KO') {
            this.active = false;
            VFX.spawnHitSparks(this.owner.x, this.owner.y - 72, this.owner.accentColor, 8, 0.65);
            return;
          }

          const returnSpeed = Math.min(17.5, 8.5 + this.age * 0.14);
          this.vx = (dx / dist) * returnSpeed;
          this.x += this.vx;
          this.y += (dy / dist) * (returnSpeed * 0.55);
        }

        if (this.age % 2 === 0) {
          VFX.particles.push({
            x: this.x + (Math.random() - 0.5) * 44,
            y: this.y + (Math.random() - 0.5) * 34,
            vx: -this.vx * 0.18,
            vy: (Math.random() - 0.5) * 2,
            life: 11,
            maxLife: 11,
            size: 4,
            color: this.owner.accentColor,
            spark: true
          });
        }
      }

      getHitbox() {
        return {
          x: this.x - this.rx,
          y: this.y - this.ry,
          width: this.rx * 2,
          height: this.ry * 2
        };
      }
    }

          !this.isWerewolf &&
          this.state === 'ATTACK' &&
          this.attackType === 'SKILL2' &&
          this.stateTimer >= 2 &&
          this.stateTimer <= 17
        );

      gainRage(amount) {
        if (this.jobId !== 'WEREWOLF' || this.isWerewolf || this.state === 'KO' || amount <= 0) return;
        this.rage = Math.min(this.maxRage, this.rage + amount);
        if (this.rage >= this.maxRage) {

      getSpeedMultiplier() {
        let mult = this.awakenTimer > 0 ? (this.attacks.ULTIMATE.speedMult || 1.22) : 1.0;
        if (this.pirateBuffTimer > 0) mult *= (this.attacks.SKILL2.speedMult || 1.24);
        if (this.isWerewolf) mult *= 1.18;
        if (this.isDebuffedByRain()) mult *= 0.75;
        if (this.gambleSlowTimer > 0) mult *= 0.65;
        if (this.begStenchTimer > 0) mult *= 0.60;
        if (this.gambleBuffTimer > 0) mult *= 1.25;
        if (this.poseidonSlowTimer > 0) mult *= (1 - 0.17 * Math.min(2, this.poseidonSlowStacks));
        return mult;
      }

      getDamageMultiplier() {
        let mult = this.awakenTimer > 0 ? (this.attacks.ULTIMATE.damageMult || 1.2) : 1.0;
        if (this.knightBuffTimer > 0) mult *= (this.attacks.SKILL2.damageMult || 1.25);
        if (this.pirateBuffTimer > 0) mult *= (this.attacks.SKILL2.damageMult || 1.25);
        if (this.tkdAtkDefTimer > 0) mult *= (this.attacks.SKILL2.damageMult || 1.25);
        if (this.gambleBuffTimer > 0) mult *= 1.35;
        if (this.jobId === 'HUNTER' && this.hunterAmmoTimer > 0) mult *= 1.45;
        if (this.isDebuffedByRain()) mult *= 0.75;
        return mult;
      }

      getEffectiveFrames(spec) {
        if (this.jobId === 'WEREWOLF' && spec.skillStyle === 'WEREWOLF_SKILL1' && this.isWerewolf) {
          return {
            startup: spec.wolfStartup,
            active: spec.wolfActive,
            recovery: spec.wolfRecovery
          };
        }
        if (this.jobId === 'WEREWOLF' && spec.skillStyle === 'WEREWOLF_SKILL2' && this.isWerewolf) {
          return {
            startup: spec.wolfStartup,
            active: spec.wolfActive,
            recovery: spec.wolfRecovery
          };
        }

        let mult = this.awakenTimer > 0 ? (this.attacks.ULTIMATE.speedMult || 1.22) : 1.0;
        if (this.pirateBuffTimer > 0) mult *= (this.attacks.SKILL2.speedMult || 1.24);
        if (mult === 1.0) {
          return {
            startup: spec.startup,
            active: spec.active,
            recovery: spec.recovery
          };
        }
        return {
          startup: Math.max(2, Math.round(spec.startup / mult)),
          active: Math.max(3, Math.round(spec.active / (mult * 0.85))),
          recovery: Math.max(4, Math.round(spec.recovery / mult))
        };
      }

      isGrounded() {
        return this.y >= CONFIG.GROUND_Y - 0.5;
      }

      getHurtbox() {
        const isLow = this.state === 'CROUCH' || this.state === 'KNOCKDOWN';
        const h = isLow ? CONFIG.CROUCH_HEIGHT : CONFIG.PUSHBOX_HEIGHT;
        const w = CONFIG.PUSHBOX_WIDTH;
        return {
          x: this.x - w / 2,
          y: this.y - h,
          width: w,
          height: h
        };
      }

      getActiveHitbox() {
        if (this.state !== 'ATTACK' || !this.attackType) return null;
        const spec = this.attacks[this.attackType];
        if (!spec) return null;

        // Human Werewolf Skill 1 (short dash) and Skill 2 (parry) deal no hitbox damage
        if (this.jobId === 'WEREWOLF' && !this.isWerewolf && (this.attackType === 'SKILL1' || this.attackType === 'SKILL2')) {
          return null;
        }

        if (spec.skillStyle === 'SAMURAI_IAIDO') {
          return this.iaidoLineBox;
        }

        if (spec.ultStyle === 'SONG_METEOR_DUNK') {
          if (this.ultImpactDone && this.stateTimer >= spec.startup && this.stateTimer < spec.startup + spec.active) {
            const centerX = this.x;
            return { x:centerX - 90, y:CONFIG.GROUND_Y - 135, width:180, height:135 };
          }
          return null;
        }

        if (spec.ultStyle === 'VIKING_RAGNAROK') {
          if (this.stateTimer >= spec.startup && this.stateTimer < spec.startup + 6) {
            return {
              x: this.x - 165,
              y: CONFIG.GROUND_Y - 145,
              width: 330,
              height: 150
            };
          }
          return null;
        }

        if (!spec.hitbox) return null;
        const frames = this.getEffectiveFrames(spec);
        const activeStart = frames.startup;
        const activeEnd = frames.startup + frames.active;
        if (this.stateTimer < activeStart || this.stateTimer >= activeEnd) return null;

        const hb = spec.hitbox;
        const rangeMult = (this.jobId === 'TAEKWONDO' && this.tkdRangeTimer > 0) ? 1.15 : 1.0;
        const effWidth = Math.round(hb.width * rangeMult);
        const effHeight = rangeMult > 1.0 ? Math.round(hb.height * 1.15) : hb.height;
        const effOffsetY = rangeMult > 1.0 ? hb.offsetY - Math.round((effHeight - hb.height) * 0.5) : hb.offsetY;
        const boxX = this.facing === 1
          ? this.x + hb.offsetX
          : this.x - hb.offsetX - effWidth;

        return {
          x: boxX,
          y: this.y + effOffsetY,
          width: effWidth,
          height: effHeight
        };
      }

      getUltimateBeamBox() {
        if (this.state !== 'ATTACK' || this.attackType !== 'ULTIMATE') return null;
        const spec = this.attacks.ULTIMATE;
        if (!spec || !spec.beamWidth) return null;
        if (this.stateTimer < spec.startup || this.stateTimer >= spec.startup + spec.active) {
          return null;
        }
        const beamY = this.y - 135;
        const beamX = this.facing === 1 ? this.x + 28 : this.x - 28 - spec.beamWidth;
        return {
          x: beamX,
          y: beamY,
          width: spec.beamWidth,
          height: spec.beamHeight
        };
      }

      canMoveOrAct() {
        if (this.revertStunTimer > 0 || this.aiStunTimer > 0) return false;
        return ['IDLE', 'WALK', 'CROUCH', 'JUMP'].includes(this.state);
      }

      isHoldingBack() {
        if (this.begStenchTimer > 0) return this.facing===1 ? INPUT.isDown(this.controls.right) : INPUT.isDown(this.controls.left);
        if (this.facing === 1) return INPUT.isDown(this.controls.left);
        return INPUT.isDown(this.controls.right);
      }

      isHoldingGuardInput() {
        return INPUT.isDown(this.begStenchTimer>0 ? this.controls.up : this.controls.down) || this.isHoldingBack();
      }

      gainUlt(amount) {
        amount = Number(amount) || 0;
        const scaled = this.jobId === 'TAEKWONDO' ? Math.ceil(amount * 1.55) : amount;
        const beforeUlt = this.ult;
        this.ult = Math.min(CONFIG.MAX_ULT, this.ult + scaled);
        this.notifyUltReady(beforeUlt);
      }

      notifyUltReady(before) {
        if (this.jobId === 'STICKMAN') return;
        if (before < CONFIG.MAX_ULT && this.ult >= CONFIG.MAX_ULT && GAME.phase === 'FIGHT') {
          VFX.spawnFloatingText(this.x, this.y - 190, 'ULTIMATE READY!', '#fde047');
          VFX.shockwaves.push({ x: this.x, y: this.y - 80, radius: 10, maxRadius: 120, life: 18, maxLife: 18, color: '#fde047' });
          VFX.spawnHitSparks(this.x, this.y - 100, '#fde047', 16, 0.9);
          AUDIO.sfxSelectLock();
        }
      }

      update(opponent, projectiles, canControl) {
        this.opponent = opponent;
        this.animTick++;
        if(this.aiSealTimer>0){this.aiSealTimer--;if(!this.aiSealTimer)this.aiSealSlot=null;}

        if(this.aiMissileBursts.length){
          for(const b of this.aiMissileBursts){b.timer--;if(b.timer<=0){

            const shot=new Projectile(this,this.x+this.facing*42,this.y-(high?128:42),this.facing,spec,true);
            shot.aiHigh=high;projectiles.push(shot);b.done=true;

        if (this.displayHp > this.hp) {
          this.displayHp = Math.max(this.hp, this.displayHp - 4.5);

          this.displayHp = this.hp;
